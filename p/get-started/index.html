<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Get started wizard</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{--ink:#111;--frame:#0E0E0E;--on-frame:#A3A3A0;--t2:#4A4A48;--t3:#5C5C59;--line:#E8E8E5;--rowline:#F0F0ED;--page:#F5F5F3;--card:#fff;--fill:#F0F0ED;--fillh:#E4E4E0;--note:#F3F3F0;--red:#A8261B;--redbg:#FDF1EF;--redline:#F6D3CE;--green:#17663A;--greenbg:#EAF5EE;--blue:#1F4FA8;--bluebg:#EDF2FB;--sans:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace;--vh:100dvh;--top:0px;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);overflow-x:hidden}
body{font:15px/1.45 var(--sans);-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font-size:16px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:none;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}

/* frame: band on laptop, header on phone */
.band{position:fixed;top:0;bottom:0;left:0;width:96px;background:var(--frame);display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:16px;z-index:5}
.tile{width:40px;height:40px;border-radius:10px;background:#fff;color:var(--frame);font-weight:700;font-size:14px;display:grid;place-items:center;margin-bottom:14px}
.bi{width:76px;height:60px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--on-frame);font-size:12px;font-weight:500}
.bi.on{background:rgba(255,255,255,.13);color:#fff;font-weight:600}
.bi i{width:20px;height:20px;border-radius:6px;border:2px solid currentColor;opacity:.8}
.phd{display:none}
.page{margin-left:96px;padding:32px max(40px,env(safe-area-inset-right)) 80px 40px;max-width:900px}
.cap{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t3)}
h1{margin:4px 0 20px;font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.gs h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.gs .hd{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.gs .cnt{color:var(--t2);font-size:14px;font-variant-numeric:tabular-nums}
.gs ul{list-style:none;margin:8px 0 0;padding:0}
.gs li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--rowline)}
.gs li:first-child{border-top:0}
.ck{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.ck.d{background:var(--ink);border-color:var(--ink)}
.ck.d::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.ck.s{background:var(--fill);border-color:var(--fill)}
.gs .nm{flex:1;min-width:0}
.gs .nm b{display:block;font-weight:600}
.gs .nm span{font-size:13px;color:var(--t2)}
.gs li.done .nm b{color:var(--t2);font-weight:500}
.btn{border:0;background:var(--fill);border-radius:10px;height:40px;padding:0 16px;font-size:15px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--fillh)}
.btn.pri{background:var(--ink);color:#fff}
.btn.pri:disabled{background:#BDBDB8;color:#fff;cursor:default}
.btn.sm{height:32px;border-radius:8px;font-size:14px;padding:0 12px}
.btn:disabled{cursor:default;opacity:.55}
.lnk{border:0;background:none;padding:0;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.mock{margin-top:24px;background:#1d1d1c;color:#ddd;border-radius:16px;padding:14px 16px;font-size:13px;display:grid;gap:10px}
.mock b{color:#fff;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.mock .r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mseg{display:inline-flex;gap:2px;background:#2a2a2a;padding:2px;border-radius:8px}
.mseg button{border:0;background:none;color:#ccc;height:30px;padding:0 10px;border-radius:6px;font-size:13px}
.mseg button[aria-pressed=true]{background:#fff;color:#111}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:500;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.25)}

/* the wizard panel: side panel on a laptop, the whole screen on a phone. It never scrolls. */
.wz{position:fixed;top:0;right:0;width:520px;height:var(--vh);background:var(--card);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(17,17,17,.12);display:flex;flex-direction:column;z-index:40;overflow:hidden}
.wh{flex:none;display:flex;align-items:center;gap:8px;height:56px;padding:0 12px;border-bottom:1px solid var(--rowline)}
.wh .c{flex:1;min-width:0;text-align:center;font-size:13px;font-weight:600;color:var(--t2);letter-spacing:.02em}
.ib{width:40px;height:40px;border-radius:10px;border:0;background:var(--fill);display:grid;place-items:center;flex:none}
.ib:hover{background:var(--fillh)}
.ib svg{width:20px;height:20px}
.ib.ghost{visibility:hidden}
.prog{flex:none;display:flex;gap:4px;padding:10px 20px 0}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.prog i.d{background:var(--ink)}
.prog i.s{background:#BDBDB8}
.prog i.l{background:repeating-linear-gradient(90deg,var(--ink) 0 4px,transparent 4px 7px);opacity:.35}
.prog i.on{background:var(--ink);opacity:1;outline:2px solid var(--ink);outline-offset:1px}
.wb{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;padding:18px 20px 12px;overflow:hidden}
.wb h2{margin:0;font-size:24px;line-height:1.15;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.wb .sub{margin:-8px 0 0;color:var(--t2);font-size:14px}
.wf{flex:none;display:flex;align-items:center;gap:8px;padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--rowline)}
.wf .sp{flex:1}
.lbl{font-size:14px;font-weight:600}
.hint{font-size:13px;color:var(--t2)}
.fld{display:grid;gap:6px}
.inp{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff}
.inp:focus{border-color:var(--ink);outline:none}
.inpw{position:relative}
.inpw .pre{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--t2)}
.inpw .suf{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--t2);font-size:13px}
.inpw .inp.pp{padding-left:24px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--fill);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;min-height:40px;padding:4px 10px;font-size:15px;font-weight:600;color:var(--t2);line-height:1.2}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tl{border:1px solid var(--line);background:#fff;border-radius:12px;min-height:48px;padding:8px 12px;text-align:left;font-weight:600;display:flex;align-items:center;gap:10px}
.tl .bx{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--line)}
.tl[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tl[aria-pressed=true] .bx{background:var(--ink);border-color:var(--ink);position:relative}
.tl[aria-pressed=true] .bx::after{content:"";position:absolute;left:5px;top:2px;width:5px;height:9px;border:2px solid #fff;border-top:0;border-left:0;transform:rotate(45deg)}
.big{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;text-align:left;display:grid;gap:2px}
.big b{font-size:16px}
.big span{font-size:13px;color:var(--t2)}
.big em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--t3)}
.big[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.stripe{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:10px 12px 10px 14px}
.stripe .t{flex:1;min-width:0}
.stripe .t b{display:block;font-size:15px}
.stripe .t span{font-size:13px;color:var(--t2)}
.stripe.ok{border-color:#CDE7D6;background:var(--greenbg)}
.stripe.wait{border-color:#D6E0F3;background:var(--bluebg)}
.stripe.part{border-color:var(--redline);background:var(--redbg)}
.st{font-size:13px;font-weight:600}
.st.ok{color:var(--green)}.st.wait{color:var(--blue)}.st.part{color:var(--red)}
.div{height:1px;background:var(--rowline);margin:2px 0}
.note{background:var(--note);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--t2)}
.note b{color:var(--ink)}
.dep{background:var(--redbg);border:1px solid var(--redline);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dep span{flex:1;min-width:180px}
.okn{background:var(--greenbg);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--green);font-weight:500}
.rate{display:grid;grid-template-columns:1fr 104px 28px;gap:8px;align-items:center}
.chip{display:inline-block;font-size:12px;font-weight:600;color:var(--t2);background:var(--fill);border-radius:6px;padding:2px 7px}
.days{display:flex;gap:6px}
.days button{flex:1;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px}
.days button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.ta{flex:1;min-height:80px;width:100%;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:16px/1.5 var(--sans);overflow-y:auto}
.ta:focus{border-color:var(--ink);outline:none}
.grow{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:14px}
.drop{width:88px;height:88px;border-radius:16px;border:2px dashed var(--line);display:grid;place-items:center;font-size:12px;color:var(--t2);text-align:center;background:#fff;overflow:hidden;flex:none;position:relative}
.drop img{width:100%;height:100%;object-fit:contain}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sw{display:flex;gap:8px}
.sw button{flex:1;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px;display:grid;gap:6px;justify-items:center;font-size:13px;font-weight:600}
.sw button i{width:100%;height:28px;border-radius:8px}
.sw button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pv{border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.pv .hb{height:48px;display:flex;align-items:center;gap:10px;padding:0 12px;font-weight:700;font-size:15px}
.pv .hb .lg{width:28px;height:28px;border-radius:8px;background:#fff;display:grid;place-items:center;overflow:hidden;font-size:11px;color:#111}
.pv .hb .lg img{width:100%;height:100%;object-fit:contain}
.pv .bd{background:var(--page);padding:10px 12px;display:grid;gap:6px}
.pv .bd i{height:10px;border-radius:5px;background:var(--line);display:block}
.people{display:grid;gap:6px}
.pr{display:flex;align-items:center;gap:10px;font-size:14px;border:1px solid var(--rowline);border-radius:10px;padding:8px 10px}
.pr b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;font-family:var(--mono);font-size:14px}
.link span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.qr{width:132px;height:132px;flex:none;border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff}
.sum{display:grid;gap:4px}
.sum div{display:flex;gap:10px;align-items:center;font-size:14px;padding:6px 0;border-top:1px solid var(--rowline)}
.sum div:first-child{border-top:0}
.sum em{font-style:normal;margin-left:auto;color:var(--t2);font-size:13px}

/* Stripe's pages, simulated: a neutral stand-in, never a copy of Stripe's look */
.away{position:fixed;inset:0;z-index:80;background:#E9E9EC;display:flex;flex-direction:column}
.away .bar{height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#D9D9DE;font:13px var(--mono);color:#333}
.away .bar span{background:#fff;border-radius:8px;padding:4px 10px;flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.away .in{flex:1;display:grid;place-items:center;padding:20px}
.away .bx{background:#fff;border-radius:16px;padding:24px;max-width:420px;width:100%;display:grid;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.away .bx h3{margin:0;font-size:20px}
.away .bx p{margin:0;color:#555;font-size:14px}
.away .tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#777}
.away .bx .btn{width:100%}

@media (min-width:761px){body.wzopen .page{margin-right:520px}}
@media (max-width:760px){
  .band{display:none}
  .phd{display:flex;align-items:center;gap:10px;height:56px;padding:0 16px;background:var(--frame);color:#fff;font-weight:700;position:sticky;top:0;z-index:5}
  .phd .tile{margin:0;width:32px;height:32px;font-size:12px}
  .page{margin-left:0;padding:20px 16px 60px}
  h1{font-size:32px;margin-bottom:16px}
  .wz{width:100%;border-left:0;box-shadow:none}
  .wb{padding:14px 16px 10px;gap:12px}
  .wb h2{font-size:22px}
  .wf{padding-left:16px;padding-right:16px}
  .prog{padding:10px 16px 0}
  .gs .btn.sm{padding:0 10px}
}
@media (max-height:600px){
  .wb .sub{display:none}
  .tl{min-height:40px;padding:6px 10px}
  .stripe{padding:8px 10px 8px 12px}
  .wb h2{font-size:20px}
}
@media (max-height:700px){
  .wb{gap:10px;padding-top:12px}
  .wb h2{font-size:21px}
  .tl{min-height:44px}
  .inp{height:42px}
  .qr{width:108px;height:108px}
}
</style>
</head>
<body>
<nav class="band" aria-label="Sections"><div class="tile">BF</div><div class="bi on"><i></i>Today</div><div class="bi"><i></i>Schedule</div><div class="bi"><i></i>People</div><div class="bi"><i></i>Money</div><div class="bi"><i></i>Settings</div></nav>
<div class="phd"><div class="tile">BF</div>Barrio Fitness</div>
<main class="page">
  <div class="cap" id="dateline"></div>
  <h1>Today</h1>
  <section class="card gs" id="gs" aria-label="Get started"></section>
  <div class="mock">
    <b>Mock controls · not part of the design</b>
    <div class="r">Address <span class="mseg" id="m-where"><button data-v="pr">San Juan, PR</button><button data-v="us">Miami, FL</button></span></div>
    <div class="r">Group classes <span class="mseg" id="m-cls"><button data-v="1">Yes</button><button data-v="0">No</button></span> Staff <span class="mseg" id="m-staff"><button data-v="1">Yes</button><button data-v="0">No</button></span></div>
    <div class="r"><button class="btn sm" id="m-reset">Start over, as just signed up</button></div>
  </div>
</main>
<div class="wz" id="wz" role="dialog" aria-modal="false" aria-labelledby="wzt" hidden></div>
<div class="away" id="away" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IC={back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',del:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'};

/* each country's suggested ways to pay (money req 10's preset), and who-to-pay asked per method */
const PRESET={pr:['ATH Móvil','Cash','Venmo','Zelle','PayPal','Cash App'],us:['Cash','Venmo','Zelle','PayPal','Cash App','Check']};
const PAYTO={'ATH Móvil':['Phone or pATH','787 555 0142'],'Venmo':['Venmo username','@barriofitness'],'Zelle':['Email or phone','pagos@barrio.fit'],'PayPal':['PayPal email','pagos@barrio.fit'],'Cash App':['$Cashtag','$barriofit']};

let S;
function fresh(keep){
  S={where:keep?S.where:'pr',classes:keep?S.classes:true,staff:keep?S.staff:true,
    methods:[],payto:{},card:'none',tax:null,basis:null,rates:[],
    plan:{kind:null,name:'',price:'',every:'month',visits:'',within:'3'},
    logo:null,frame:'black',waiver:{name:'',text:'',when:null},
    cls:{name:'',days:[],time:'',cap:''},people:[],draft:{name:'',email:'',role:null},
    status:{},open:true,cur:'pay',sub:0,returnTo:null,stripeFrom:null};
  ratesFor();
}
function ratesFor(){S.rates=S.where==='pr'?[{n:'State IVU',r:'10.5',sug:true},{n:'Municipal IVU',r:'1',sug:true}]:[{n:'',r:''}];}

/* the steps, in order; tax only while not answered No, class and staff only where the business has them */
const NAMES={pay:'How people pay you',tax:'Tax',plan:'Your first plan or pack',look:'Your look',waiver:'Your waiver',class:'Your first class',staff:'Your staff',join:'Your Join link'};
function ids(){return ['pay',S.tax===false?null:'tax','plan','look','waiver',S.classes?'class':null,S.staff?'staff':null,'join'].filter(Boolean);}
const SUBS={pay:()=>needPayTo()?2:1,plan:()=>2,waiver:()=>2};
const subs=id=>SUBS[id]?SUBS[id]():1;
function needPayTo(){return S.methods.some(m=>PAYTO[m]);}
const skippable=id=>id==='look'||id==='waiver';
const planDone=()=>S.status.plan==='done';

/* ---------- Today's checklist ---------- */
function drawToday(){
  const list=ids(),done=list.filter(i=>S.status[i]==='done'||S.status[i]==='skipped').length;
  const firstOpen=list.find(i=>!(S.status[i]==='done'||S.status[i]==='skipped'));
  if(done===list.length){$('#gs').innerHTML='<div class="hd"><h2>You’re all set up</h2></div><p class="hint" style="margin:0">Every step is done. This card goes away tomorrow.</p>';return;}
  $('#gs').innerHTML='<div class="hd"><h2>Get started</h2><span class="cnt">'+done+' of '+list.length+'</span></div>'+
   '<ul>'+list.map(i=>{const st=S.status[i];const d=st==='done',sk=st==='skipped';
     return '<li class="'+(d||sk?'done':'')+'"><span class="ck '+(d?'d':sk?'s':'')+'"></span><div class="nm"><b>'+NAMES[i]+'</b>'+
      (sk?'<span>Skipped · <button class="lnk" data-undo="'+i+'">Undo</button></span>':st==='later'?'<span>Later</span>':'')+'</div>'+
      (d||sk?'':'<button class="btn sm '+(i===firstOpen&&!S.open?'pri':'')+'" data-start="'+i+'">Start</button>')+'</li>';}).join('')+'</ul>';
}
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-start]');if(s){openAt(s.dataset.start);return;}
  const u=e.target.closest('[data-undo]');if(u){delete S.status[u.dataset.undo];drawAll();}
});

/* ---------- the panel ---------- */
function openAt(id,sub){
  if(id==='plan'&&S.tax===null&&ids().includes('tax')){S.returnTo=null;id='tax';toast('Answer tax first, your price depends on it');}
  S.cur=id;S.sub=sub||0;S.open=true;drawAll();
}
function closeWz(){S.open=false;drawAll();}
function move(dir){
  const list=ids();let i=list.indexOf(S.cur);
  if(dir<0){if(S.sub>0){S.sub--;}else if(i>0){S.cur=list[i-1];S.sub=subs(S.cur)-1;}drawAll();return;}
  if(S.sub<subs(S.cur)-1){S.sub++;drawAll();return;}
  if(S.returnTo&&list.includes(S.returnTo)){const r=S.returnTo;S.returnTo=null;S.cur=r;S.sub=0;drawAll();return;}
  if(i<list.length-1){S.cur=list[i+1];S.sub=0;
    if(S.cur==='plan'&&S.tax===null){S.cur='tax';}
  }else{S.cur='end';}
  drawAll();
}
function finishStep(st){S.status[S.cur]=st;move(1);}

function drawWz(){
  const wz=$('#wz');wz.hidden=!S.open;document.body.classList.toggle('wzopen',S.open);if(!S.open)return;
  const list=ids();

  $('#st-go').onclick=()=>{S.stripeFrom=S.cur;const a=$('#away');a.hidden=false;
   a.innerHTML='<div class="bar">🔒 <span>connect.stripe.com/setup/…</span></div><div class="in"><div class="bx"><div class="tag">Simulated · Stripe’s own pages appear here</div><h3>Barrio Fitness on Stripe</h3><p>She types her business details, her ID and her bank account on Stripe’s pages. Zana never sees them. Pick how she comes back:</p>'+
   '<button class="btn pri" data-ret="ok">Finish · approved right away</button><button class="btn" data-ret="wait">Finish · Stripe still checking</button><button class="btn" data-ret="part">Leave before finishing</button></div></div>';
   a.querySelectorAll('[data-ret]').forEach(b=>b.onclick=()=>comeBack(b.dataset.ret));};
}
function comeBack(how){
  $('#away').hidden=true;S.card=how;S.open=true;S.cur='pay';S.sub=0;
  toast({ok:'Back from Stripe · cards are on',wait:'Back from Stripe · they’re checking your details',part:'Back from Stripe · not finished yet'}[how]);
  drawAll();
}

/* ---------- the rest ---------- */
let tt;function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2400);}
function drawAll(){drawToday();drawWz();drawMock();}
function drawMock(){
  const set=(id,v)=>document.querySelectorAll(id+' button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));
  set('#m-where',S.where);set('#m-cls',S.classes?'1':'0');set('#m-staff',S.staff?'1':'0');
}
document.querySelectorAll('#m-where button').forEach(b=>b.onclick=()=>{S.where=b.dataset.v;S.methods=[];S.payto={};ratesFor();drawAll();});
document.querySelectorAll('#m-cls button').forEach(b=>b.onclick=()=>{S.classes=b.dataset.v==='1';if(!S.classes&&S.cur==='class')S.cur='join';drawAll();});
document.querySelectorAll('#m-staff button').forEach(b=>b.onclick=()=>{S.staff=b.dataset.v==='1';if(!S.staff&&S.cur==='staff')S.cur='join';drawAll();});
$('#m-reset').onclick=()=>{fresh(true);drawAll();};
$('#dateline').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
/* the panel fits the visible screen, keyboard included, so it never scrolls */
function fit(){const v=window.visualViewport;document.documentElement.style.setProperty('--vh',(v?v.height:innerHeight)+'px');const w=$('#wz');if(w&&v)w.style.top=v.offsetTop+'px';}
if(window.visualViewport){visualViewport.addEventListener('resize',fit);visualViewport.addEventListener('scroll',fit);}addEventListener('resize',fit);fit();
fresh();drawAll();
</script>
</body>
</html>
