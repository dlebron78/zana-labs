<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#C4161C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Barrio">
<link rel="icon" href="data:,">
<title>Barrio Fitness</title>
<meta name="description" content="High-fidelity prototype of the Zana member home: what a member of Barrio Fitness sees when she signs in. The page is the app. Sample members and versions are in the small button in the corner.">
<!-- Geist is Zana's face. Loaded from Google Fonts here because this is a labs page. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&display=swap">
<link rel="stylesheet" href="../../kit/zana.css">
<link rel="stylesheet" href="home.css?v=16">
</head>
<body class="mh">
<section class="phone" id="mh-phone" aria-label="Barrio Fitness member app">
  <div class="m-top" id="mh-top"></div>
  <div class="m-scroll" id="mh-scroll"></div>
  <div class="m-bottom" id="mh-bottom"></div>
  <div class="m-layer" id="mh-layer"></div>
</section>

<!-- The sample menu. Not part of the app: it switches between the versions of this prototype. -->
<button type="button" class="dm-fab" data-do="demo" aria-expanded="false" aria-controls="mh-demo" aria-label="Versions of this prototype"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
<div class="dm" id="mh-demo" role="dialog" aria-label="Versions of this prototype" hidden>
  <div class="dm-h"><b>Prototype versions</b><span>not part of the app</span><button type="button" class="dm-x" data-do="demo" aria-label="Close"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2 2 12"/></svg></button></div>
  <div class="dm-g">
    <span class="dm-l" id="dm-l-m">Member</span>
    <span class="vw-seg" role="group" aria-labelledby="dm-l-m">
      <button type="button" data-set="m:ines" aria-pressed="false"><b>Inés</b><i>drop-in</i></button>
      <button type="button" data-set="m:maria" aria-pressed="true"><b>María</b><i>unlimited</i></button>
      <button type="button" data-set="m:rafa" aria-pressed="false"><b>Rafa</b><i>1:1 client</i></button>
      <button type="button" data-set="m:carmen" aria-pressed="false"><b>Carmen</b><i>parent</i></button>
      <button type="button" data-set="m:luis" aria-pressed="false"><b>Luis</b><i>overdue</i></button>
    </span>
  </div>
  <div class="dm-g">
    <span class="dm-l" id="dm-l-g">Overdue payment (Luis, Carmen)</span>
    <span class="vw-seg" role="group" aria-labelledby="dm-l-g">
      <button type="button" data-set="grace:in" aria-pressed="true"><b>In grace</b><i>can still book</i></button>
      <button type="button" data-set="grace:out" aria-pressed="false"><b>Grace over</b><i>pay first</i></button>
    </span>
  </div>
  <div class="dm-g">
    <span class="dm-l" id="dm-l-pay">Pay screens: open one</span>
    <span class="vw-seg dm-flow" role="group" aria-labelledby="dm-l-pay">
      <button type="button" data-do="flow" data-arg="pack"><b>Buy a pack</b><i>Carmen</i></button>
      <button type="button" data-do="flow" data-arg="buy"><b>Add card and buy</b><i>Inés</i></button>
      <button type="button" data-do="flow" data-arg="first"><b>Bank asks to confirm</b><i>Inés</i></button>
      <button type="button" data-do="flow" data-arg="change"><b>Change card</b><i>María</i></button>
      <button type="button" data-do="flow" data-arg="decline"><b>Declined</b><i>Luis</i></button>
      <button type="button" data-do="flow" data-arg="funds"><b>Not enough money</b><i>Luis</i></button>
      <button type="button" data-do="flow" data-arg="receipts"><b>Receipts</b><i>María</i></button>
    </span>
  </div>
  <div class="dm-g">
    <span class="dm-l" id="dm-l-card">Card on file (everyone)</span>
    <span class="vw-seg" role="group" aria-labelledby="dm-l-card">
      <button type="button" data-set="card:saved" aria-pressed="true"><b>Saved</b><i>Visa 4242</i></button>
      <button type="button" data-set="card:none" aria-pressed="false"><b>None yet</b><i>new member</i></button>
    </span>
  </div>
  <div class="dm-g">
    <span class="dm-l" id="dm-l-charge">Saved cards when charged</span>
    <span class="vw-seg" role="group" aria-labelledby="dm-l-charge">
      <button type="button" data-set="charge:ok" aria-pressed="true"><b>Go through</b></button>
      <button type="button" data-set="charge:decline" aria-pressed="false"><b>Declined</b><i>by the bank</i></button>
      <button type="button" data-set="charge:funds" aria-pressed="false"><b>Not enough money</b></button>
    </span>
  </div>
  <div class="dm-g">
    <span class="dm-l" id="dm-l-wallet">Apple Pay and Link on the card form</span>
    <span class="vw-seg" role="group" aria-labelledby="dm-l-wallet">
      <button type="button" data-set="wallet:off" aria-pressed="true"><b>Off</b><i>Zana's code today</i></button>
      <button type="button" data-set="wallet:on" aria-pressed="false"><b>On</b><i>not decided</i></button>
    </span>
  </div>
  <div class="dm-g">
    <span class="dm-l" id="dm-l-fx">Review fixes 1, 3, 4 and 5</span>
    <span class="vw-seg" role="group" aria-labelledby="dm-l-fx">
      <button type="button" data-set="fx:on" aria-pressed="true"><b>On</b></button>
      <button type="button" data-set="fx:off" aria-pressed="false"><b>Off</b></button>
    </span>
  </div>
  <div class="dm-g">
    <span class="dm-l" id="dm-l-span">Program release: show workouts</span>
    <span class="vw-seg" role="group" aria-labelledby="dm-l-span">
      <button type="button" data-set="span:day" aria-pressed="true"><b>One day at a time</b></button>
      <button type="button" data-set="span:week" aria-pressed="false"><b>The whole week</b></button>
    </span>
  </div>
  <div class="dm-g">
    <span class="dm-l" id="dm-l-when">Program release: when</span>
    <span class="vw-seg" role="group" aria-labelledby="dm-l-when">
      <button type="button" data-set="when:before" aria-pressed="true"><b>Day before</b><i>8 PM</i></button>
      <button type="button" data-set="when:midnight" aria-pressed="false"><b>Midnight</b></button>
    </span>
  </div>
  <div class="dm-g">
    <span class="dm-l" id="dm-l-lang">Language</span>
    <span class="vw-seg" role="group" aria-labelledby="dm-l-lang">
      <button type="button" data-set="lang:en" aria-pressed="true"><b>English</b></button>
      <button type="button" data-set="lang:es" aria-pressed="false"><b>Español</b></button>
    </span>
  </div>
  <div class="dm-row">
    <button type="button" class="vw-btn" data-do="reset">Start over</button>
    <button type="button" class="vw-btn" data-do="notes">Notes on this member</button>
    <a class="vw-link" href="spec.html">The plan</a>
  </div>
</div>
<aside class="notes" id="mh-notes" aria-label="Notes on this sample"></aside>
<noscript><p class="vw-noscript">This prototype is drawn in the browser, so it needs JavaScript switched on. The plan in plain words is on <a href="spec.html">its own page</a>.</p></noscript>
<script type="module" src="app.js?v=13"></script>
</body>
</html>
