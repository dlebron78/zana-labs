<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gym page: six styles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&family=Figtree:wght@400;500;600&family=Marcellus&family=Hanken+Grotesk:wght@400;500;600&family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&family=Archivo:wght@300;400;500;600&family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=Barlow:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#e9e9e6;color:#111;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}

/* ---------- prototype chrome ---------- */
.top{background:#111;color:#fff;position:sticky;top:0;z-index:20;padding:10px 16px 12px;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.top .r{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;max-width:1280px;margin:0 auto}
.top .t{font-size:13px;font-weight:600;letter-spacing:.02em;margin-right:4px;white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:transparent;border:1px solid #444;color:#ccc;border-radius:999px;padding:7px 13px;font-size:14px;white-space:nowrap;min-height:36px}
.tabs button.on{background:#fff;color:#111;border-color:#fff;font-weight:600}
.ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pals{display:flex;gap:6px;align-items:center}
.pals button{display:flex;align-items:center;gap:6px;background:transparent;border:1px solid #444;color:#ccc;border-radius:999px;padding:4px 10px 4px 5px;font-size:13px;min-height:32px}
.pals button.on{border-color:#fff;color:#fff}
.pals i{display:inline-flex;border-radius:999px;overflow:hidden;border:1px solid rgba(255,255,255,.35)}
.pals i b{display:block;width:10px;height:18px}
.lang{display:flex;border:1px solid #444;border-radius:999px;overflow:hidden}
.lang button{background:transparent;border:0;color:#ccc;padding:5px 12px;font-size:13px;min-height:32px}
.lang button.on{background:#fff;color:#111;font-weight:600}
.about{max-width:1280px;margin:8px auto 0;font-size:13px;line-height:1.45;color:#cfcfcf}
.about b{color:#fff;font-weight:600}
.stage{padding:20px 16px 48px}
.frame{max-width:1280px;margin:0 auto;border-radius:12px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.12);border:1px solid #c9c9c6}
.frame + .lbl{margin-top:44px}
.lbl{max-width:1280px;margin:0 auto 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lbl b{font-size:20px}
.lbl span{font-size:14px;color:#555}
@media (max-width:640px){
  .stage{padding:12px 0 40px}
  .frame{border-radius:0;border-left:0;border-right:0}
  .lbl{padding:0 16px}
  .top .t{display:none}
  .top{position:static}
  .pals button span{display:none}
  .pals button{padding:4px}
  .about{font-size:12px}
}

/* ---------- the gym page, shared structure ---------- */
.gp{background:var(--bg);color:var(--ink);font-family:var(--bf);font-size:var(--body);line-height:1.6;--gut:clamp(20px,5vw,64px);overflow:hidden}
.gp a{color:inherit;text-decoration:none}
.gp h1,.gp h2,.gp h3{font-family:var(--hf);font-weight:var(--hw);text-transform:var(--hcase);letter-spacing:var(--htr);line-height:var(--hlh);margin:0}
.gp h1{font-size:var(--h1)}
.gp h2{font-size:var(--h2)}
.gp h3{font-size:var(--h3,24px);line-height:1.15}
.gp p{margin:0}
.lab{font-family:var(--lf,var(--bf));font-size:var(--lsz);letter-spacing:var(--ltr);text-transform:var(--lcase);font-weight:var(--lw);line-height:1.3}
.inner{max-width:1180px;margin:0 auto}
.offer{background:var(--acc);color:var(--accInk);text-align:center;padding:9px var(--gut)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px var(--gut)}
.logo{font-family:var(--hf);font-weight:var(--logow,var(--hw));font-size:24px;letter-spacing:var(--logotr,.04em);text-transform:uppercase;line-height:1;white-space:nowrap}
.hd nav{display:flex;gap:28px;margin-left:auto;margin-right:12px}
.gp .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--acc);color:var(--accInk);border:1px solid var(--acc);border-radius:var(--br);padding:15px 26px;white-space:nowrap}
.gp .btn.ghost{background:transparent;color:inherit;border-color:currentColor}
.gp .btn.sm{padding:11px 18px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.sub{font-size:calc(var(--body) + 1px);max-width:34em;opacity:.86}
.sec{padding:var(--sp) var(--gut)}
.band{background:var(--band);color:var(--bandInk,var(--ink))}
.band .btn{background:var(--bandBtn,var(--acc));border-color:var(--bandBtn,var(--acc));color:var(--bandBtnInk,var(--accInk))}
.gp .band .btn.ghost{background:transparent;color:inherit;border-color:currentColor}
.shead{display:flex;flex-direction:column;gap:14px;margin-bottom:clamp(32px,4vw,56px)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2.4vw,32px)}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--cr)}
.card h3{margin:18px 0 8px}
.card p{opacity:.8;max-width:30em}
.sched{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:150px 1fr 140px 150px auto;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.row .cls{font-family:var(--hf);font-weight:var(--hw);text-transform:var(--hcase);letter-spacing:var(--htr);font-size:var(--rowsz,22px);line-height:1.1}
.row .spots{opacity:.75}
.row .full{opacity:.5}
.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2vw,28px);align-items:stretch}
.plan{border:1px solid var(--line);border-radius:var(--cr);padding:clamp(24px,3vw,36px);display:flex;flex-direction:column;gap:12px}
.plan .amt{font-family:var(--hf);font-weight:var(--hw);font-size:clamp(40px,4.4vw,56px);line-height:1;letter-spacing:var(--htr)}
.plan .amt small{font-family:var(--bf);font-size:16px;font-weight:400;letter-spacing:0;opacity:.7;margin-left:4px;text-transform:none}
.plan p{opacity:.8}
.plan .btn{margin-top:auto;align-self:flex-start}
.plan.feat{background:var(--featBg,var(--band));color:var(--featInk,var(--ink));border-color:var(--featBg,var(--band))}
.plan .tagx{align-self:flex-start;background:var(--acc);color:var(--accInk);border-radius:var(--br);padding:5px 11px}
.ft{padding:clamp(48px,6vw,80px) var(--gut);border-top:1px solid var(--line)}
.ft .inner{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:28px;align-items:start}
.ft p{opacity:.8}
.ft .lab{margin-bottom:10px;opacity:1}
.marq{overflow:hidden;white-space:nowrap;background:var(--acc);color:var(--accInk);padding:14px 0}
.marq div{display:inline-block;animation:mq 30s linear infinite;padding-left:24px}
.marq span{margin-right:28px}
@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.marq div{animation:none}}

/* hero layouts */
.hero{position:relative}
.hero .copy{display:flex;flex-direction:column;gap:22px}

/* ---------- 1. Serene ---------- */
.st-serene{--hf:'Newsreader',Georgia,serif;--bf:'Figtree',system-ui,sans-serif;--hw:400;--hcase:none;--htr:-.01em;--hlh:1.04;
 --h1:clamp(46px,6.4vw,82px);--h2:clamp(34px,4.2vw,54px);--h3:26px;--lsz:12px;--ltr:.14em;--lcase:uppercase;--lw:600;
 --sp:clamp(80px,10vw,140px);--body:18px;--cr:16px;--br:999px;--rowsz:24px;--logotr:.18em;--logow:400}
.st-serene .gp,.gp.st-serene{line-height:1.65}
.st-serene .logo{font-size:20px}
.st-serene h1 em,.st-serene h2 em{font-style:italic;color:var(--acc)}
.st-serene .hero{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(32px,5vw,80px);align-items:center;padding:clamp(40px,6vw,88px) var(--gut) var(--sp)}
.st-serene .hero .arch{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:999px 999px var(--cr) var(--cr)}
.st-serene .badge{position:absolute;right:calc(var(--gut) + 10px);bottom:calc(var(--sp) + 20px);width:118px;height:118px;border-radius:50%;background:var(--acc);color:var(--accInk);display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;font-family:var(--hf);font-style:italic;font-size:19px;line-height:1.1}
.st-serene .plan.feat{--featBg:var(--band)}

/* ---------- 2. Atelier ---------- */
.st-atelier{--hf:'Marcellus',Georgia,serif;--bf:'Hanken Grotesk',system-ui,sans-serif;--hw:400;--hcase:uppercase;--htr:.02em;--hlh:.98;
 --h1:clamp(54px,9.4vw,128px);--h2:clamp(38px,5.2vw,68px);--h3:24px;--lsz:12px;--ltr:.18em;--lcase:uppercase;--lw:500;
 --sp:clamp(88px,11vw,160px);--body:17px;--cr:0;--br:0;--rowsz:22px;--logotr:.22em}
.st-atelier .offer,.st-atelier .marq{background:var(--ink);color:var(--bg)}
.st-atelier .hd{position:absolute;left:0;right:0;z-index:2;color:#fff}
.st-atelier .hd .btn{background:#fff;border-color:#fff;color:#111}
.st-atelier .hero{min-height:clamp(560px,78vh,820px);color:#fff;display:grid;grid-template-rows:1fr auto 1fr;padding:110px var(--gut) 48px}
.st-atelier .hero > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.st-atelier .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.15) 40%,rgba(0,0,0,.45));z-index:0}
.st-atelier .hero > *:not(img){position:relative;z-index:1}
.st-atelier .h-a{align-self:end;justify-self:start}
.st-atelier .h-b{align-self:start;justify-self:end;text-align:right}
.st-atelier .hero .mid{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:28px 0;border-top:1px solid rgba(255,255,255,.5);border-bottom:1px solid rgba(255,255,255,.5);margin:26px 0}
.st-atelier .hero .mid .btn{background:#fff;color:#111;border-color:#fff}
.st-atelier .band{--bandInk:var(--bandInk0)}
.st-atelier .plan{border-color:currentColor}
.st-atelier .plan.feat{--featBg:var(--ink);--featInk:var(--bg)}
.st-atelier .plan.feat .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.st-atelier .plan.feat .tagx{background:var(--bg);color:var(--ink)}
.st-atelier .marq{font-size:13px;letter-spacing:.2em;text-transform:uppercase;padding:16px 0}
.st-atelier .card img{aspect-ratio:3/4}

/* ---------- 3. Studio ---------- */
.st-studio{--hf:'Inter Tight',system-ui,sans-serif;--bf:'Inter',system-ui,sans-serif;--hw:600;--hcase:none;--htr:-.03em;--hlh:1.02;
 --h1:clamp(42px,5.8vw,74px);--h2:clamp(32px,3.8vw,48px);--h3:22px;--lsz:12px;--ltr:.08em;--lcase:uppercase;--lw:600;
 --sp:clamp(64px,8vw,112px);--body:17px;--cr:4px;--br:4px;--rowsz:20px;--logotr:-.01em;--logow:700}
.st-studio h1 em,.st-noir h1 em{font-style:normal}
.st-studio .logo{text-transform:none;font-size:22px}
.st-studio .hd{border-bottom:1px solid var(--line)}
.st-studio .hd nav .lab{text-transform:none;letter-spacing:0;font-size:15px;font-weight:500}
.st-studio .hero{display:grid;grid-template-columns:1fr 1fr;min-height:clamp(480px,68vh,700px)}
.st-studio .hero img{width:100%;height:100%;object-fit:cover}
.st-studio .hero .copy{justify-content:center;padding:clamp(40px,6vw,96px) var(--gut)}
.st-studio .plan.feat{--featBg:var(--ink);--featInk:var(--bg)}
.st-studio .plan.feat .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.st-studio .plan.feat .tagx{background:var(--bg);color:var(--ink)}

/* ---------- 4. Noir ---------- */
.st-noir{--hf:'Archivo',system-ui,sans-serif;--bf:'Archivo',system-ui,sans-serif;--hw:300;--hcase:uppercase;--htr:.03em;--hlh:.96;
 --h1:clamp(46px,7.4vw,98px);--h2:clamp(32px,4.2vw,54px);--h3:22px;--lsz:12px;--ltr:.16em;--lcase:uppercase;--lw:500;
 --sp:clamp(80px,10vw,140px);--body:17px;--cr:0;--br:0;--rowsz:20px;--logotr:.32em;--logow:500}
.st-noir .offer{background:transparent;color:var(--ink);border-bottom:1px solid var(--line)}
.st-noir .sub,.st-noir .card p,.st-noir .plan p,.st-noir .ft p{color:var(--mut);opacity:1}
.st-noir .hero{padding:clamp(48px,7vw,104px) var(--gut) var(--sp)}
.st-noir .hero .copy{display:grid;grid-template-columns:1.3fr 1fr;gap:clamp(24px,4vw,64px);align-items:end;margin-bottom:clamp(36px,5vw,64px)}
.st-noir .hero .copy .side{display:flex;flex-direction:column;gap:22px}
.st-noir .frm{border:1px solid var(--line);padding:clamp(10px,1.4vw,18px)}
.st-noir .frm img{width:100%;aspect-ratio:21/9;object-fit:cover;filter:grayscale(.35) contrast(1.05) brightness(.9)}
.st-noir .card img{filter:grayscale(.35) brightness(.9)}
.st-noir .card{border:1px solid var(--line);padding:12px 12px 24px}
.st-noir .card h3,.st-noir .card p{padding:0 8px}
.st-noir .plan.feat{--featBg:transparent;border-color:var(--acc)}
.st-noir .btn.ghost{border-color:var(--line)}

/* ---------- 5. Power ---------- */
.st-power{--hf:'Barlow Condensed',Impact,sans-serif;--bf:'Barlow',system-ui,sans-serif;--hw:800;--hcase:uppercase;--htr:.005em;--hlh:.88;
 --h1:clamp(66px,11.4vw,148px);--h2:clamp(46px,6.2vw,84px);--h3:30px;--lsz:13px;--ltr:.08em;--lcase:uppercase;--lw:700;
 --sp:clamp(56px,7vw,96px);--body:17px;--cr:6px;--br:6px;--rowsz:28px;--logotr:.02em;--logow:800}
.st-power .logo{font-size:30px;font-style:italic}
.st-power .hd{background:var(--bg);position:relative;z-index:2}
.st-power .hero{min-height:clamp(560px,80vh,840px);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:48px var(--gut) clamp(36px,5vw,64px)}
.st-power .hero > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.st-power .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1) 20%,rgba(0,0,0,.85))}
.st-power .hero > *:not(img){position:relative;z-index:1}
.st-power h1 em{font-style:italic;color:var(--accTxt,var(--acc))}
.st-power .stats{display:flex;gap:clamp(24px,5vw,72px);margin-top:28px;padding-top:24px;border-top:2px solid rgba(255,255,255,.25);flex-wrap:wrap}
.st-power .stats b{display:block;font-family:var(--hf);font-weight:800;font-size:clamp(36px,4vw,52px);line-height:1}
.st-power .marq{font-family:var(--hf);font-weight:800;font-size:clamp(22px,2.6vw,32px);text-transform:uppercase;letter-spacing:.02em;font-style:italic;padding:16px 0}
.st-power .card{background:var(--band);border-radius:var(--cr);overflow:hidden}
.st-power .card img{border-radius:0;aspect-ratio:16/10;filter:contrast(1.1) saturate(.85)}
.st-power .card h3,.st-power .card p{padding:0 22px}
.st-power .card p{padding-bottom:24px}
.st-power .plan.feat{--featBg:var(--acc);--featInk:var(--accInk)}
.st-power .plan.feat .btn{background:var(--accInk);color:var(--acc);border-color:var(--accInk)}
.st-power .plan.feat .tagx{background:var(--accInk);color:var(--acc)}
.st-power .row .cls{font-style:italic}

/* ---------- 6. Barrio ---------- */
.st-barrio{--hf:'Bricolage Grotesque',system-ui,sans-serif;--bf:'DM Sans',system-ui,sans-serif;--hw:700;--hcase:none;--htr:-.025em;--hlh:1;
 --h1:clamp(46px,7vw,90px);--h2:clamp(34px,4.6vw,58px);--h3:26px;--lsz:14px;--ltr:0;--lcase:none;--lw:600;
 --sp:clamp(64px,7.5vw,104px);--body:17px;--cr:20px;--br:999px;--rowsz:22px;--logotr:-.01em;--logow:800}
.st-barrio .logo{text-transform:none;font-size:28px}
.st-barrio h1 em,.st-barrio h2 em{font-style:normal;background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%);padding:0 .06em}
.st-barrio .hero{display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,5vw,72px);align-items:center;padding:clamp(32px,5vw,72px) var(--gut) var(--sp)}
.st-barrio .collage{position:relative;aspect-ratio:1/1;max-width:560px;width:100%;justify-self:center}
.st-barrio .collage img{position:absolute;object-fit:cover;border-radius:var(--cr);border:6px solid #fff;box-shadow:0 10px 30px rgba(0,0,0,.14)}
.st-barrio .collage .c1{width:62%;aspect-ratio:4/5;left:0;top:4%;transform:rotate(-4deg)}
.st-barrio .collage .c2{width:52%;aspect-ratio:1/1;right:0;top:0;transform:rotate(5deg)}
.st-barrio .collage .c3{width:56%;aspect-ratio:4/3;right:6%;bottom:0;transform:rotate(-2deg)}
.st-barrio .sticker{position:absolute;left:46%;top:44%;z-index:3;background:var(--acc);color:var(--accInk);border-radius:999px;padding:12px 18px;font-family:var(--hf);font-weight:800;font-size:18px;transform:rotate(-8deg);box-shadow:0 6px 18px rgba(0,0,0,.15)}
.st-barrio .card{background:var(--band);border-radius:var(--cr);padding:12px 12px 26px}
.st-barrio .card h3,.st-barrio .card p{padding:0 10px}
.st-barrio .plan{background:#fff8;border:2px solid var(--line)}
.st-barrio .plan.feat{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.st-barrio .plan.feat .btn{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.st-barrio .plan.feat .tagx{background:var(--ink);color:var(--bg)}

/* ---------- phone ---------- */
@media (max-width:820px){
  .hd nav{display:none}
  .cards,.prices{grid-template-columns:1fr}
  .row{grid-template-columns:1fr auto;gap:4px 12px;padding:16px 0}
  .row .when{grid-column:1/-1;order:-1}
  .row .who{display:none}
  .row .spots{grid-column:1;font-size:15px}
  .row .btn{grid-row:2/4;grid-column:2}
  .ft .inner{grid-template-columns:1fr}
  .st-serene .hero,.st-studio .hero,.st-barrio .hero{grid-template-columns:1fr}
  .st-serene .hero .arch{aspect-ratio:1/1;border-radius:999px 999px var(--cr) var(--cr)}
  .st-serene .badge{width:96px;height:96px;font-size:16px;bottom:calc(var(--sp) + 12px)}
  .st-studio .hero img{aspect-ratio:4/3;height:auto}
  .st-noir .hero .copy{grid-template-columns:1fr}
  .st-noir .frm img{aspect-ratio:4/3}
  .st-atelier .hero{min-height:620px;padding-top:96px}
  .st-atelier .hero .mid{flex-direction:column;align-items:flex-start}
  .st-barrio .collage{max-width:420px}
  .btn{padding:14px 20px}
  .hd .btn{padding:10px 14px}
}
</style>
</head>
<body>
<div class="top">
  <div class="r">
    <span class="t">Six styles</span>
    <div class="tabs" id="tabs"></div>
    <div class="ctl">
      <div class="pals" id="pals"></div>
      <div class="lang" id="lang"><button data-l="en">EN</button><button data-l="es">ES</button></div>
    </div>
  </div>
  <div class="about" id="about"></div>
</div>
<main class="stage" id="stage"></main>

<script>
const IMG = '../gym-page/img/';
const STYLES = [
  {id:'serene', name:'Serene', who:{en:'Yoga, meditation, spa and recovery',es:'Yoga, meditación, spa y recuperación'}, fonts:'Newsreader + Figtree', like:'Yoga Off East, Othership',
   pals:[

const state = {s:'serene', p:{}, l:'en'};
try{
  const q = new URLSearchParams(location.search);
  if (q.get('s') && (STYLES.some(x=>x.id===q.get('s')) || q.get('s')==='all')) state.s = q.get('s');
  if (q.get('lang')==='es') state.l = 'es';
  if (q.get('p')) state.p[state.s] = Math.max(0,Math.min(2,+q.get('p')-1||0));
}catch(e){}

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const br = s => esc(s).replace(/\n/g,'<br>');

function h1(st,t){
  const [a,b,c] = t.h1;
  const end = (st==='studio'||st==='power'||st==='atelier') ? '.' : '';
  if (st==='atelier') return `<h1 class="h-a">${esc(a)} ${esc(b)}</h1>`;
  return `<h1>${esc(a)} <em>${esc(b)}</em> ${esc(c)}${end}</h1>`;
}
function hero(st,t){
  const lab = `<p class="lab">${esc(t.eyebrow)}</p>`;
  const btns = `<div class="btns"><a class="btn" href="#">${esc(t.book)}</a><a class="btn ghost" href="#">${esc(t.see)}</a></div>`;
  const sub = `<p class="sub">${esc(t.sub)}</p>`;
  switch(st){
   case 'serene': return `<section class="hero"><div class="copy">${lab}${h1(st,t)}${sub}${btns}</div><img class="arch" src="${IMG}yoga-room.jpg" alt=""><div class="badge">${esc(t.badge)}</div></section>`;
   case 'atelier': return `<section class="hero"><img src="${IMG}pilates-studio.jpg" alt="">${h1(st,t)}<div class="mid"><p class="lab">${esc(t.eyebrow)}</p><a class="btn" href="#">${esc(t.book)}</a></div><h1 class="h-b">${esc(t.h1[2])}.</h1></section>`;
   case 'studio': return `<section class="hero"><img src="${IMG}pilates-arches.jpg" alt=""><div class="copy">${lab}${h1(st,t)}${sub}${btns}</div></section>`;
   case 'noir': return `<section class="hero"><div class="copy">${h1(st,t)}<div class="side">${lab}${sub}${btns}</div></div><div class="frm"><img src="${IMG}gym-floor.jpg" alt=""></div></section>`;
   case 'power': return `<section class="hero"><img src="${IMG}box-rig.jpg" alt="">${lab}${h1(st,t)}<div class="btns" style="margin-top:28px"><a class="btn" href="#">${esc(t.book)}</a><a class="btn ghost" href="#">${esc(t.see)}</a></div><div class="stats">${t.stats.map(s=>`<div><b>${esc(s[0])}</b><span class="lab">${esc(s[1])}</span></div>`).join('')}</div></section>`;
   case 'barrio': return `<section class="hero"><div class="copy">${lab}${h1(st,t)}${sub}${btns}</div><div class="collage"><img class="c1" src="${IMG}yoga-class.jpg" alt=""><img class="c2" src="${IMG}box-floor.jpg" alt=""><img class="c3" src="${IMG}trainer-client.jpg" alt=""><div class="sticker">${esc(t.sticker)}</div></div></section>`;
  }
}
function head2(st,eb,pair){
  const [a,b] = pair;
  const inner = st==='serene'||st==='barrio' ? `${esc(a)} <em>${esc(b)}</em>` : `${esc(a)} ${esc(b)}${st==='studio'||st==='power'?'.':''}`;
  return `<div class="shead"><p class="lab">${esc(eb)}</p><h2>${inner}</h2></div>`;
}
function marq(t){ const seq = t.marq.map(w=>`<span>${esc(w)}</span><span>${'×'}</span>`).join(''); return `<div class="marq" aria-hidden="true"><div>${seq.repeat(6)}</div></div>`; }

function page(st,pi,l){
  const t = T[l], S = STYLES.find(x=>x.id===st), P = S.pals[pi];
  const line = P.line || (isDark(P.bg) ? 'rgba(255,255,255,.16)' : 'rgba(0,0,0,.14)');
  const vars = `--bg:${P.bg};--ink:${P.ink};--acc:${P.acc};--accInk:${P.accInk};--band:${P.band};--line:${line};--mut:${P.mut};`+
    (P.bandInk0?`--bandInk:${P.bandInk0};--bandInk0:${P.bandInk0};`:'')+(P.bandBtn?`--bandBtn:${P.bandBtn};--bandBtnInk:${P.bandBtnInk};`:'')+
    (P.mark?`--mark:${P.mark};`:'')+(P.accTxt?`--accTxt:${P.accTxt};`:'');
  const bandLine = P.bandInk0 && isDark(P.band) ? 'style="--line:rgba(255,255,255,.22)"' : '';
  const rows = t.rows.map(r=>{
    const full = r[4]===t.full;
    return `<div class="row"><div class="when lab">${esc(r[0])} · ${esc(r[1])}</div><div class="cls">${esc(r[2])}</div><div class="who">${esc(r[3])}</div><div class="spots ${full?'full':''}">${esc(r[4])}</div><a class="btn sm ${full?'ghost':''}" href="#">${esc(full?t.wait:t.bookS)}</a></div>`;
  }).join('');
  const plans = t.plans.map((p,i)=>`<div class="plan ${i===2?'feat':''}">${i===2?`<span class="tagx lab">${esc(t.pop)}</span>`:''}<p class="lab">${esc(p[0])}</p><div class="amt">${esc(p[1])}${p[2]?`<small>${esc(p[2])}</small>`:''}</div><p>${esc(p[3])}</p><a class="btn ${i===2?'':'ghost'}" href="#">${esc(t.choose)}</a></div>`).join('');
  return `<div class="gp st-${st}" style="${vars}">
    <div class="offer lab">${esc(t.offer)}</div>
    <header class="hd"><a class="logo" href="#">Marea</a><nav>${t.nav.map(n=>`<a class="lab" href="#">${esc(n)}</a>`).join('')}</nav><a class="btn sm" href="#">${esc(t.book)}</a></header>
    ${hero(st,t)}
    ${st==='atelier'||st==='power'?marq(t):''}
    <section class="sec"><div class="inner">${head2(st,t.offerE,t.classesH)}<div class="cards">${t.classes.map(c=>`<div class="card"><img src="${IMG}${c[2]}" alt=""><h3>${esc(c[0])}</h3><p>${esc(c[1])}</p></div>`).join('')}</div></div></section>
    <section class="sec band" ${bandLine}><div class="inner">${head2(st,t.weekE,t.schedH)}<div class="sched">${rows}</div></div></section>
    <section class="sec"><div class="inner">${head2(st,t.priceE,t.priceH)}<div class="prices">${plans}</div></div></section>
    <footer class="ft"><div class="inner"><div><a class="logo" href="#">Marea</a></div><div><p class="lab">${esc(t.findE)}</p><p>${br(t.addr)}</p></div><div><p class="lab">${esc(t.hoursE)}</p><p>${br(t.hours)}</p></div><div><a class="btn" href="#">${esc(t.book)}</a></div></div></footer>
  </div>`;
}
function isDark(hex){ const n=parseInt(hex.slice(1),16); const r=n>>16,g=(n>>8)&255,b=n&255; return (0.299*r+0.587*g+0.114*b) < 128; }

const tabs = document.getElementById('tabs'), pals = document.getElementById('pals'), about = document.getElementById('about'), stage = document.getElementById('stage');
function render(){
  tabs.innerHTML = STYLES.map(s=>`<button data-s="${s.id}" class="${state.s===s.id?'on':''}">${s.name}</button>`).join('') + `<button data-s="all" class="${state.s==='all'?'on':''}">${state.l==='es'?'Los seis':'All six'}</button>`;
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on', b.dataset.l===state.l));
  document.documentElement.lang = state.l;
  if (state.s==='all'){
    pals.style.display='none';
    about.innerHTML = state.l==='es' ? 'El mismo gimnasio en los seis estilos, uno debajo del otro. Elige un estilo arriba para cambiar sus colores.' : 'The same gym in all six styles, one after another. Pick a single style above to try its other palettes.';
    stage.innerHTML = STYLES.map(s=>`<div class="lbl"><b>${s.name}</b><span>${esc(s.who[state.l])} · ${esc(s.fonts)}</span></div><div class="frame">${page(s.id, state.p[s.id]||0, state.l)}</div>`).join('');
  } else {
    const S = STYLES.find(x=>x.id===state.s), pi = state.p[S.id]||0;
    pals.style.display='';
    pals.innerHTML = S.pals.map((p,i)=>`<button data-p="${i}" class="${i===pi?'on':''}" title="${esc(p.n)}"><i><b style="background:${p.bg}"></b><b style="background:${p.acc}"></b><b style="background:${p.band}"></b></i><span>${esc(p.n)}</span></button>`).join('');
    about.innerHTML = `<b>${S.name}</b> · ${esc(S.who[state.l])} · ${state.l==='es'?'Fuentes':'Fonts'}: ${esc(S.fonts)} · ${state.l==='es'?'Inspirado en':'Inspired by'} ${esc(S.like)}`;
    stage.innerHTML = `<div class="frame">${page(S.id, pi, state.l)}</div>`;
  }
  try{
    const q = new URLSearchParams();
    q.set('s', state.s); if (state.s!=='all' && (state.p[state.s]||0)) q.set('p', (state.p[state.s]||0)+1); if (state.l==='es') q.set('lang','es');
    history.replaceState(null,'','?'+q.toString());
  }catch(e){}
}
tabs.addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; state.s=b.dataset.s; render(); window.scrollTo({top:0});});
pals.addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; state.p[state.s]=+b.dataset.p; render();});
document.getElementById('lang').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; state.l=b.dataset.l; render();});
stage.addEventListener('click',e=>{ if(e.target.closest('a[href="#"]')) e.preventDefault(); });
render();
</script>
