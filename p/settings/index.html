<style>

.panel { position:fixed; top:0; right:0; bottom:0; width:460px; max-width:100vw; background:var(--card); z-index:61; box-shadow:-8px 0 32px rgba(0,0,0,.12); display:none; flex-direction:column; }

<div class="test"><b>Tab</b><span class="seg" id="g1"></span><b>Address</b><span class="seg" id="g3"></span><b>Width</b><span class="seg" id="g2"></span></div>

<div class="panel" id="panel" role="dialog" aria-modal="true"></div>
<script>
// Grounded at phoenix main ccea861: identity Business (name [owner-only], timezone, address, contact_email, language, clock_24h, date_order, logo, look, brand_color,
// hours {weekday spans + dates that differ}, services, has_staff); money tax: collects_tax (business), TaxComponent (named rates, ppm), TaxTreatment per Product.
// ⚑ NEW (DECIDE_2026-11-07_signup item D/C): legal name, description, affiliations, focus.
var LOOKS=[['black','Black','#111','#fff'],['light','Light','#F4F4F1','#111'],['brand','Your color','#1F6F78','#fff']];
var COLORS=['#1F6F78','#A86B0C','#8C4A62','#2F5BA8','#5E6B3A','#B23A2E','#6E4A8C','#111111'];
var S={ctry:'pr', taxok:false, own:[], pv:'staff', style:'line', logo:false, tab:'business', wid:'desk', panel:null, toast:null, look:'brand', color:'#1F6F78', collects:true, comps:[['IVU estatal',10.5],['IVU municipal',1]],
 b:{name:'Barrio Fitness',legal:'',desc:'',aff:['CrossFit'],addr:'Calle Loíza 1950, San Juan, PR 00911',email:'hola@barriofitness.com',focus:['Functional fitness','Strength'],work:['Group classes','Open gym','1:1 sessions'],staff:true,tz:'Atlantic (San Juan)',lang:'Español',clock:'12-hour',date:'Day first (8/11)'}};
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
var CASES={
 business:'<b>Settings › Business.</b> Everything about the business, in rows; each opens the 520 panel. Grouped: who you are · how you work · time and format · hours. <span style="color:#7fd3dc">NEW</span> marks the fields sign-up added (legal name, description, affiliations, focus).',
 look:'<b>Settings › Look.</b> Logo, then the frame: Black · Light · Your color. Your color: suggested from the logo, 8 swatches, or Custom (the device’s picker plus a hex field); <b>Fill or Line</b>. A readability check picks white or black text; too light becomes a line. Preview: laptop sidebar + phone header. Controls stay ink.',
 tax:'<b>Settings › Tax.</b> ⚑ Suggested from the address (Puerto Rico only; elsewhere, no suggestion), confirmed by the owner; once confirmed the rates are hers and Zana never changes them. Elsewhere: no suggestion, she adds the parts. One switch (collect tax), the named parts that add up (IVU estatal 10.5% + IVU municipal 1% = 11.5%; named in the members’ language, English: State IVU / Municipal IVU). Each product says whether its price includes tax, in Products.'
};
function header(){ return '<div class="titlerow"><h1>Settings</h1></div><div class="tabs">'+['Business','Look','Payments','Documents','Tracks','Tax'].map(function(t){ var k=t.toLowerCase(); return '<span class="'+(S.tab===k?'on':'')+'" data-a="tab" data-v="'+k+'" style="cursor:pointer">'+t+'</span>'; }).join('')+'</div>'; }
function row(k,v,sub,id,isnew,empty){ return '<button class="srow2" data-a="edit" data-v="'+id+'"><span class="k">'+k+(isnew?'<span class="new">New</span>':'')+'</span><span class="v">'+(empty?'<span class="add">'+empty+'</span>':v)+(sub?'<small>'+sub+'</small>':'')+'</span><span class="chev">›</span></button>'; }
function business(){ var b=S.b, h=header();
  h+='<div class="grp"><div class="lab2">Who you are</div><div class="card">'+
   row('Business name',esc(b.name),'What members see. Owner only.','name')+
   row('Legal name',esc(b.legal),'Shown on receipts when set. Owner only.','legal',true,b.legal?'':'Add')+
   row('Description',esc(b.desc),'One or two lines on your business page.','desc',true,b.desc?'':'Add')+
   row('Affiliated with',b.aff.join(', '),'Names only, on your business page.','aff',true,b.aff.length?'':'Add')+
   row('Address',esc(b.addr),'On receipts and your business page.','addr')+
   row('Contact email',esc(b.email),'Members’ replies go here.','email')+'</div></div>';
  h+='<div class="grp"><div class="lab2">How you work</div><div class="card">'+
   row('Focus',b.focus.join(', '),'','focus',true)+
   row('How you work',b.work.join(', '),'Decides which parts of Zana you see.','work')+
   row('Staff',b.staff?'I have staff':'Just me','','staff')+'</div></div>';
  h+='<div class="grp"><div class="lab2">Time and format</div><div class="card">'+
   row('Time zone',b.tz,'Class times and receipts use it.','tz')+
   row('Members’ language',b.lang,'Emails and the member app.','lang')+
   row('Clock',b.clock,'','clock')+
   row('Dates',b.date,'','date')+'</div></div>';
  h+='<div class="grp"><div class="lab2">Hours</div><div class="card"><button class="srow2" data-a="edit" data-v="hours"><span class="k">Opening hours</span><span class="v"><span class="hrs"><b>Mon–Fri</b><span>5:30 AM – 8:30 PM</span><b>Sat</b><span>7:00 AM – 12:00 PM</span><b>Sun</b><span>Closed</span><b>Dec 24</b><span>Closes 12:00 PM</span></span><small>Information only. They never block a booking.</small></span><span class="chev">›</span></button></div></div>';
  return h; }
function lum(hex){ var c=hex.replace('#',''); var r=parseInt(c.substr(0,2),16)/255,g=parseInt(c.substr(2,2),16)/255,b=parseInt(c.substr(4,2),16)/255; function f(x){return x<=0.03928?x/12.92:Math.pow((x+0.055)/1.055,2.4);} return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b); }
function look(){ var h=header(), brand=S.look==='brand', col=S.color, L=lum(col), txt=L>0.4?'#111':'#fff', tooPale=L>0.85;
  var fill=brand&&S.style==='fill'&&!tooPale, line=brand&&(S.style==='line'||tooPale);
  var band=fill?col:(S.look==='black'?'#111':'#F4F4F1'), bandTxt=fill?txt:(S.look==='black'?'#fff':'#111');
  h+='<div class="grp"><div class="lab2">Logo</div><div class="logobox"><span class="lg" style="'+(S.logo?'background:#1F6F78;color:#fff':'')+'">'+(S.logo?'B':'BF')+'</span><div style="flex:1"><b>'+(S.logo?'barrio-logo.png':'No logo yet')+'</b><div class="mut" style="font-size:13px">'+(S.logo?'Colors below are suggested from it.':'Square works best. Until then, your initials show.')+'</div></div><button class="btn" data-a="logo">'+(S.logo?'Replace':'Upload')+'</button></div></div>';
  h+='<div class="grp"><div class="lab2">Frame</div><div class="look3">'+LOOKS.map(function(x){ var c=x[0]==='brand'?col:x[2], t=x[0]==='brand'?txt:x[3]; return '<button class="lk '+(S.look===x[0]?'on':'')+'" data-a="look" data-v="'+x[0]+'"><div class="sw" style="background:'+c+';color:'+t+';-webkit-text-fill-color:'+t+';'+(x[0]==='light'?'border:1px solid #e5e5e0':'')+'">Barrio</div><b>'+x[1]+'</b></button>'; }).join('')+'</div>';
  if(brand){
    if(S.logo) h+='<div class="sub2">From your logo</div><div class="dots">'+['#1F6F78','#E2B23A','#0E2F33'].map(function(c){ return '<button class="dot2 '+(col===c?'on':'')+'" data-a="color" data-v="'+c+'" style="background:'+c+'"></button>'; }).join('')+'</div>';
    h+='<div class="sub2">Colors</div><div class="dots">'+COLORS.map(function(c){ return '<button class="dot2 '+(col===c?'on':'')+'" data-a="color" data-v="'+c+'" style="background:'+c+'"></button>'; }).join('')+'</div>';
    h+='<div class="sub2">Custom</div><div class="custom"><input type="color" data-f="picker" value="'+col+'"><input type="text" data-f="hex" value="'+col.toUpperCase()+'" maxlength="7"></div>';
    h+='<div class="sub2">How it shows</div><div class="seg2"><button class="'+(S.style==='fill'?'on':'')+'" data-a="style" data-v="fill">Fill</button><button class="'+(S.style==='line'?'on':'')+'" data-a="style" data-v="line">Line</button></div>';
    if(tooPale) h+='<p class="mut" style="font-size:13px">This color is too light to read text on, so it shows as a line.</p>';
  }
  var mem=S.pv==='members', nav=mem?['Classes','My plans','Workouts','Account']:['Today','Schedule','People','Money','Workouts'], title=mem?'Classes':'Today', cta=mem?'Book':'Collect', pcta=mem?'Book':'Check in';
  var logoBg=S.logo?'#1F6F78':(fill?'rgba(255,255,255,.2)':'#111');
  var ph=mem?'<div class="phold">Member side · placeholder, not designed yet</div>':'';
  h+='</div><div class="grp"><div class="lab2" style="display:flex;justify-content:space-between;align-items:center">Preview<span class="seg2" style="text-transform:none;letter-spacing:0;font-weight:500"><button class="'+(!mem?'on':'')+'" data-a="pv" data-v="staff">Staff</button><button class="'+(mem?'on':'')+'" data-a="pv" data-v="members">Members</button></span></div><div class="pv2">'+
   '<div class="lapt"><div class="band2" style="background:'+band+';color:'+bandTxt+';'+(line?'box-shadow:inset -4px 0 0 '+col+';':'')+(S.look==='light'||line?'border-right:1px solid #E6E6E2;':'')+'"><div class="bl" style="background:'+logoBg+'">'+(S.logo?'B':'BF')+'</div>'+nav.map(function(n,i){ return '<div class="bi" style="color:'+bandTxt+';-webkit-text-fill-color:'+bandTxt+';opacity:'+(i===0?1:.7)+'">'+n+'</div>'; }).join('')+'</div><div class="lmain"><div class="lh">'+title+'</div>'+ph+'<div class="lrow"></div><div class="lrow"></div><div class="lbtn">'+cta+'</div></div></div>'+
   '<div class="phn"><div class="ph2" style="background:'+band+';color:'+bandTxt+';'+(line?'box-shadow:inset 0 -3px 0 '+col+';':'')+'"><span class="bl" style="width:26px;height:26px;font-size:11px;margin:0;background:'+logoBg+'">'+(S.logo?'B':'BF')+'</span><b style="color:'+bandTxt+';-webkit-text-fill-color:'+bandTxt+'">Barrio Fitness</b><span style="margin-left:auto;color:'+bandTxt+';-webkit-text-fill-color:'+bandTxt+'">☰</span></div><div class="pbody">'+ph+'<div class="lrow"></div><div class="lrow"></div><div class="lbtn" style="width:100%">'+pcta+'</div></div></div></div>'+
   '<p class="mut" style="font-size:13px;margin-top:8px">Both sides, on a laptop and on a phone, use this look: the sidebar on a wide screen, the header and its menu on a phone. Buttons, tabs and panels stay black so every screen reads the same. Your business page has its own look, later.</p></div>';
  return h; }
var SUG={pr:['Puerto Rico',[['IVU estatal',10.5],['IVU municipal',1]],'IVU'],none:['',[],'']};
function tax(){ var h=header(), sg=SUG[S.ctry], comps=S.ctry==='none'?S.own:(S.taxok?S.comps:sg[1]), tot=comps.reduce(function(a,c){return a+c[1];},0);
  h+='<div class="grp"><div class="card"><div class="tg"><div><b>Collect tax</b><span>Off: no tax anywhere, on any product.</span></div><button class="tog '+(S.collects?'on':'')+'" data-a="coll"></button></div></div></div>';
  if(!S.collects) return h;
  if(S.ctry!=='none'&&!S.taxok) h+='<div class="grp"><div class="sugbox"><div><b>We filled in '+sg[0]+'’s '+sg[2]+'</b><span>A starting point from your address. Check it with your accountant: once you confirm, these are your rates, and Zana never changes them.</span></div><div class="sugbtns"><button class="btn main" data-a="taxok">Looks right</button><button class="btn" data-a="taxedit">Change</button></div></div></div>';
  if(S.ctry==='none') h+='<div class="grp"><div class="sugbox"><div><b>Add your tax</b><span>We don’t have a suggestion for where you are. Add each part the way your receipts should show it.</span></div></div></div>';
  h+='<div class="grp"><div class="lab2">Your tax'+(comps.length?' · '+String(+tot.toFixed(3))+'% in all':'')+'</div><div class="card">';
  comps.forEach(function(c,i){ h+=row(c[0],c[1]+'%',(!S.taxok&&S.ctry!=='none'?'<span class="sgt">Suggested</span> ':'')+'Its own line on receipts.','comp'+i); });
  h+='<button class="srow2" data-a="addcomp"><span class="k add">+ Add a part</span><span class="v"></span></button></div>';
  h+='<p class="mut" style="font-size:13px;margin-top:10px">Each product uses these, its own rate, or no tax, and says whether its price includes tax (in Products).</p></div>';
  return h; }
function panel(){ if(!S.panel) return ''; var id=S.panel, b=S.b, h='<div class="ph"><h3>';
  var map={legal:['Legal name','legal','The name on your registration, for receipts. Leave empty to show the business name.'],desc:['Description','desc','One or two lines members read on your business page.'],name:['Business name','name','What members see everywhere.'],addr:['Address','addr','One box; write it as you would on an envelope.'],email:['Contact email','email','Members’ replies go here. Empty: replies go nowhere.']};
  if(map[id]){ var m=map[id]; h+=m[0]+'</h3><button class="ib" data-a="close">✕</button></div><div class="pb"><div class="fld"><label>'+m[0]+'</label>'+(id==='desc'||id==='addr'?'<textarea data-f="'+m[1]+'" style="min-height:110px">'+esc(b[m[1]])+'</textarea>':'<input type="text" data-f="'+m[1]+'" value="'+esc(b[m[1]])+'">')+'<div class="hint">'+m[2]+'</div></div></div><div class="pf"><button class="btn main" data-a="save">Save</button></div>'; return h; }
  if(id==='aff'){ var sug=['CrossFit','Hyrox','F45','Les Mills','Orangetheory','Zumba','Spinning']; h+='Affiliated with</h3><button class="ib" data-a="close">✕</button></div><div class="pb"><p class="mut" style="margin:0;font-size:14px">Licences or franchises you hold. Shown as names on your business page; Zana never shows their logos.</p><div class="checks">'+sug.map(function(s){ var on=b.aff.indexOf(s)>=0; return '<button class="ck '+(on?'on':'')+'" data-a="aff" data-v="'+s+'"><span class="box">'+(on?'✓':'')+'</span>'+s+'</button>'; }).join('')+'</div><div class="fld"><input type="text" placeholder="Something else"></div></div><div class="pf"><button class="btn main" data-a="save">Save</button></div>'; return h; }
  h+='Edit</h3><button class="ib" data-a="close">✕</button></div><div class="pb"><p class="mut">This row opens its own editor (the field’s control from the look README).</p></div>'; return h; }
function render(){
  document.body.className=(S.wid==='phone'?'phone ':'')+(S.panel?'open':'');
  document.getElementById('g1').innerHTML=[['business','Business'],['look','Look'],['tax','Tax']].map(function(x){return '<button data-a="tab" data-v="'+x[0]+'" aria-pressed="'+(S.tab===x[0])+'">'+x[1]+'</button>';}).join('');
  document.getElementById('g2').innerHTML=[['desk','Laptop'],['phone','Phone']].map(function(x){return '<button data-a="wid" data-v="'+x[0]+'" aria-pressed="'+(S.wid===x[0])+'">'+x[1]+'</button>';}).join('');
  document.getElementById('g3').innerHTML=[['pr','Puerto Rico'],['none','Elsewhere']].map(function(x){return '<button data-a="ctry" data-v="'+x[0]+'" aria-pressed="'+(S.ctry===x[0])+'">'+x[1]+'</button>';}).join('');
  document.getElementById('case').innerHTML=CASES[S.tab]||'<b>'+S.tab+'</b> is designed in its own file.';
  document.getElementById('main').innerHTML=S.tab==='business'?business():S.tab==='look'?look():S.tab==='tax'?tax():header()+'<p class="mut" style="margin-top:24px">Designed in its own mock.</p>';
  var tb=document.querySelector('.tabs'), on=tb&&tb.querySelector('.on'); if(on) tb.scrollLeft=Math.max(0,on.offsetLeft-tb.offsetLeft-16);
  document.getElementById('panel').innerHTML=panel();
  var old=document.querySelector('.undo'); if(old) old.remove();
  if(S.toast){ var u=document.createElement('div'); u.className='undo'; u.innerHTML='<span>'+S.toast+'</span><button data-a="untoast">Undo</button>'; document.body.appendChild(u); }
}
document.addEventListener('click',function(ev){ var el=ev.target.closest('[data-a]'); if(!el) return; var a=el.dataset.a, v=el.dataset.v; ev.preventDefault(); if(a!=='untoast') S.toast=null;
  if(a==='tab'){ S.tab=v; S.panel=null; } if(a==='wid') S.wid=v;
  if(a==='edit') S.panel=v; if(a==='close') S.panel=null;
  if(a==='save'){ S.panel=null; S.toast='Saved.'; }
  if(a==='aff'){ var i=S.b.aff.indexOf(v); if(i>=0) S.b.aff.splice(i,1); else S.b.aff.push(v); }
  if(a==='look') S.look=v; if(a==='color') S.color=v; if(a==='style') S.style=v; if(a==='pv') S.pv=v; if(a==='logo'){ S.logo=true; S.color='#1F6F78'; }
  if(a==='coll'){ S.collects=!S.collects; S.toast=S.collects?'Tax is on.':'Tax is off. No product charges it.'; }
  if(a==='addcomp'){ S.panel='comp'; }
  if(a==='taxok'){ S.taxok=true; S.comps=SUG[S.ctry][1].slice(); S.toast='Tax confirmed. These are your rates now.'; }
  if(a==='taxedit'){ S.panel='comp0'; }
  if(a==='ctry'){ S.ctry=v; S.taxok=false; S.tab='tax'; }
  if(a==='untoast') S.toast=null;
  render(); });
document.addEventListener('input',function(ev){ var f=ev.target.dataset.f; if(!f) return; if(f==='picker'){ S.color=ev.target.value; render(); return; } if(f==='hex'){ var v=ev.target.value; if(/^#[0-9a-fA-F]{6}$/.test(v)){ S.color=v.toLowerCase(); var pos=ev.target.selectionStart; render(); var i=document.querySelector('[data-f=hex]'); i.focus(); i.setSelectionRange(pos,pos);} return; } S.b[f]=ev.target.value; });
render();
</script>
