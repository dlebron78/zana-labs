<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gym Sign-up</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --ink:#111; --t2:#4A4A48; --t3:#5C5C59; --line:#E8E8E5; --rowline:#F0F0ED; --page:#F5F5F3; --card:#fff; --fill:#F0F0ED; --fillh:#E4E4E0; --grey:#F3F3F0; --red:#A8261B; --redbg:#FDE8E6; --green:#17663A; --greenbg:#E4F5E8; }
* { box-sizing:border-box; }
body { margin:0; background:var(--page); color:var(--ink); font-family:'Geist',system-ui,sans-serif; }
button, input { font-family:inherit; color:var(--ink); -webkit-text-fill-color:currentColor; }
button { cursor:pointer; -webkit-appearance:none; appearance:none; }
.test { background:#111; color:#ddd; font-size:12px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:8px 16px; position:sticky; top:0; z-index:50; }
.test b { color:#fff; font-weight:600; letter-spacing:.04em; text-transform:uppercase; font-size:11px; }
.seg { display:inline-flex; gap:2px; background:#2a2a2a; padding:2px; border-radius:8px; flex-wrap:wrap; }
.seg button { border:0; background:none; color:#ccc; -webkit-text-fill-color:#ccc; height:28px; padding:0 10px; border-radius:6px; font-size:12px; }
.seg button[aria-pressed="true"] { background:#fff; color:#111; -webkit-text-fill-color:#111; }
.case { background:#1d1d1c; color:#e9e9e6; font-size:13px; padding:8px 16px; line-height:1.45; } .case b { color:#fff; }
.frame { display:grid; grid-template-columns:96px 1fr; min-height:calc(100vh - 80px); }
.band { background:#0E0E0E; }
.appmain { padding:32px 40px 80px; max-width:880px; }
.phone .frame { grid-template-columns:1fr; } .phone .band { display:none; }
.phone .wrap { background:#ddd; padding:16px 0; } .phone .appmain { max-width:390px; margin:0 auto; padding:20px 16px 80px; background:var(--page); min-height:800px; }
.lab { font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--t3); }
.titlerow { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
h1 { margin:4px 0 16px; font-size:40px; font-weight:700; letter-spacing:-.03em; } .phone h1 { font-size:28px; }
.tabs { display:flex; gap:20px; border-bottom:1px solid var(--line); margin-bottom:24px; }
.tabs span { padding:10px 0; font-size:15px; color:var(--t3); } .tabs span.on { color:var(--ink); font-weight:600; border-bottom:2px solid var(--ink); }
.card { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
.prow { display:flex; align-items:center; gap:12px; padding:12px 20px; border-top:1px solid var(--rowline); min-height:68px; cursor:pointer; }
.prow:first-child { border-top:0; } .prow:hover { background:#FAFAF8; }
.prow .tx { flex:1; min-width:0; } .prow .nm { font-size:16px; font-weight:500; }
.prow .why { font-size:14px; color:var(--t2); margin-top:3px; display:flex; gap:8px; align-items:center; white-space:nowrap; overflow:hidden; }
.prow .price { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; }
.kl { font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--t3); flex:none; }
.chev { color:var(--t3); font-size:20px; }
.btn { height:36px; padding:0 14px; border-radius:10px; border:0; background:var(--fill); font-size:15px; font-weight:500; white-space:nowrap; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
.btn:hover { background:var(--fillh); } .btn.main { background:var(--ink); color:#fff; -webkit-text-fill-color:#fff; } .btn.risk { background:var(--redbg); color:var(--red); -webkit-text-fill-color:var(--red); }
.btn:disabled { opacity:.4; cursor:not-allowed; }
/* panel */
.scrim { position:fixed; inset:0; background:rgba(17,17,17,.25); z-index:60; display:none; }
.panel { position:fixed; top:0; right:0; bottom:0; width:460px; max-width:100vw; background:var(--card); z-index:61; box-shadow:-8px 0 32px rgba(0,0,0,.12); display:none; flex-direction:column; }
.open .scrim { display:block; } .open .panel { display:flex; }
.phone .panel { width:100vw; top:auto; height:94vh; border-radius:20px 20px 0 0; }
.ph { display:flex; align-items:center; gap:10px; padding:14px 20px; border-bottom:1px solid var(--line); min-height:64px; }
.ph h3 { margin:0; font-size:20px; font-weight:700; flex:1; }
.ib { width:36px; height:36px; border-radius:10px; border:0; background:var(--fill); font-size:18px; display:grid; place-items:center; flex:none; }
.pb { flex:1; overflow:auto; padding:20px; display:flex; flex-direction:column; gap:16px; }
.pb .q { font-size:17px; font-weight:600; margin:0; }
.pf { padding:16px 20px; border-top:1px solid var(--line); display:flex; gap:8px; flex-direction:column; }
.pf .btn { height:44px; border-radius:12px; font-size:16px; width:100%; }
.pf .why { font-size:13px; color:var(--t3); text-align:center; }
/* choice cards (kit: 72 tall, radio) */
.choice { display:flex; gap:12px; align-items:flex-start; border:1px solid var(--line); border-radius:14px; padding:14px 16px; background:#fff; text-align:left; width:100%; min-height:72px; }
.choice:hover { background:#FAFAF8; }
.choice.on { border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink); }
.radio { width:20px; height:20px; border-radius:50%; border:2px solid #BDBDB8; flex:none; margin-top:2px; position:relative; }
.choice.on .radio { border-color:var(--ink); } .choice.on .radio::after { content:''; position:absolute; inset:3px; border-radius:50%; background:var(--ink); }
.choice b { display:block; font-size:16px; font-weight:600; } .choice span { display:block; font-size:14px; color:var(--t2); margin-top:3px; } .choice small { display:block; font-size:13px; color:var(--t3); margin-top:6px; }
/* fields */

.fld .hint { font-size:13px; color:var(--t3); margin-top:6px; }
input[type=text] { width:100%; border:1px solid var(--line); border-radius:12px; padding:0 14px; height:44px; font-size:16px; background:#fff; }
input:focus { outline:2px solid var(--ink); outline-offset:-1px; border-color:transparent; }
.money { position:relative; } .money span { position:absolute; left:14px; top:12px; font-size:16px; color:var(--t3); } .money input { padding-left:26px; font-variant-numeric:tabular-nums; }
.row2 { display:flex; gap:12px; } .row2 .fld { flex:1; }
.net { background:var(--grey); border-radius:12px; padding:12px 14px; font-size:14px; color:var(--t2); display:flex; flex-direction:column; gap:4px; }
.net .l1 { display:flex; justify-content:space-between; gap:12px; } .net b { color:var(--ink); font-variant-numeric:tabular-nums; } .net small { color:var(--t3); font-size:12px; }
.cnt { display:flex; align-items:center; gap:0; border:1px solid var(--line); border-radius:12px; width:max-content; overflow:hidden; }
.cnt button { width:44px; height:44px; border:0; background:var(--fill); font-size:20px; } .cnt span { min-width:56px; text-align:center; font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; }
.checks { border:1px solid var(--line); border-radius:14px; overflow:hidden; }
.ck { display:flex; align-items:center; gap:12px; padding:12px 14px; border-top:1px solid var(--rowline); background:#fff; width:100%; border-left:0; border-right:0; border-bottom:0; text-align:left; font-size:15px; }
.ck:first-child { border-top:0; } .box { width:22px; height:22px; border-radius:6px; border:2px solid #BDBDB8; display:grid; place-items:center; font-size:13px; color:#fff; flex:none; }
.ck.on .box { background:var(--ink); border-color:var(--ink); }
.ck small { margin-left:auto; color:var(--t3); font-size:13px; }
/* summary / setting rows (label · value · ›) */
.srows { border:1px solid var(--line); border-radius:14px; overflow:hidden; }
.srow { display:flex; align-items:center; gap:12px; padding:14px 16px; border-top:1px solid var(--rowline); background:#fff; width:100%; border-left:0; border-right:0; border-bottom:0; text-align:left; }
.srow:first-child { border-top:0; } .srow:hover { background:#FAFAF8; }
.srow .k { font-size:15px; font-weight:500; flex:none; width:120px; } .srow .v { flex:1; font-size:15px; color:var(--t2); }
.hero { background:var(--grey); border-radius:14px; padding:16px; } .hero .kl { margin-bottom:4px; } .hero .t { font-size:22px; font-weight:700; } .hero .p { font-size:16px; color:var(--t2); margin-top:4px; font-variant-numeric:tabular-nums; }
.archive { margin-top:8px; }
.toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#111; color:#fff; border-radius:12px; padding:12px 16px; font-size:14px; z-index:80; max-width:92vw; }

/* Real phones: adapt to the screen, not only the switch */
html, body { max-width:100%; overflow-x:hidden; }
.frame > .appmain { min-width:0; }
.tabs { max-width:100%; }
@media (max-width: 720px) {
  .frame { grid-template-columns:1fr; } .band { display:none; }

  .test { position:static; }
  .panel { width:100vw; top:auto; height:94vh; border-radius:20px 20px 0 0; }
}

.titlerow .btn { height:40px!important; }

.sum { border:1px solid var(--line); border-radius:14px; padding:6px 16px; }

.ftile b { font-size:15px; font-weight:600; } .ftile span { font-size:12px; color:var(--t3); -webkit-text-fill-color:var(--t3); }
.ftile.on { background:#111; border-color:#111; color:#fff; -webkit-text-fill-color:#fff; } .ftile.on span { color:#bbb; -webkit-text-fill-color:#bbb; }
.svc { display:flex; flex-wrap:wrap; gap:6px; }
/* HQ */
.hq { width:960px; max-width:100%; } .phone .hq { width:390px; }
.hqtop { display:flex; align-items:center; gap:10px; padding:14px 24px; border-bottom:1px solid var(--line); } .hqtop .brand { flex:1; } .hqtop .kl { font-size:13px; }
.hqb { padding:24px; display:grid; grid-template-columns:340px 1fr; gap:24px; } .phone .hqb { grid-template-columns:1fr; padding:16px; }
@media (max-width:720px){ .hqb { grid-template-columns:1fr; padding:16px; } }
.hqb h3 { margin:0 0 12px; font-size:18px; }
.fbox { border:1px solid var(--line); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:12px; }
.ckr { display:flex; gap:10px; align-items:flex-start; font-size:14px; border:0; background:none; text-align:left; padding:0; }
.ckr .box.on { background:var(--ink); border-color:var(--ink); }
table.inv { width:100%; border-collapse:collapse; font-size:14px; } .inv th { text-align:left; font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--t3); padding:8px; border-bottom:1px solid var(--line); }
.inv td { padding:10px 8px; border-top:1px solid var(--rowline); vertical-align:middle; } .inv tr:first-child td { border-top:0; }
.inv .nm { font-weight:500; } .inv .sm { font-size:12px; color:var(--t3); }
.stp { font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; }
.stp.g { color:var(--green); -webkit-text-fill-color:var(--green); } .stp.a { color:#8A5A00; -webkit-text-fill-color:#8A5A00; } .stp.m { color:var(--t3); -webkit-text-fill-color:var(--t3); }
/* email */
.mailv { padding:24px; display:flex; flex-direction:column; gap:14px; font-size:15px; line-height:1.55; }
.mailh { font-size:13px; color:var(--t3); border-bottom:1px solid var(--line); padding-bottom:12px; } .mailh b { color:var(--ink); }
.mailv .cta { align-self:flex-start; height:48px; padding:0 22px; border-radius:12px; }
</style>
</head>
<body>
<div class="test"><b>Start</b><span class="seg" id="g1"></span><b>Width</b><span class="seg" id="g2"></span></div>
<div class="case" id="case"></div>
<div class="wrap"><div class="stage"><div class="sheet" id="sheet"></div></div></div>
<script>
// Invite-only sign-up (PHO-461, Daniel 2026-11-07): HQ › Invite a gym sends ONE email; its link (7 days, one use) signs her in and opens ONE screen.
// Everything else is on Get started. Focus = canon's "modality" (identity req 1: may fill Services; Daniel: "What's your focus?"); kept on the business = ⚑ the Decide.
// Business needs name + IANA timezone (taken from her phone) + owner. Start: 30-day trial — Pro, or Business with staff (money req 18).
var FOC=[['functional','Functional fitness','CrossFit, Hyrox, F45-style'],['strength','Strength','Weightlifting, powerlifting'],['hiit','HIIT and bootcamp','Circuits, conditioning'],['yoga','Yoga',''],['pilates','Pilates','Mat, reformer'],['cycling','Cycling','Spin, indoor'],['dance','Dance and barre','Zumba, barre'],['martial','Martial arts and boxing','BJJ, kickboxing'],['endurance','Endurance','Running, triathlon'],['mobility','Mobility and recovery','Stretching, breathwork'],['other','Other','Type it']];
var SVN={group:'Group classes',one:'1:1 sessions',prog:'Programs (online)',open:'Open gym'};
var S={step:'hq', wid:'desk', invites:[['Marta Rivera','marta@gmail.com','Marta Fit','Opened','a','today 9:12 am',true],['Luis Ortiz','luis@boxponce.com','Box Ponce','First sale','g','Nov 3',true],['Ana Cruz','ana@islayoga.com','Isla Yoga','Signed up','g','Nov 5',false],['Pedro Vega','pedro@gmail.com','Vega PT','Sent','m','Nov 6 · expires Nov 13',false],['Rosa Díaz','rosa@spin.pr','Spin PR','Expired','m','Oct 28',false]],
 f:{name:'',email:'',biz:'',found:true}, biz:'Marta Fit', focus:[], svc:[], other:'', city:'', staff:null, editSvc:false};
var CASES={
 hq:'<b>Zana HQ › Invite a gym.</b> Daniel types name, email and business name, ticks a founding spot, and sends. The list follows each invite: Sent → Opened → Signed up → First sale.',
 email:'<b>One email.</b> The button signs her in: the invite proves the address. Works once, for 7 days (Daniel: "2 is good").',
 expired:'<b>An expired or used invite.</b> She can ask for a fresh sign-in link (the normal 10-minute kind) if she already signed up, or Daniel resends from HQ.',
 one:'<b>The one screen.</b> Business name (pre-filled; the name members see), <b>Where are you?</b> (city: time zone, language, IVU), <b>What’s your focus?</b> (kinds of training, no brands; saved), <b>How do you work?</b> (the Services), Just me / I have staff. Address, description, legal name and affiliations wait on Get started › Your business.',
 today:'<b>Today with Get started.</b> Everything else waits here, in the order that gets to a first sale. The trial line: Pro, or Business with staff (Daniel: "3 yes").'
};
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function svcFrom(){ return S.svc||[]; }
function hq(){
  var f=S.f, ok=f.name.trim()&&f.email.indexOf('@')>0&&f.biz.trim();
  var h='<div class="hqtop"><span class="brand">zana <span class="kl" style="margin-left:6px">HQ</span></span><span class="kl">Invite a gym</span></div><div class="hqb"><div><h3>Invite a gym</h3><div class="fbox">'+
   '<div class="fld"><label>Owner’s name</label><input type="text" data-f="name" value="'+esc(f.name)+'" placeholder="Marta Rivera"></div>'+
   '<div class="fld"><label>Owner’s email</label><input type="text" data-f="email" value="'+esc(f.email)+'" placeholder="marta@gmail.com"></div>'+
   '<div class="fld"><label>Business name</label><input type="text" data-f="biz" value="'+esc(f.biz)+'" placeholder="Marta Fit"><div class="hint">She can change it when she signs up.</div></div>'+
   '<button class="ckr" data-a="found"><span class="box '+(f.found?'on':'')+'" style="color:#fff;-webkit-text-fill-color:#fff">'+(f.found?'✓':'')+'</span><span><b>Founding price</b><br><span style="color:var(--t3)">14 of 25 spots left</span></span></button>'+
   '<button class="btn main" data-a="send" style="height:44px" '+(ok?'':'disabled')+'>Send invite</button></div></div>';
  h+='<div><h3>Invites</h3><div class="card"><table class="inv"><thead><tr><th>Gym</th><th>Status</th><th></th></tr></thead><tbody>';
  S.invites.forEach(function(i){ h+='<tr><td><div class="nm">'+esc(i[2])+(i[6]?' <span class="stp m" style="margin-left:4px">Founding</span>':'')+'</div><div class="sm">'+esc(i[0])+' · '+esc(i[1])+'</div></td><td><div class="stp '+i[4]+'">'+i[3]+'</div><div class="sm">'+i[5]+'</div></td><td style="text-align:right">'+(i[3]==='Sent'||i[3]==='Expired'?'<button class="btn" style="height:32px;font-size:13px">'+(i[3]==='Expired'?'Send again':'Resend')+'</button>':'')+'</td></tr>'; });
  return h+'</tbody></table></div><p class="note" style="margin-top:10px">Opened = she tapped the link and is signed in; if she stops there, signing in again brings her back to the one screen. Signed up = her business exists. First sale = her first payment recorded.</p></div></div>';
}
function email(){ return '<div class="mailv"><div class="mailh"><b>Zana</b> &lt;no-reply@mail.zana.fit&gt;<br>To: marta@gmail.com<br><b>Daniel invited you to set up Marta Fit on Zana</b></div>'+
  '<div>Hi Marta,</div><div>Daniel invited you to run <b>Marta Fit</b> on Zana: your schedule, your clients and your payments in one place. It takes about a minute to start.</div>'+
  '<button class="btn main cta" data-a="go" data-v="one">Set up my gym</button><div class="note">This button signs you in. It works once, for 7 days. Didn’t expect this? Ignore it and nothing happens.</div>'+
  '<div class="note" style="border-top:1px solid var(--line);padding-top:12px">Español: <i>Daniel te invitó a montar Marta Fit en Zana. Toca el botón para empezar.</i></div></div>'; }
function expired(){ return '<div class="top"><span class="brand">zana</span></div><div class="body"><div class="mail"><div class="ic">⌛</div><h2>This invite has expired</h2><p class="sub" style="margin:0">Invites work once, for 7 days. Ask Daniel for a new one, or if you already signed up, sign in.</p></div></div><div class="foot"><button class="btn main">Email me a sign-in link</button><button class="linkbtn">Write to Daniel</button></div>'; }
function one(){
  var sv=svcFrom(), ok=S.biz.trim()&&S.city.length>2&&S.focus.length&&sv.length&&S.staff!==null;
  var h='<div class="top"><span class="brand">zana</span></div><div class="body"><h2>Welcome, Marta</h2><p class="sub">One screen and you’re in. Everything else can wait.</p>'+
   '<div class="fld"><label>Business name</label><input type="text" data-f="biz" value="'+esc(S.biz)+'"><div class="hint">What members see. A legal name for receipts can be added later.</div></div>'+
   '<div class="fld"><label>Where are you?</label><input type="text" data-f="city" value="'+esc(S.city)+'" placeholder="City">'+(S.city.length>2?'<div class="setfor" style="margin-top:8px;display:block">Time <b>Atlantic</b> · members’ language <b>Español</b> · tax <b>IVU 11.5%</b>. Change any of it later in Settings.</div>':'')+'</div>'+
   '<div class="fld"><label>What’s your focus?</label><div class="fgrid">'+FOC.map(function(f){ var on=S.focus.indexOf(f[0])>=0; return '<button class="ftile '+(on?'on':'')+'" data-a="foc" data-v="'+f[0]+'"><b>'+f[1]+'</b>'+(f[2]?'<span>'+f[2]+'</span>':'')+'</button>'; }).join('')+'</div></div>';
  if(S.focus.indexOf('other')>=0) h+='<div class="fld"><input type="text" data-f="other" value="'+esc(S.other)+'" placeholder="What do you do? e.g. Hyrox, aerial, climbing"></div>';
  h+='<div class="fld"><label>How do you work?</label><div class="chipsf">'+['group','one','prog','open'].map(function(k){ return '<button class="chipf '+(sv.indexOf(k)>=0?'on':'')+'" data-a="svc" data-v="'+k+'">'+SVN[k]+'</button>'; }).join('')+'</div></div>';
  h+='<div class="fld"><label>Do you have staff?</label><div class="seg2"><button class="'+(S.staff===false?'on':'')+'" data-a="staff" data-v="0">Just me</button><button class="'+(S.staff===true?'on':'')+'" data-a="staff" data-v="1">I have staff</button></div></div>';
  h+='</div><div class="foot"><button class="btn main" data-a="go" data-v="today" '+(ok?'':'disabled')+'>Create '+esc(S.biz||'my business')+'</button></div>';
  return h;
}
function today(){
  var sv=svcFrom(); if(!sv.length) sv=['one','prog'];
  var steps=[['Your first plan or pack','What you sell, from an example'],['How people pay you','Credit card, cash and the rest'],['Your business','Address, description, legal name, affiliations'],['Your look','Logo and colors'],['Write your waiver','Paste the one you use today']];
  if(sv.indexOf('group')>=0) steps.push(['Add your first class','Your weekly schedule']);
  if(S.staff) steps.push(['Add staff','Give your team their roles']);
  steps.push(['Share your Join link','Instagram, WhatsApp, your bio']); steps.push(['Connect Stripe','Take cards; plans charge on their own']);
  var h='<div class="top"><span class="brand">'+esc(S.biz||'Marta Fit')+'</span></div><div class="today"><div><div class="lab">Today</div><h2>Hi, Marta</h2></div><div class="trial"><span><b>'+(S.staff?'Business':'Pro')+' trial</b> · 30 days left</span><button class="btn" style="height:30px;font-size:13px">See plans</button></div>';
  h+='<div class="gs"><div class="hd"><b>Get started</b><span>0 of '+steps.length+'</span></div><div class="bar"><i style="width:0"></i></div>';
  steps.forEach(function(x,i){ h+='<div class="gr"><span class="dot"></span><span class="t">'+x[0]+'<small>'+x[1]+'</small></span><button class="btn'+(i===0?' main':'')+'">Start</button></div>'; });
  return h+'</div><p class="note">Each step ticks itself when it’s done. The first two get you to your first sale.</p></div>';
}
function render(){
  document.body.className=(S.wid==='phone'?'phone':'');
  document.getElementById('g1').innerHTML=[['hq','HQ invite'],['email','The email'],['one','Sign-up screen'],['today','Today'],['expired','Expired link']].map(function(x){return '<button data-a="start" data-v="'+x[0]+'" aria-pressed="'+(S.step===x[0])+'">'+x[1]+'</button>';}).join('');
  document.getElementById('g2').innerHTML=[['desk','Laptop'],['phone','Phone']].map(function(x){return '<button data-a="wid" data-v="'+x[0]+'" aria-pressed="'+(S.wid===x[0])+'">'+x[1]+'</button>';}).join('');
  document.getElementById('case').innerHTML=CASES[S.step];
  var sh=document.getElementById('sheet'); sh.className='sheet'+(S.step==='hq'?' hq':''); sh.innerHTML={hq:hq,email:email,one:one,today:today,expired:expired}[S.step]();
}
function setStart(v){ S.step=v; if(v==='hq') S.wid='desk'; if(v==='one'||v==='today'||v==='expired'||v==='email') S.wid='phone'; if((v==='today'||v==='one')&&!S.city) S.city=v==='today'?'San Juan, Puerto Rico':'';
  if(v==='today'&&!S.focus.length){ S.focus=['strength']; S.svc=['one','prog']; S.staff=false; } render(); }
document.addEventListener('click',function(ev){ var el=ev.target.closest('[data-a]'); if(!el) return; var a=el.dataset.a, v=el.dataset.v; ev.preventDefault();
  if(a==='start') return setStart(v);
  if(a==='wid') S.wid=v;
  if(a==='go'){ S.step=v; if(v!=='hq') S.wid='phone'; }
  if(a==='found') S.f.found=!S.f.found;
  if(a==='send'){ S.invites.unshift([S.f.name,S.f.email,S.f.biz,'Sent','m','just now · expires in 7 days',S.f.found]); S.f={name:'',email:'',biz:'',found:true}; }
  if(a==='foc'){ var i=S.focus.indexOf(v); if(i>=0) S.focus.splice(i,1); else S.focus.push(v); }
  if(a==='svc'){ var j=S.svc.indexOf(v); if(j>=0) S.svc.splice(j,1); else S.svc.push(v); }
  if(a==='staff') S.staff=v==='1';
  render(); });
document.addEventListener('input',function(ev){ var f=ev.target.dataset.f; if(!f) return;
  if(f==='other'){ S.other=ev.target.value; return; }
  if(f==='city'){ S.city=ev.target.value; var pos=ev.target.selectionStart; render(); var ci=document.querySelector('[data-f=city]'); ci.focus(); ci.setSelectionRange(pos,pos); return; }
  if(f==='biz'&&S.step==='one'){ S.biz=ev.target.value; var b=document.querySelector('.foot .btn.main'); if(b) b.textContent='Create '+(S.biz||'my business'); return; }
  S.f[f]=ev.target.value; var sb=document.querySelector('[data-a=send]'); if(sb) sb.disabled=!(S.f.name.trim()&&S.f.email.indexOf('@')>0&&S.f.biz.trim()); });
render();
</script>
