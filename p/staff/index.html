<script>
// Grounded at phoenix main 5b23e7d: apps/identity/staff.py. A role is given to a Relationship this business already holds, picked from its own list (PR #144 call 3);
// roles admin · coach · front desk (owner not grantable); several roles per person; revoke ends the role and keeps the row; last owner can't be revoked;
// staff roles work only on the Business Zana plan (req 1). Granted/revoked by identity.staff.invite / identity.staff.revoke: owner and admin.
var ROLES=[['admin','Admin','Everything but the business’s name, its billing rules, writing off what’s owed and special prices. Adds and removes staff.'],['coach','Coach','Runs the schedule, classes and programs, checks people in, reads the client record. Doesn’t sell or see money.'],['desk','Front desk','Adds people, checks them in, sells and collects, saves cards. Doesn’t change products or the schedule.']];
var RN={owner:'Owner',admin:'Admin',coach:'Coach',desk:'Front desk'};
var S={start:'list', wid:'desk', plan:'business', step:0, pick:null, roles:[], q:'', add:null, toast:null, sheet:null,
 staff:[['Daniela Ruiz',['owner'],'Today','—'],['Marta López',['admin','coach'],'Today','12 classes'],['Luis Ortiz',['coach'],'Yesterday','8 classes'],['Rosa Pérez',['desk'],'Today','—'],['Pedro Santos',['coach','desk'],'Never signed in','4 classes']],
 people:[['Ana Rivera','Member','Unlimited monthly'],['José Vega','Member','8 classes a month'],['Carmen Díaz','Prospect','Joined Nov 4 · no purchase yet'],['Diego Morales','Lapsed','Plan ended Aug 30'],['Elena Torres','Member','10-class pack'],['Kevin Ramos','Prospect','Joined by link Nov 6'],['Sofia Méndez','Member','Kids club']]};
function ini(n){ return n.split(' ').map(function(w){return w[0];}).join('').slice(0,2); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
var CASES={
 list:'<b>People › Staff.</b> The main button is <b>Add staff</b> (was “Invite staff”). Staff are people the gym already has: a role is added to someone in its list (canon, PR #144).',
 pick:'<b>Add staff, step 1: who.</b> Search everyone the gym has (members, prospects, lapsed). Not there? <b>Add person</b> first (name and email; they get the usual sign-in email), then come straight back.',
 roles:'<b>Step 2: what they do.</b> Pick one or more roles; each says in plain words what it can do. Owner is never offered here.',
 plan:'<b>Not on the Business plan.</b> Staff work only on Business (req 1). The list stays; Add staff says why.'
};
function setStart(v){ S.start=v; S.step=0; S.pick=null; S.roles=[]; S.add=null; S.sheet=null; S.toast=null; S.plan='business';
  if(v==='pick') S.step=1; if(v==='roles'){ S.step=2; S.pick=['Carmen Díaz','Prospect','Joined Nov 4 · no purchase yet']; S.roles=['coach']; } if(v==='plan') S.plan='pro'; render(); }
function list(){
  var h='<div class="lab">People</div><div class="titlerow"><h1>People</h1>'+(S.plan==='business'?'<button class="btn main" data-a="addstaff">Add staff</button>':'')+'</div><div class="ptabs"><span>Community</span><span>Leads</span><span class="on">Staff</span></div>';
  if(S.plan!=='business') h+='<div class="planwall"><div><b>Staff need the Business plan</b><span>Your staff keep their roles and get them back the moment you upgrade.</span></div><button class="btn main" style="height:40px">See plans</button></div>';
  h+='<div class="card"><table class="pt staff"><thead><tr><th>Person</th><th>Role</th><th>This week</th><th>Last seen</th></tr></thead><tbody>';
  S.staff.forEach(function(p){ h+='<tr data-a="person" data-n="'+p[0]+'"><td><div class="pn"><span class="ini">'+ini(p[0])+'</span><span>'+p[0]+'</span></div></td><td>'+p[1].map(function(r){return '<span class="rolep">'+RN[r]+'</span>';}).join('')+'</td><td class="tr">'+p[3]+'</td><td>'+(p[2]==='Never signed in'?'<span class="st old">Never signed in</span>':'<span class="tr">'+p[2]+'</span>')+'</td></tr>'; });
  h+='</tbody></table><div class="mrows">';
  S.staff.forEach(function(p){ h+='<div class="prow" data-a="person" data-n="'+p[0]+'"><span class="ini">'+ini(p[0])+'</span><div class="tx"><div class="nm">'+p[0]+'</div><div class="when">'+p[1].map(function(r){return RN[r];}).join(' · ')+' · '+(p[2]==='Never signed in'?'<span class="st old">Never signed in</span>':'seen '+p[2].toLowerCase())+'</div></div><span class="chev">›</span></div>'; });
  return h+'</div></div>';
}
function panel(){
  var h, ok=false, cta='Next';
  if(S.add){ var a=S.add; h='<div class="ph"><button class="ib" data-a="unadd">‹</button><h3>Add person</h3><button class="ib" data-a="close">✕</button></div><div class="pb"><div class="fld"><label>Name</label><input type="text" data-f="name" value="'+esc(a.name)+'" placeholder="Luis Ortiz"></div><div class="fld"><label>Email</label><input type="text" data-f="email" value="'+esc(a.email)+'" placeholder="luis@email.com"><div class="hint">They get the usual email to sign in to Barrio. Phone and the rest can wait.</div></div></div><div class="pf"><button class="btn main" data-a="addsave" '+(a.name.trim()?'':'disabled')+'>Add and continue</button></div>'; return h; }
  if(S.sheet){ var p=S.staff.filter(function(x){return x[0]===S.sheet;})[0], own=p[1].indexOf('owner')>=0;
    h='<div class="ph"><h3>'+p[0]+'</h3><button class="ib" data-a="close">✕</button></div><div class="pb"><div class="who"><span class="ini">'+ini(p[0])+'</span><div><b>'+p[0]+'</b><span>'+(p[2]==='Never signed in'?'Hasn’t signed in yet':'Last seen '+p[2].toLowerCase())+'</span></div></div>';
    if(own) h+='<div class="consq">The owner’s role isn’t changed here.</div>';
    else { h+='<p class="q">Roles</p><div class="checks">'; ROLES.forEach(function(r){ var on=p[1].indexOf(r[0])>=0; h+='<button class="ck '+(on?'on':'')+'" data-a="srole" data-v="'+r[0]+'"><span class="box">'+(on?'✓':'')+'</span><span><b style="font-weight:600">'+r[1]+'</b><span class="cap">'+r[2]+'</span></span></button>'; }); h+='</div>';
      if(p[2]==='Never signed in') h+='<button class="btn" data-a="resend" style="align-self:flex-start">Resend sign-in email</button>';
      h+='<button class="btn risk" data-a="remove" style="align-self:flex-start">Remove from staff</button><div class="consq">Their roles end; they stay in your People with everything else. The record of what they could do, and when, is kept.</div>'; }
    return h+'</div>'; }
  if(S.step===1){ var q=S.q.toLowerCase(), ppl=S.people.filter(function(p){return !q||p[0].toLowerCase().indexOf(q)>=0;});
    h='<div class="ph"><h3>Add staff</h3><button class="ib" data-a="close">✕</button></div><div class="pb"><p class="q">Who?</p><input type="text" data-f="q" value="'+esc(S.q)+'" placeholder="Search your people">';
    h+='<div class="pick">'; ppl.forEach(function(p){ var on=S.pick&&S.pick[0]===p[0]; h+='<div class="prow '+(on?'on':'')+'" data-a="pick" data-n="'+p[0]+'"><span class="ini">'+ini(p[0])+'</span><div class="tx"><div class="nm">'+p[0]+'</div><div class="when">'+p[2]+'</div></div><span class="st mute">'+p[1]+'</span></div>'; });
    if(!ppl.length) h+='<div class="prow" style="cursor:default"><div class="tx"><div class="when">Nobody called “'+esc(S.q)+'” yet.</div></div></div>';
    h+='<button class="addp" data-a="addperson"><span class="plus">+</span><span>Not in your list? <b>Add person</b></span></button></div>';
    h+='</div><div class="pf"><button class="btn main" data-a="next" '+(S.pick?'':'disabled')+'>Next</button></div>'; return h; }
  if(S.step===2){ var pk=S.pick; ok=S.roles.length>0; var first=pk[0].split(' ')[0];
    cta=ok?'Make '+first+' '+(S.roles.length>1?'staff':(S.roles[0]==='admin'?'an admin':S.roles[0]==='coach'?'a coach':'front desk')):'Pick a role';
    h='<div class="ph"><button class="ib" data-a="prev">‹</button><h3>Add staff</h3><button class="ib" data-a="close">✕</button></div><div class="pb"><div class="who"><span class="ini">'+ini(pk[0])+'</span><div><b>'+pk[0]+'</b><span>'+pk[1]+' · '+pk[2]+'</span></div></div><p class="q">What will '+first+' do?</p><div class="checks">';
    ROLES.forEach(function(r){ var on=S.roles.indexOf(r[0])>=0; h+='<button class="ck '+(on?'on':'')+'" data-a="role" data-v="'+r[0]+'"><span class="box">'+(on?'✓':'')+'</span><span><b style="font-weight:600">'+r[1]+'</b><span class="cap">'+r[2]+'</span></span></button>'; });
    h+='</div><div class="consq">Nothing else changes for '+first+': bookings, plans and payments stay as they are. Next time '+first+' opens Barrio, it asks <b>Work</b> or <b>Train</b>.</div></div><div class="pf"><button class="btn main" data-a="make" '+(ok?'':'disabled')+'>'+cta+'</button></div>'; return h; }
  return '';
}
function render(){
  var open=S.step||S.add||S.sheet;
  document.body.className=(S.wid==='phone'?'phone ':'')+(open?'open':'');
  document.getElementById('g1').innerHTML=[['list','Staff tab'],['pick','Add staff: who'],['roles','Add staff: roles'],['plan','Not on Business']].map(function(x){return '<button data-a="start" data-v="'+x[0]+'" aria-pressed="'+(S.start===x[0])+'">'+x[1]+'</button>';}).join('');
  document.getElementById('g2').innerHTML=[['desk','Laptop'],['phone','Phone']].map(function(x){return '<button data-a="wid" data-v="'+x[0]+'" aria-pressed="'+(S.wid===x[0])+'">'+x[1]+'</button>';}).join('');
  document.getElementById('case').innerHTML=CASES[S.plan!=='business'?'plan':S.step===1||S.add?'pick':S.step===2?'roles':'list'];
  document.getElementById('main').innerHTML=list();
  document.getElementById('panel').innerHTML=panel();
  var old=document.querySelector('.undo'); if(old) old.remove();
  if(S.toast){ var t=document.createElement('div'); t.className='undo'; t.innerHTML='<span>'+S.toast+'</span><button data-a="untoast">Undo</button>'; document.body.appendChild(t); }
}
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-a]'); if(!el) return; var a=el.dataset.a, v=el.dataset.v; ev.preventDefault();
  if(a!=='untoast') S.toast=null;
  if(a==='start') return setStart(v);
  if(a==='wid') S.wid=v;
  if(a==='addstaff'){ S.step=1; S.q=''; S.pick=null; S.roles=[]; }
  if(a==='close'){ S.step=0; S.add=null; S.sheet=null; }
  if(a==='pick') S.pick=S.people.filter(function(p){return p[0]===el.dataset.n;})[0];
  if(a==='next') S.step=2; if(a==='prev') S.step=1;
  if(a==='role'){ var i=S.roles.indexOf(v); if(i>=0) S.roles.splice(i,1); else S.roles.push(v); }
  if(a==='make'){ S.staff.push([S.pick[0],S.roles.slice(),'Never signed in','—']); S.people=S.people.filter(function(p){return p[0]!==S.pick[0];}); S.toast=S.pick[0]+' is now staff.'; S.step=0; }
  if(a==='addperson') S.add={name:S.q,email:''};
  if(a==='unadd') S.add=null;
  if(a==='addsave'){ var np=[S.add.name.trim(),'Prospect','Added just now']; S.people.unshift(np); S.pick=np; S.add=null; S.step=2; S.roles=[]; }
  if(a==='person') S.sheet=el.dataset.n;
  if(a==='srole'){ var p=S.staff.filter(function(x){return x[0]===S.sheet;})[0], j=p[1].indexOf(v); if(j>=0){ if(p[1].length>1) p[1].splice(j,1); } else p[1].push(v); }
  if(a==='resend'){ S.toast='Sign-in email sent again.'; S.sheet=null; }
  if(a==='remove'){ var n=S.sheet; S.staff=S.staff.filter(function(x){return x[0]!==n;}); S.toast=n+' removed from staff.'; S.sheet=null; }
  if(a==='untoast') S.toast=null;
  render();
});
document.addEventListener('input',function(ev){ var f=ev.target.dataset.f; if(!f) return;
  if(f==='q'){ S.q=ev.target.value; var pos=ev.target.selectionStart; render(); var i=document.querySelector('[data-f=q]'); i.focus(); i.setSelectionRange(pos,pos); return; }
  S.add[f]=ev.target.value; var b=document.querySelector('[data-a=addsave]'); if(b) b.disabled=!S.add.name.trim(); });
render();
</script>
</body>
