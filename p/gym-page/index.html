<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Gym page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display:ital@0;1&family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Jost:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Prototype v2: a gym's own page in six designed styles, shaped by business type. Owners pick ingredients (type, logo, color, photos, style, words, sections); Zana does the layout.
   Everything is pretend: no server, no payments, no messages. Changes are saved in this browser only. */
:root{--ink:#111;--t2:#4A4A48;--t3:#5C5C59;--line:#E8E8E5;--rowline:#F0F0ED;--page:#F5F5F3;--card:#fff;--fill:#F0F0ED;--fillh:#E4E4E0;--grey:#F3F3F0;--red:#A8261B;--redbg:#FDE8E6;--green:#17663A;--greenbg:#E4F5E8;--amber:#8A5A00;--amberbg:#FFF6E0;
  --sans:"Geist",-apple-system,system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:clip}
body{background:var(--page);color:var(--ink);font:15px/1.45 var(--sans)}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=time],textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:0 14px;height:44px;font-size:16px;background:#fff;color:var(--ink)}
textarea{padding:10px 14px;height:auto;min-height:88px;resize:vertical;line-height:1.45}
input:focus,textarea:focus,select:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:transparent}

/* ---------- test strip ---------- */
.test{background:#111;color:#ddd;font-size:12px;display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;padding:8px 16px;position:relative;z-index:70}
.test b{color:#fff;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:11px}
.seg{display:inline-flex;gap:2px;background:#2a2a2a;padding:2px;border-radius:8px;flex-wrap:wrap}
.seg button{border:0;background:none;color:#ccc;height:28px;padding:0 10px;border-radius:6px;font-size:12px}
.seg button[aria-pressed="true"]{background:#fff;color:#111}
.test .reset{margin-left:auto;border:0;background:none;color:#fff;text-decoration:underline;text-underline-offset:3px;font-size:12px;font-weight:600}
.case{background:#1d1d1c;color:#e9e9e6;font-size:13px;padding:8px 16px;line-height:1.45}.case b{color:#fff}
.bare .test,.bare .case{display:none}

/* ---------- owner app frame ---------- */
.frame{display:grid;grid-template-columns:96px minmax(0,1fr);min-height:calc(100vh - 80px)}
.band{background:#0E0E0E;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0}
.band .tl{width:40px;height:40px;border-radius:10px;background:#fff;color:#0E0E0E;font-weight:700;font-size:14px;display:grid;place-items:center;margin-bottom:14px;overflow:hidden}
.band .tl img{width:100%;height:100%;object-fit:contain}
.band .bi{width:76px;height:56px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#A3A3A0;font-size:12px;font-weight:500}
.band .bi.on{background:rgba(255,255,255,.13);color:#fff;font-weight:600}
.appmain{padding:28px 40px 80px;min-width:0}
.mob{display:none;align-items:center;gap:12px;height:56px;background:#0E0E0E;color:#fff;padding:0 16px}
.mob b{flex:1;font-size:17px}
.lab{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t3)}
h1{margin:4px 0 16px;font-size:36px;font-weight:700;letter-spacing:-.03em}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.tabs span{flex:none;padding:10px 0;font-size:15px;color:var(--t3)}.tabs span.on{color:var(--ink);font-weight:600;border-bottom:2px solid var(--ink)}
.tabs .new,.new{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#1F6F78;margin-left:6px}
.btn{height:36px;padding:0 14px;border-radius:10px;border:0;background:var(--fill);font-size:15px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);text-decoration:none}
.btn:hover{background:var(--fillh)}.btn.main{background:var(--ink);color:#fff}.btn.sm{height:30px;font-size:13px;padding:0 10px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.linkb{border:0;background:none;padding:0;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;color:var(--ink)}
.mut{color:var(--t3)}.note{font-size:13px;color:var(--t3);line-height:1.45;margin:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;border-radius:12px;padding:12px 16px;font-size:14px;z-index:120;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}

/* settings: two columns, knobs and a live preview */
.ywrap{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:28px;align-items:start}
.pvcol{position:sticky;top:16px;display:grid;gap:10px;min-width:0}
.pvhd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.seg2{display:inline-flex;background:var(--fill);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg2 button{border:0;background:none;height:34px;padding:0 12px;border-radius:8px;font-size:14px;font-weight:500}
.seg2 button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.pvbox{border:1px solid var(--line);border-radius:18px;background:#ddd;overflow:hidden;position:relative}
.pvscale{transform-origin:top left;pointer-events:none}
.pvbox.phonebox{width:390px;max-width:100%;margin:0 auto;border:8px solid #111;border-radius:34px}
.pvbox .pvin{height:72vh;overflow:auto}
.linkrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.linkrow .u{flex:1;min-width:180px;font:500 15px var(--mono)}
.status{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:3px 7px}
.status.live{background:var(--greenbg);color:var(--green)}.status.thin{background:var(--amberbg);color:var(--amber)}
.grp{margin-top:22px}.grp>.lab{margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:14px}
.kn{display:grid;gap:6px}.kn>label,.kn>.kl{font-size:14px;font-weight:600}
.kn .hint{font-size:13px;color:var(--t3)}
.cnt{font-size:12px;color:var(--t3);text-align:right;font-variant-numeric:tabular-nums}.cnt.over{color:var(--red);font-weight:600}
.tg{display:flex;justify-content:space-between;align-items:center;gap:14px}
.tg b{display:block;font-size:15px;font-weight:600}.tg span{font-size:13px;color:var(--t3)}
.tog{width:48px;height:28px;border-radius:14px;background:#CFCFCA;border:0;position:relative;flex:none}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:var(--ink)}.tog.on::after{left:23px}
.dots{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dot2{width:32px;height:32px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.dot2.on{box-shadow:0 0 0 2px var(--ink)}
.dot2.none{background:#fff;position:relative}.dot2.none::after{content:'';position:absolute;left:4px;right:4px;top:50%;height:2px;background:#C24;transform:rotate(-45deg)}
.custom{display:flex;gap:8px;align-items:center}.custom input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:10px;padding:2px;background:#fff}
.say{font-size:13px;border-radius:10px;padding:8px 12px;background:var(--grey);color:var(--t2)}
.say.warn{background:var(--amberbg);color:var(--amber)}.say.bad{background:var(--redbg);color:var(--red)}
.thumb{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:var(--fill);cursor:crosshair;border:1px solid var(--line)}
.thumb .fp{position:absolute;width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #111,0 2px 8px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none}
.thumb .cap{position:absolute;left:8px;bottom:8px;font:500 11px var(--mono);background:rgba(0,0,0,.55);color:#fff;border-radius:5px;padding:2px 6px}
.samples{display:flex;gap:6px;flex-wrap:wrap}
.samp{width:52px;height:36px;border-radius:8px;border:2px solid transparent;padding:0}
.samp.on{border-color:var(--ink)}
.filebtn{position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.logobox{display:flex;gap:14px;align-items:center}
.logobox .lg{width:56px;height:56px;border-radius:12px;background:var(--fill);display:grid;place-items:center;font-weight:700;font-size:18px;color:var(--t2);overflow:hidden;flex:none}
.logobox .lg img{width:100%;height:100%;object-fit:contain}
.arow{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px}
.arow .ah{display:flex;gap:8px;align-items:center}
.arow .ah input{height:40px;font-weight:600}
.mv{display:flex;flex-direction:column;gap:2px}.mv button{width:30px;height:19px;border:0;border-radius:6px;background:var(--fill);font-size:11px;line-height:1;padding:0}
.mv button:disabled{opacity:.3}
.ast{font-size:13px;color:var(--t3)}.ast b{color:var(--green)}.ast.hid b{color:var(--amber)}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--rowline)}
.prow:first-child{border-top:0;padding-top:0}
.prow .pn b{font-size:15px;font-weight:600}.prow .pn small{display:block;font-size:13px;color:var(--t3)}
.star{border:1px solid var(--line);background:#fff;border-radius:8px;height:30px;padding:0 10px;font-size:13px;font-weight:600;color:var(--t3);white-space:nowrap}
.star.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fixed{display:grid;gap:8px;font-size:14px;color:var(--t2)}.fixed div{display:grid;grid-template-columns:20px 1fr;gap:6px}
.og{border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:420px;background:#fff}
.og .oi{aspect-ratio:1.91/1;background:var(--fill)}
.og .ot{padding:10px 12px;font-size:13px;color:var(--t3)}.og .ot b{display:block;color:var(--ink);font-size:15px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;border:0;background:none;padding:0;text-align:left}
.cb{width:22px;height:22px;border-radius:6px;border:2px solid #BDBDB8;display:grid;place-items:center;font-size:13px;color:#fff;flex:none;margin-top:0}
.chk.on .cb,.cb.on{background:var(--ink);border-color:var(--ink)}

/* ---------- sign-up sheets ---------- */
.stage{display:flex;justify-content:center;padding:32px 16px 80px}
.sheet{width:520px;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:20px;min-height:640px;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:14px 20px;min-height:60px}
.brand{font-weight:700;font-size:18px;letter-spacing:-.02em;flex:1}
.body{flex:1;padding:8px 20px 20px;display:flex;flex-direction:column;gap:16px}
.body h2{margin:0;font-size:28px;letter-spacing:-.02em;line-height:1.15}.body .sub{margin:-8px 0 0;color:var(--t2);font-size:15px}
.foot{padding:16px 20px 20px;display:flex;flex-direction:column;gap:10px}
.foot .btn{height:48px;border-radius:12px;font-size:16px;width:100%}
.fld label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}.fld .hint{font-size:13px;color:var(--t3);margin-top:6px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ftile{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:56px}
.ftile b{font-size:15px;font-weight:600}.ftile span{font-size:12px;color:var(--t3)}
.ftile.on{background:#111;border-color:#111;color:#fff}.ftile.on span{color:#bbb}
.chipsf{display:flex;flex-wrap:wrap;gap:8px}
.chipf{height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:15px;font-weight:500}
.chipf.on{background:#111;border-color:#111;color:#fff}
.setfor{background:var(--grey);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--t2)}.setfor b{color:var(--ink)}
.mailv{padding:24px;display:flex;flex-direction:column;gap:14px;font-size:15px;line-height:1.55}
.mailh{font-size:13px;color:var(--t3);border-bottom:1px solid var(--line);padding-bottom:12px}.mailh b{color:var(--ink)}
.dotsprog{display:flex;gap:6px}.dotsprog i{width:28px;height:4px;border-radius:2px;background:var(--fill)}.dotsprog i.on{background:var(--ink)}
.namerows{display:grid;gap:8px}
.namerow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:center;font-size:13px;color:var(--t3)}
/* Today */
.today{padding:8px 20px 24px;display:flex;flex-direction:column;gap:16px}
.today h2{margin:0;font-size:28px}
.trial{display:flex;justify-content:space-between;align-items:center;background:var(--grey);border-radius:12px;padding:10px 14px;font-size:14px}
.gs{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.gs .hd{padding:14px 16px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--rowline)}.gs .hd b{font-size:17px}.gs .hd span{font-size:13px;color:var(--t3)}
.pbar{height:4px;background:var(--fill)}.pbar i{display:block;height:100%;background:var(--green)}
.gr{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--rowline);min-height:60px}
.gr:first-of-type{border-top:0}
.gdot{width:22px;height:22px;border-radius:50%;border:2px solid #BDBDB8;flex:none;display:grid;place-items:center;font-size:12px;color:#fff}
.gr.done .gdot{background:var(--green);border-color:var(--green)}.gr.done .t{color:var(--t3);text-decoration:line-through}
.gr .t{flex:1;font-size:15px;font-weight:500}.gr .t small{display:block;font-size:13px;color:var(--t3);font-weight:400;text-decoration:none;margin-top:2px}
.gr.hl{background:#F6FAF9}

/* modal sheet */
.scrim{position:fixed;inset:0;background:rgba(17,17,17,.4);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;color:#111;width:min(480px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:22px;display:grid;gap:14px;box-shadow:0 16px 40px rgba(17,17,17,.35)}
.modal h3{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em}
.modal p{margin:0;color:var(--t2);font-size:15px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal .acts .btn{height:44px;border-radius:12px;font-size:15px}
.modal .big{width:100%;height:48px!important;font-size:16px!important}
.modal .ok{display:flex;gap:12px;align-items:flex-start;background:var(--greenbg);border-radius:12px;padding:12px 14px;color:#0E4A29;font-size:14px}

/* phone width (switch, and real phones) */
.phone .wrap{background:#ddd;padding:16px 0}
.phone .frame{grid-template-columns:1fr;max-width:390px;margin:0 auto;background:var(--page);min-height:800px}
.phone .band{display:none}.phone .mob{display:flex}
.phone .appmain{padding:20px 16px 80px}
.phone h1{font-size:28px}
.phone .ywrap{grid-template-columns:1fr}.phone .pvcol{display:none}
.phone .stage{padding:16px 0;background:#ddd}.phone .sheet{width:390px;border-radius:28px;min-height:780px}
.phone .pubwrap{max-width:390px;margin:0 auto;border-left:1px solid #ccc;border-right:1px solid #ccc}
.pvmob{display:none}.phone .pvmob{display:flex}
@media (max-width:760px){
  .frame{grid-template-columns:1fr}.band{display:none}.mob{display:flex}
  .appmain{padding:20px 16px 80px}h1{font-size:28px}
  .ywrap{grid-template-columns:1fr}.pvcol{display:none}.pvmob{display:flex}
  .stage{padding:0}.sheet{border-radius:0;border:0;min-height:100vh}
  .phone .wrap{padding:0;background:var(--page)}.phone .pubwrap{border:0}
  .namerow{grid-template-columns:1fr}
}
@media (max-width:1100px){.ywrap{grid-template-columns:minmax(0,1fr) minmax(0,400px)}}


/* ---------- v2 owner pieces: business type, style picker, photo library, sections ---------- */
.sheet.wide{width:760px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ttile{border:1px solid var(--line);border-radius:16px;background:#fff;text-align:left;padding:14px;display:grid;gap:10px;align-content:start}
.ttile .tpic{height:72px;border-radius:10px;background:var(--grey);display:grid;place-items:center;overflow:hidden}
.ttile .tpic svg{width:100%;height:100%}
.ttile b{font-size:16px;font-weight:600}.ttile span{font-size:13px;color:var(--t3);line-height:1.4}
.ttile.on{border-color:#111;box-shadow:0 0 0 1px #111}
.ttile.on .tpic{background:#111}
.ttile.on .tpic svg *{stroke:#fff}
.stygrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.stycard{cursor:pointer;border:1px solid var(--line);border-radius:16px;background:#fff;padding:0;text-align:left;overflow:hidden;display:flex;flex-direction:column}
.stycard .sthumb{height:236px;overflow:hidden;position:relative;background:#eee;pointer-events:none}
.stycard .sthumb>div{width:1180px;zoom:.3;transform-origin:top left}
.stycard .stx{padding:12px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:1px solid var(--line)}
.stycard .stx b{font-size:15px}.stycard .stx span{font-size:12px;color:var(--t3);text-align:right}
.stycard.on{border-color:#111;box-shadow:0 0 0 2px #111}
.stycard.on .stx{background:#111;color:#fff}.stycard.on .stx span{color:#bbb}
.lib{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.libph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:0;padding:0;background:#ddd}
.libph img{width:100%;height:100%;object-fit:cover;display:block}
.libph .n{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:#111;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.libph.on{box-shadow:0 0 0 3px #111}
.libph.sug::after{content:'Suggested';position:absolute;left:6px;bottom:6px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:rgba(255,255,255,.9);color:#111;border-radius:4px;padding:2px 5px}
.slots{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.slot{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:4/3;background:var(--fill);border:1px dashed #C9C9C4;display:grid;place-items:center;font-size:13px;color:var(--t3)}
.slot:first-child{aspect-ratio:auto;grid-row:span 1}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .lb{position:absolute;left:8px;top:8px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:rgba(0,0,0,.6);color:#fff;border-radius:5px;padding:2px 6px}
.slot .x{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1}
.secrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--rowline)}
.secrow:first-child{border-top:0;padding-top:0}
.secrow b{font-size:15px;font-weight:600;display:block}.secrow small{font-size:13px;color:var(--t3)}
.secrow.auto b{color:var(--t3)}
.ctas2{display:grid;gap:8px}
.ctaopt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 12px;text-align:left;font-size:15px}
.ctaopt .rd{width:20px;height:20px;border-radius:50%;border:2px solid #BDBDB8;flex:none}
.ctaopt.on{border-color:#111}.ctaopt.on .rd{border:6px solid #111}
.ctaopt small{display:block;font-size:12px;color:var(--t3)}
.ctaopt:disabled{opacity:.45;cursor:not-allowed}
.colorline{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cbig{width:52px;height:52px;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);flex:none}
.checks{display:grid;gap:8px;font-size:14px}
.checks div{display:grid;grid-template-columns:22px 1fr;gap:6px;color:var(--t2)}
.checks .ok{color:var(--green);font-weight:700}.checks .fx{color:var(--amber);font-weight:700}
.phonecheck{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start}
.phoneframe{width:340px;height:640px;border:9px solid #111;border-radius:40px;overflow:auto;background:#fff;position:relative;flex:none;scrollbar-width:none}
.phoneframe>div{width:322px}
.draftbtn{border:0;background:#EEF4F4;color:#1F5A61;border-radius:8px;height:30px;padding:0 10px;font-size:13px;font-weight:600;justify-self:start}
/* styles gallery view */
.gal{padding:28px 32px 80px;display:grid;gap:28px}
.gal h1{margin:0}
.galgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.galitem{display:grid;gap:10px}
.galitem .gp{height:520px;overflow:auto;border-radius:16px;border:1px solid var(--line);background:#fff;scrollbar-width:thin}
.galitem .gp>div{width:1180px;zoom:.48}
.galitem .gt{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.galitem .gt b{font-size:18px}.galitem .gt span{font-size:13px;color:var(--t3)}
.phone .galgrid,.phone .stygrid{grid-template-columns:1fr}
.phone .galitem .gp>div{width:390px;zoom:1}
.phone .sheet.wide{width:390px}
.phone .phonecheck{grid-template-columns:1fr}
@media (max-width:760px){
  .galgrid,.stygrid{grid-template-columns:1fr}.gal{padding:20px 16px}
  .galitem .gp>div{width:390px;zoom:.86}
  .lib{grid-template-columns:repeat(3,minmax(0,1fr))}
  .phonecheck{grid-template-columns:1fr}.phoneframe{margin:0 auto}
  .sheet.wide{width:100%}
}

/* =====================================================================
   The gym's page. One structure, six styles. Each style sets its own
   fonts, colors, spacing, buttons, photo treatment and phone layout.
   The gym's main color comes in as --ac (already checked for contrast).
   ===================================================================== */
.g{container-type:inline-size;container-name:g;--bg:#fff;--sf:#f5f5f4;--ink:#111;--mu:#5e5e5b;--ln:#e5e5e2;--hf:var(--sans);--bf:var(--sans);--rad:14px;--brad:10px;--pf:none;
  background:var(--bg);color:var(--ink);font-family:var(--bf);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100%;overflow-x:clip}
.g *{box-sizing:border-box}
.g img{display:block;max-width:100%}
.g a{color:inherit}
.g .in{max-width:1180px;margin:0 auto;padding-inline:48px}
.g h1,.g h2,.g h3,.g h4{font-family:var(--hf);margin:0;font-weight:inherit}
.g p{margin:0}
.g .ph{width:100%;height:100%;object-fit:cover;filter:var(--pf)}
.g .ini{width:100%;height:100%;display:grid;place-items:center;background:var(--sf);color:var(--mu);font:600 28px var(--hf)}
/* buttons */
.g .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 24px;border-radius:var(--brad);font:600 15px/1 var(--bf);border:0;cursor:pointer;text-decoration:none;white-space:nowrap;letter-spacing:.01em}
.g .b.pri{background:var(--ac);color:var(--onac)}
.g .b.alt{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.g .b.sm{height:38px;padding:0 16px;font-size:14px}
.g .b.ghost{background:transparent;color:var(--mu);box-shadow:inset 0 0 0 1px var(--ln);cursor:default}
.g .b.done{background:transparent;color:var(--act);box-shadow:inset 0 0 0 1.5px var(--act)}
.g .tlink{font:600 15px var(--bf);color:var(--ink);text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1.5px;background:none;border:0;padding:0;cursor:pointer}
.g .eyebrow{font:600 12px var(--bf);letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
/* header */
.g .hd{position:sticky;top:0;z-index:6;background:var(--hdbg,var(--bg));color:var(--hdink,var(--ink));border-bottom:1px solid var(--hdln,var(--ln))}
.g .hd .in{display:flex;align-items:center;gap:14px;height:72px}
.g .logo{height:38px;display:flex;align-items:center;flex:none}
.g .logo img{height:38px;width:auto;max-width:150px;object-fit:contain}
.g .logo .lt{width:38px;height:38px;border-radius:10px;background:var(--ac);color:var(--onac);display:grid;place-items:center;font:700 13px var(--bf)}
.g .gname{font:600 19px var(--hf);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.g .hd nav{margin-left:auto;display:flex;align-items:center;gap:22px;font-size:14px;font-weight:500}
.g .hd nav .lk{display:flex;gap:22px}
.g .hd nav .lk a{cursor:pointer;text-decoration:none;opacity:.8}
.g .hd nav .lk a:hover{opacity:1}
.g .lang{display:inline-flex;border-radius:7px;overflow:hidden;box-shadow:inset 0 0 0 1px currentColor;opacity:.75}
.g .lang button{border:0;background:none;color:inherit;font:600 11px var(--mono);padding:4px 7px}
.g .lang button.on{background:var(--hdink,var(--ink));color:var(--hdbg,var(--bg))}
.g .signin{border:0;background:none;color:inherit;font:500 14px var(--bf);padding:0;cursor:pointer}
.g .me{display:inline-flex;align-items:center;border:0;background:none;padding:0;cursor:pointer}
.g .me i{width:32px;height:32px;border-radius:50%;background:var(--ac);color:var(--onac);display:grid;place-items:center;font:700 12px var(--bf);font-style:normal}
.g .ban{background:var(--ink);color:var(--bg);font-size:14px;font-weight:500}
.g .ban .in{display:flex;gap:10px;align-items:center;min-height:44px;padding-block:9px}
.g .ban .dot{width:8px;height:8px;border-radius:50%;background:var(--ac);flex:none}
/* sections */
.g .sec{padding:104px 0}
.g .sec+.sec{border-top:1px solid var(--ln)}
.g .sh{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:40px}
.g .sh .sn{display:none}
.g .sh h2{font-size:52px;line-height:1.02;letter-spacing:-.02em}
.g .sh .sd{color:var(--mu);max-width:400px;font-size:15px}
/* start here / your plan */
.g .strip{background:var(--sf);border-radius:var(--rad);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:24px;align-items:center;padding:22px 26px}
.g .strip .k{font:600 12px var(--bf);letter-spacing:.12em;text-transform:uppercase;color:var(--act)}
.g .strip b{display:block;font:500 24px/1.15 var(--hf)}
.g .strip p{color:var(--mu);font-size:14px;margin-top:2px}
.g .strip .pr{font:500 30px var(--hf);white-space:nowrap}
.g .stripw{padding-top:28px}
/* schedule */
.g .days{display:flex;gap:6px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.g .days button{flex:1 0 64px;border:0;background:transparent;color:var(--mu);border-radius:var(--brad);padding:10px 0;font:600 13px var(--bf);cursor:pointer;box-shadow:inset 0 0 0 1px var(--ln)}
.g .days button small{display:block;font:500 20px var(--hf);color:var(--ink);margin-top:2px}
.g .days button.on{background:var(--ink);color:var(--bg);box-shadow:none}
.g .days button.on small{color:var(--bg)}
.g .filt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.g .filt button{border:0;background:var(--sf);color:var(--ink);height:36px;padding:0 16px;border-radius:999px;font:500 14px var(--bf);cursor:pointer}
.g .filt button.on{background:var(--ac);color:var(--onac)}
.g .rows{border-top:1px solid var(--ln)}
.g .row{display:grid;grid-template-columns:110px minmax(0,1fr) 130px 116px;gap:18px;align-items:center;padding:18px 0;border-bottom:1px solid var(--ln)}
.g .row .tm{font:500 20px var(--hf);font-variant-numeric:tabular-nums}
.g .row .cn{font:600 17px var(--bf)}
.g .row .cm{font-size:14px;color:var(--mu)}
.g .row .sp{font-size:13px;color:var(--mu);text-align:right}
.g .row .sp.low{color:var(--act);font-weight:600}
.g .row .b{width:100%}
.g .grp+.grp{margin-top:36px}
.g .grp h3{font:600 13px var(--bf);letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin-bottom:10px}
.g .empty{color:var(--mu);font-size:15px;padding:18px 0}
/* memberships */
.g .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.g .card{background:var(--sf);border-radius:var(--rad);padding:30px 28px;display:flex;flex-direction:column;gap:10px;position:relative}
.g .card .cn{font:600 17px var(--bf)}
.g .card .pr{font:500 46px/1 var(--hf);letter-spacing:-.02em;margin:6px 0}
.g .card .pr small{font-size:16px;color:var(--mu);font-family:var(--bf);letter-spacing:0;margin-left:2px}
.g .card p{color:var(--mu);font-size:14px}
.g .card .cov{font-size:13px;color:var(--mu);border-top:1px solid var(--ln);padding-top:10px}
.g .card .b{margin-top:auto;align-self:stretch}
.g .card .gap{flex:1}
.g .card.st{background:var(--ac);color:var(--onac)}
.g .card.st p,.g .card.st .pr small,.g .card.st .cov{color:inherit;opacity:.8}
.g .card.st .b.pri{background:var(--onac);color:var(--ac)}
.g .card .tag{position:absolute;top:18px;right:18px;font:700 11px var(--bf);letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.g .card.have{box-shadow:inset 0 0 0 2px var(--act)}
.g .have{font:600 14px var(--bf);color:var(--act);margin-top:auto}
.g .tax{font-size:13px;color:var(--mu);margin-top:16px}
/* areas */
.g .areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.g .area{display:grid;gap:14px;align-content:start}
.g .area .ai{aspect-ratio:4/3;border-radius:var(--rad);overflow:hidden;background:var(--sf)}
.g .area h3{font-size:28px;line-height:1.1}
.g .area p{color:var(--mu);font-size:15px}
.g .area .am{font-size:13px;font-weight:600;color:var(--act)}
/* area tabs (gym with several areas) */
.g .atabs{position:sticky;top:72px;z-index:5;background:var(--bg);border-bottom:1px solid var(--ln)}
.g .atabs .in{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:12px}
.g .atabs button{flex:none;border:0;background:transparent;color:var(--mu);height:40px;padding:0 18px;border-radius:999px;font:600 14px var(--bf);cursor:pointer}
.g .atabs button.on{background:var(--ink);color:var(--bg)}
.g .apanel{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:48px;align-items:start}
.g .apanel .ai{aspect-ratio:5/4;border-radius:var(--rad);overflow:hidden;background:var(--sf)}
.g .apanel h3{font-size:44px;line-height:1.05;margin-bottom:12px}
.g .apanel>div>p{color:var(--mu);font-size:16px;margin-bottom:22px}
.g .mini{border-top:1px solid var(--ln)}
.g .mini>div{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln);font-size:15px}
.g .mini .tm{font-variant-numeric:tabular-nums;color:var(--mu)}
.g .mini .pr{font-weight:600}
.g .alist{display:grid;gap:8px;margin-top:18px}
.g .alist h4{font:600 12px var(--bf);letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
/* coaches */
.g .coaches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.g .coach .ci{aspect-ratio:3/4;border-radius:var(--rad);overflow:hidden;background:var(--sf);margin-bottom:14px}
.g .coach .ci .ph{object-position:50% 20%}
.g .coach .ci.noph,.g.s-calm .coach .ci.noph{aspect-ratio:1;width:76px;border-radius:50%;margin-bottom:16px}
.g.s-calm .coach .ci.noph{margin-inline:auto}
.g .coach .ci.noph .ini{background:color-mix(in srgb,var(--ac) 16%,var(--bg));color:var(--act);font-size:24px}
.g .coaches:has(.noph){row-gap:36px}
.g .coach b{display:block;font:500 22px/1.2 var(--hf)}
.g .coach span{display:block;font-size:13px;color:var(--act);font-weight:600;margin:2px 0 6px}
.g .coach p{font-size:14px;color:var(--mu)}
/* reviews */
.g .revs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.g .rev{background:var(--sf);border-radius:var(--rad);padding:30px;display:flex;flex-direction:column;gap:18px}
.g .rev q{font:400 21px/1.4 var(--hf);quotes:none}
.g .rev .who{font-size:14px;color:var(--mu);margin-top:auto}
.g .rev .who b{color:var(--ink);font-weight:600}
.g .stars{color:var(--act);letter-spacing:2px;font-size:14px}
/* how it works (coach) */
.g .how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;counter-reset:hw}
.g .how>div{border-top:2px solid var(--ink);padding-top:18px;counter-increment:hw}
.g .how>div::before{content:counter(hw,decimal-leading-zero);display:block;font:500 15px var(--hf);color:var(--act);margin-bottom:14px}
.g .how b{display:block;font:500 24px/1.15 var(--hf);margin-bottom:8px}
.g .how p{color:var(--mu);font-size:15px}
/* today's workout (box) */
.g .wod{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:40px;align-items:start}
.g .wod .wh .k{font:700 12px var(--bf);letter-spacing:.14em;text-transform:uppercase;color:var(--act)}
.g .wod .wh h2{font-size:48px;line-height:1;margin:10px 0 12px}
.g .wod .wh p{color:var(--mu);font-size:15px}
.g .wod .parts{display:grid;gap:14px}
.g .wod .part{background:var(--sf);border-radius:var(--rad);padding:20px 22px}
.g .wod .part b{display:block;font:700 12px var(--bf);letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.g .wod .part div{font:500 20px/1.4 var(--bf);white-space:pre-line}
/* location */
.g .loc{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:start}
.g .map{aspect-ratio:16/11;border-radius:var(--rad);position:relative;overflow:hidden;background:var(--sf)}
.g .map svg{position:absolute;inset:0;width:100%;height:100%}
.g .map .pin{position:absolute;left:52%;top:46%;width:22px;height:22px;border-radius:50% 50% 50% 0;background:var(--ac);transform:rotate(-45deg);box-shadow:0 0 0 6px color-mix(in srgb,var(--ac) 25%,transparent)}
.g .facts{display:grid;gap:26px}
.g .fact .k{font:600 12px var(--bf);letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.g .fact{font-size:16px}
.g .hours{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;font-size:15px}
.g .hours span:nth-child(odd){color:var(--mu)}
.g .online{background:var(--sf);border-radius:var(--rad);padding:30px;display:grid;gap:10px}
.g .online b{font:500 28px/1.15 var(--hf)}
.g .online p{color:var(--mu)}
/* faq */
.g .faq{border-top:1px solid var(--ln);max-width:860px}
.g .faq details{border-bottom:1px solid var(--ln)}
.g .faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:20px;padding:22px 0;font:500 20px/1.3 var(--hf)}
.g .faq summary::-webkit-details-marker{display:none}
.g .faq summary::after{content:'+';font:300 26px/1 var(--bf);color:var(--mu)}
.g .faq details[open] summary::after{content:'\2212'}
.g .faq details p{padding:0 0 22px;color:var(--mu);max-width:680px}
.g .rules{margin-top:28px;font-size:14px;color:var(--mu);display:grid;gap:6px;max-width:860px}
.g .rules b{color:var(--ink);font-weight:600}
/* join band + footer */
.g .joinb{background:var(--ac);color:var(--onac);padding:96px 0}
.g .joinb .in{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end}
.g .joinb h2{font-size:60px;line-height:1;letter-spacing:-.02em}
.g .joinb p{opacity:.85;margin-top:12px;max-width:520px}
.g .joinb .b.pri{background:var(--onac);color:var(--ac)}
.g .ft{padding:30px 0 40px;font-size:13px;color:var(--mu)}
.g .ft .in{display:flex;gap:22px;flex-wrap:wrap;align-items:center}
.g .ft .pz{margin-left:auto}
/* gallery strip of extra photos */
.g .gall{display:grid;grid-template-columns:2fr 1fr 1fr;gap:16px;height:420px}
.g .gall>div{border-radius:var(--rad);overflow:hidden;background:var(--sf)}

/* ---------- heroes (one per style) ---------- */
.g .hx{position:relative}
.g .hx .tag{font-size:19px;line-height:1.5;color:var(--mu);max-width:520px}
.g .hx .acts{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.g .hx .where{font:600 12px var(--bf);letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.g .hx .about{font-size:16px;color:var(--mu);max-width:560px}

/* ===== Calm: soft, airy, serif, arched photo ===== */
.g.s-calm{--bg:#F7F3EE;--sf:#EFE8DF;--ink:#2A2522;--mu:#6D635B;--ln:#E3D9CD;--hf:"Cormorant Garamond",Georgia,serif;--bf:"Jost",system-ui,sans-serif;--rad:22px;--brad:999px;--pf:saturate(.85) sepia(.08)}
.g.s-calm .gname{font-size:24px;font-weight:600}
.g.s-calm .sh{flex-direction:column;align-items:center;text-align:center;gap:12px}
.g.s-calm .sh h2{font-size:58px;font-weight:500}
.g.s-calm .sh .sd{text-align:center}
.g.s-calm .card .pr,.g.s-calm .rev q{font-weight:500}
.g.s-calm .card{background:#FBF8F4;box-shadow:inset 0 0 0 1px var(--ln)}
.g.s-calm .card.st{box-shadow:none}
.g.s-calm .area .ai,.g.s-calm .coach .ci{border-radius:999px 999px var(--rad) var(--rad)}
.g.s-calm .coach .ci{aspect-ratio:4/5}
.g.s-calm .area,.g.s-calm .coach{text-align:center}
.g.s-calm .rev{text-align:center;align-items:center;background:transparent;box-shadow:inset 0 0 0 1px var(--ln)}
.g.s-calm .hx-calm .in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:64px;align-items:center;padding-block:56px 96px}
.g.s-calm .hx-calm h1{font-size:88px;line-height:.95;font-weight:500;letter-spacing:-.02em;margin:18px 0 22px}
.g.s-calm .hx-calm h1 em{font-style:italic;color:var(--act)}
.g.s-calm .hx-calm .tx{display:grid;gap:0}
.g.s-calm .hx-calm .acts{margin-top:34px}
.g.s-calm .hx-calm .pics{position:relative;height:620px}
.g.s-calm .hx-calm .p1{position:absolute;inset:0 0 0 40px;border-radius:999px 999px 28px 28px;overflow:hidden;background:var(--sf)}
.g.s-calm .hx-calm .p2{position:absolute;left:-24px;bottom:48px;width:190px;height:190px;border-radius:50%;overflow:hidden;border:8px solid var(--bg);background:var(--sf)}
.g.s-calm .hx-calm .seal{position:absolute;right:-14px;top:70px;width:120px;height:120px;border-radius:50%;background:var(--ac);color:var(--onac);display:grid;place-items:center;text-align:center;font:500 15px/1.15 var(--hf);font-style:italic;padding:14px}
.g.s-calm .joinb{text-align:center}
.g.s-calm .joinb .in{grid-template-columns:1fr;justify-items:center}
.g.s-calm .joinb h2{font-weight:500;font-size:64px}

/* ===== Bold: black, giant condensed type, duotone photo ===== */
.g.s-bold{--bg:#0A0A0A;--sf:#161616;--ink:#F4F4F1;--mu:#A2A29E;--ln:#262624;--hf:"Anton",Impact,sans-serif;--bf:"Archivo",system-ui,sans-serif;--rad:0px;--brad:0px;--pf:grayscale(1) contrast(1.15)}
.g.s-bold .gname{font-size:24px;text-transform:uppercase;letter-spacing:.02em}
.g.s-bold .b{text-transform:uppercase;letter-spacing:.08em;font-weight:800;font-size:14px}
.g.s-bold .sh h2,.g.s-bold .card .pr,.g.s-bold .area h3,.g.s-bold .apanel h3,.g.s-bold .joinb h2,.g.s-bold .wod .wh h2,.g.s-bold .coach b{text-transform:uppercase;letter-spacing:0;font-weight:400}

const isAll=a=>a==='all';
function shownProducts(g){return g.products.filter(p=>p.show&&p.id!==g.start);}

/* which sections can show, and why not */
function secWhy(g,k){
  if(k==='wod')return g.type!=='box'?'Only for a CrossFit box':(!g.wod?'No workout posted today':'');
  if(k==='how')return g.type!=='coach'?'Only for a coach':(!g.how||!g.how.length?'No steps yet':'');
  if(k==='schedule')return g.classes.length?'':'No classes yet';
  if(k==='prices')return shownProducts(g).length||startProd(g)?'':'No plans or packs yet';
  if(k==='areas'){const n=visibleAreas(g).length;if(g.type==='coach')return 'Not used on a coach page';if(g.type==='multi')return n?'':'No areas with classes or prices yet';return n>1?'':'Only one area, so nothing to show';}
  if(k==='coaches')return g.type==='coach'?'The page is about you':(g.coaches.length?'':'No coaches added yet');
  if(k==='reviews')return g.reviews.length?'':'No reviews yet';
  if(k==='faq')return g.faq.length?'':'No questions yet';

/* what Zana checked or fixed, shown before publishing and in Settings */
function checks(g){
  const out=[], C=colors(g), st=STY[g.style];
  if(C.fillShift)out.push(['fx',`Your color is close to the ${st.n} page’s background, so buttons use a ${lum(C.ac)>lum(g.color)?'lighter':'deeper'} shade of it.`]);
  if(C.textShift)out.push(['fx',`Small words in your color use a darker shade on ${st.n} so they stay readable.`]);
  if(!C.fillShift&&!C.textShift)out.push(['ok',`Your color reads well on ${st.n}.`]);
  if(!g.tag)out.push(['fx','No headline yet, so your name shows instead.']);
  else out.push(['ok',`Headline fits (${g.tag.length} of ${HEAD_MAX} letters).`]);
  if(!g.photos.length)out.push(['fx','No photos yet, so the page uses three from Zana’s library.']);
  if(!ctaOk(g,g.cta))out.push(['fx',`“${CTAS.find(c=>c[0]===g.cta)[1]}” can’t work yet, so the main button says “${ctaLabel(g)}”.`]);
  g.sections.filter(s=>s.on&&secWhy(g,s.k)).forEach(s=>{const w=secWhy(g,s.k);if(!/^Only for|^Not used|about you/.test(w))out.push(['fx',`${SECS[s.k]} is hidden: ${w.toLowerCase()}.`]);});
  out.push(['ok','Phone layout checked: words, buttons and photos fit a 390 px screen.']);
  return out;
}

function fitPreview(){
  document.querySelectorAll('.sthumb>div,.gp>div').forEach(x=>{const cw=parseFloat(getComputedStyle(x).width);const w=x.parentElement.clientWidth;if(w&&cw>=1000)x.style.zoom=((w-2)/cw).toFixed(4);});
  const box=document.getElementById('pvbox'), sc=document.getElementById('pvscale'); if(!box||!sc)return;
  if(S.pv==='phone'){sc.style.width='374px';sc.style.zoom='';return;}
  const w=box.clientWidth, base=1240, s=Math.min(1,w/base);
  sc.style.width=base+'px'; sc.style.zoom=s;
}

let toastT=null;
function toast(msg){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el);}el.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),3200);}

/* =========================================================================
   Actions
   ========================================================================= */
function findClass(g,id){return g.classes.find(c=>c.id===id);}
function findProd(g,id){return g.products.find(p=>p.id===id);}
function doBook(g,cid){
  (S.booked[g.key]=S.booked[g.key]||{})[S.day+'|'+cid]=1;
  const c=findClass(g,cid); const d=DAYS[S.day];
  modal({k:'done',msg:`Booked: ${esc(c.n)}, ${d[0]} ${d[1]} at ${esc(c.t)}.`,more:g.rules?esc(g.rules):''});
}
function canBook(g,c){
  if(S.member&&g.me)return true;
  const sp=startProd(g); return sp&&isFree(sp)&&covers(sp,c.area)&&(S.requested[g.key]||{})[sp.id];
}
function afterJoin(intent){
  const g=G(); S.joined[g.key]=1; S.member=true;
  if(!g.me)g.me={owns:[],left:'No plan yet',next:null,fresh:true};
  if(!intent){modal({k:'done',msg:`You\u2019re in. Welcome to ${esc(g.name)}.`});render();return;}
  if(intent.t==='call'){render();return modal({k:'done',msg:`You\u2019re signed up. ${esc(g.name.split(' ')[0])} will message you to set up your free call.`});}
  if(intent.t==='buy')return buyFlow(g,intent.id,true);
  if(intent.t==='book'){
    const c=findClass(g,intent.id), sp=startProd(g);
    if(sp&&isFree(sp)&&covers(sp,c.area)){
      (S.requested[g.key]=S.requested[g.key]||{})[sp.id]=1; g.me.owns.push(sp.id); g.me.left=sp.n; g.me.next=`${c.n}, ${DAYS[S.day][0]} ${c.t}`;
      render(); return doBook(g,c.id);
    }
    render();
    modal({k:'done',msg:`You\u2019re signed up. To book ${esc(c.n)} you need a class pack or plan.`,more:sp?`New here? ${esc(sp.n)}, ${esc(priceTxt(sp))}.`:'',cta:sp?[`Get ${esc(sp.n)}`,'buy',sp.id]:null});
  }
}
function buyFlow(g,pid,justJoined){
  const p=findProd(g,pid);
  (S.requested[g.key]=S.requested[g.key]||{})[pid]=1;
  if(isFree(p)){ if(g.me&&!g.me.owns.includes(pid)){g.me.owns.push(pid);g.me.left=p.n;} render();
    return modal({k:'done',msg:`${justJoined?'You\u2019re signed up. ':''}${esc(p.n)} is yours.`,more:g.classes.length?'Pick a class on the schedule and tap Book.':`${esc(g.name)} will contact you to set it up.`});}
  render();
  modal({k:'done',msg:`${justJoined?'You\u2019re signed up. ':''}${esc(g.name)} has your request for ${esc(p.n)} (${esc(p.p)}${esc(p.per||'')}).`,more:`Paying online isn\u2019t on yet. They\u2019ll help you pay at the desk or by WhatsApp, and it shows here as soon as it\u2019s paid.`});
}
function setType(g,v){
  if(g.type===v)return;
  g.type=v;
  const have=g.sections.map(s=>s.k);
  ORDER[v].forEach((k,i)=>{if(!have.includes(k))g.sections.splice(Math.min(i,g.sections.length),0,{k,on:true});});
  if(v==='coach'&&(!g.how||!g.how.length))g.how=g.mode==='Online'?[['Free intro call','15 minutes by video to see if we\u2019re a fit.'],['Your plan in the app','Updated every week.'],['Weekly check-in','Form checks and a call.']]:[['Book a first session','We meet, talk about your goals and test where you are.'],['Get your plan','A program built around your week, in the Zana app.'],['Train with me','Every session coached.']];
  if(v==='box'&&!g.wod)g.wod={name:'Today',parts:[['Strength','Back squat\n5 × 5'],['Workout','12-minute AMRAP\n10 wall balls · 10 burpees']]};
}
function k(g,key,v){
  if(key==='style')g.style=v;
  if(key==='color'){g.color=v;g.colorFrom=g.logoColor&&g.logoColor.toLowerCase()===v.toLowerCase()?'logo':'pick';}
  if(key==='colorlogo'&&g.logoColor){g.color=g.logoColor;g.colorFrom='logo';}
  if(key==='logo'){g.logo=null;g.logoColor=null;g.showName=true;if(g.colorFrom==='logo')g.colorFrom='pick';}
  if(key==='showName')g.showName=!g.showName;
  if(key==='showAddress')g.showAddress=!g.showAddress;
  if(key==='showHours')g.showHours=!g.showHours;
  if(key==='sched')g.sched=v;
  if(key==='cta')g.cta=v;
  if(key==='mode'){g.mode=v;if(v==='Online')g.showAddress=false;}
}
function libToggle(g,name){
  const i=g.photos.indexOf(name);
  if(i>=0)g.photos.splice(i,1); else {if(g.photos.length>=3)g.photos.pop();g.photos.push(name);}
}

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]'); if(!el)return;
  {const na=el.closest('.noact');if(na){ev.preventDefault();const up=na.parentElement&&na.parentElement.closest('[data-a]');if(!up)return;return up.click();}}
  const a=el.dataset.a, v=el.dataset.v; const g=G();
  if(a==='scrim'){if(ev.target===el)closeModal();return;}
  if(el.tagName==='A'||a==='jump')ev.preventDefault();
  /* strip */
  if(a==='view'){S.view=v;S.setup=0;S.setupPick=null;S.reask=false;if(v==='setup'&&S.newKey)S.gym=S.newKey;if(['settings','page','styles'].includes(v)&&!S.gyms[S.gym])S.gym='pilates';
    if(v==='today'||v==='setup'){if(!S.newKey){ensureNew();S.su.addr=S.su.addr||'Calle Ejemplo 7, San Juan';if(!S.su.focus.length)S.su.focus=['strength'];if(!S.su.svc.length)S.su.svc=['one','prog'];if(S.su.staff==null)S.su.staff=false;createGym();S.view=v;}S.gym=S.newKey;}
    location.hash=''; window.scrollTo&&window.scrollTo(0,0); return render();}
  if(a==='gym'){S.gym=v;S.filt='all';return render();}
  if(a==='mem'){S.member=v==='1';return render();}
  if(a==='wid'){S.wid=v;return render();}
  if(a==='reset'){if(el.dataset.sure){localStorage.removeItem(KEY);S=fresh();closeModal();return render();}el.dataset.sure='1';el.textContent='Tap again to erase your changes';setTimeout(()=>{if(el.isConnected){delete el.dataset.sure;el.textContent='Start over';}},3000);return;}
  /* sign-up */
  if(a==='go'){S.view=v;return render();}
  if(a==='suf'){const f=S.su.focus,i=f.indexOf(v);i>=0?f.splice(i,1):f.push(v);return render();}
  if(a==='sus'){const f=S.su.svc,i=f.indexOf(v);i>=0?f.splice(i,1):f.push(v);return render();}
  if(a==='sust'){S.su.staff=v==='1';return render();}
  if(a==='create'){createGym();toast(`${S.gyms[S.newKey].name} is created.`);return render();}
  if(a==='gs'){const ng=S.gyms[S.newKey];S.gym=S.newKey;
    if(v==='page'){if(ng.published){S.view='settings';}else{S.view='setup';S.setup=0;S.setupPick=null;}return render();}
    if(v==='prod')return modal({k:'qprod',all:true,sel:[]});
    if(v==='cls'){if(!ng.areas.length)return modal({k:'msg',title:'Set up your page first',msg:'A class belongs to an area (a Track). Set up your page to name your areas, then add the class.'});return modal({k:'qcls',area:ng.areas[0].id});}
    if(v==='share'){ng.shared=true;navigator.clipboard&&navigator.clipboard.writeText(pageUrl(ng)).catch(()=>{});toast('Link copied: zana.fit/'+slug(ng.name));return render();}
    return toast('Not part of this prototype.');}
  /* setup */
  if(a==='settype'){setType(g,v);if(S.view==='setup'&&!g.styleTouched)g.style=TYPE_STYLE[v];return render();}
  if(a==='opick'){const pk=S.setupPick,i=pk.findIndex(p=>p.k===v);
    if(i>=0){const ex=pk[i].id&&g.areas.find(x=>x.id===pk[i].id);if(ex&&(g.classes.some(c=>c.area===ex.id)||g.products.some(p=>!isAll(p.a)&&p.a.includes(ex.id)))){return modal({k:'msg',title:`${esc(ex.n)} has classes or prices`,msg:'Untick it after moving them, or stop offering it in Settings › Tracks. Removing it here would hide them.'});}pk.splice(i,1);}
    else pk.push({k:v,n:el.dataset.n});return render();}
  if(a==='ownadd'){const inp=document.getElementById('ownarea');const n=(inp&&inp.value||'').trim();if(n){S.setupPick.push({k:'own-'+slug(n),n});}return render();}
  if(a==='setback'){if(S.setup===0||S.reask){if(S.setup===1)S.setupPick=null;S.view=S.reask?'settings':'today';S.reask=false;S.setup=0;}else S.setup--;return render();}
  if(a==='setnext'){
    if(S.setup===1){const bl=applyPick(g);if(S.reask){S.reask=false;S.view='settings';S.setup=0;if(bl.length)toast(`${bl.map(x=>x.n).join(', ')} kept: they have classes or prices.`);return render();}}
    if(S.setup===2&&!g.photos.length)g.photos=libFor(g.type).slice(0,3);
    if(S.setup===4&&!g.tag&&!g.desc){const d=draftWords(g);g.tag=d.tag;g.desc=d.desc;}
    if(S.setup<6){S.setup++;if(S.setup===1)S.setupPick=null;window.scrollTo&&window.scrollTo(0,0);return render();}
    g.published=true;g.pageSet=true;S.view='settings';S.setup=0;toast(`Your page is live at zana.fit/${slug(g.name)}.`);return render();}
  /* knobs */
  if(a==='k'){if(el.dataset.k==='style')g.styleTouched=true;k(g,el.dataset.k,v);return render();}
  if(a==='usestyle'){g.style=v;g.styleTouched=true;toast(`${g.name} now uses ${STY[v].n}.`);return render();}
  if(a==='draft'){const d=draftWords(g);g.tag=d.tag;g.desc=d.desc;toast('Zana wrote a draft. Edit anything.');return render();}
  if(a==='phrm'){g.photos.splice(+v,1);return render();}
  if(a==='phrot'){g.photos.push(g.photos.shift());return render();}
  if(a==='libopen')return modal({k:'lib'});
  if(a==='areaph')return modal({k:'lib',area:+v});
  if(a==='libpick'){const ctx=el.dataset.ctx;
    if(ctx==='area'){g.areas[M.area].ph=v;closeModal();return render();}
    libToggle(g,v);
    if(ctx==='modal'){render();return drawModal();}
    return render();}
  if(a==='smv'){const i=+v,j=i+(+el.dataset.d);const ar=g.sections;[ar[i],ar[j]]=[ar[j],ar[i]];return render();}
  if(a==='stog'){const s=g.sections[+v];s.on=!s.on;return render();}
  if(a==='reask'){S.reask=true;S.setupPick=initPick(g);S.view='setup';S.setup=1;return render();}
  if(a==='pshow'){const p=findProd(g,v);p.show=!p.show;return render();}
  if(a==='pstart'){g.start=g.start===v?null:v;return render();}
  if(a==='banclear'){g.banner={text:'',end:''};return render();}
  if(a==='pv'){S.pv=v;return render();}
  if(a==='copy'){navigator.clipboard&&navigator.clipboard.writeText(pageUrl(g)).catch(()=>{});toast('Copied. In Zana: zana.fit/'+slug(g.name)+'. Here, a labs link to this page.');return;}
  if(a==='viewpage'){S.view='page';S.member=false;window.scrollTo&&window.scrollTo(0,0);return render();}
  if(a==='othertab')return toast('Other Settings tabs are in the Settings prototype.');
  if(a==='qadd'){if(v==='prod')return modal({k:'qprod',all:!el.dataset.i,sel:el.dataset.i?[el.dataset.i]:[]});if(!g.areas.length)return toast('Name your areas first.');return modal({k:'qcls',area:el.dataset.i||g.areas[0].id});}
  /* public page */
  if(a==='jump'){const t2=document.getElementById(v);if(t2&&t2.scrollIntoView)t2.scrollIntoView({behavior:'smooth',block:'start'});return;}
  if(a==='lang'){S.lang=v;return render();}
  if(a==='day'){S.day=+v;return render();}
  if(a==='filt'){S.filt=v;return render();}
  if(a==='tab'){S.tab[g.key]=v;return render();}
  if(a==='signin')return modal({k:'signin'});
  if(a==='signinsend'){const e=document.getElementById('se');return modal({k:'signin',sent:true,email:e&&e.value});}
  if(a==='signinok'){S.member=true;if(!g.me)g.me={owns:[],left:'No plan yet',next:null};closeModal();return render();}
  if(a==='signout'){S.member=false;toast('Signed out.');return render();}
  if(a==='joinbtn'){if(S.member&&v==='call'){return modal({k:'done',msg:`${esc(g.name.split(' ')[0])} will message you to set up your free call.`});}return modal({k:'join',sms:false,wv:false,intent:v==='call'?{t:'call'}:null});}
  if(a==='book'){const c=findClass(g,v);if(canBook(g,c))return doBook(g,v),render();
    if(S.member&&g.me){render();const sp=startProd(g);return modal({k:'done',msg:`To book ${esc(c.n)} you need a class pack or plan.`,cta:sp?[`Get ${esc(sp.n)}`,'buy',sp.id]:null});}
    return modal({k:'join',sms:false,wv:false,intent:{t:'book',id:v,label:`${c.n} at ${c.t}`}});}
  if(a==='unbook'){delete (S.booked[g.key]||{})[S.day+'|'+v];toast('Booking cancelled.');return render();}
  if(a==='buy'){const p=findProd(g,v);closeModal();if(S.member)return buyFlow(g,v,false);return modal({k:'join',sms:false,wv:false,intent:{t:'buy',id:v,label:p.n}});}
  /* modal */
  if(a==='mclose')return closeModal();
  if(a==='mtog'){M[v]=!M[v];const n=document.getElementById('jn'),e=document.getElementById('je');if(n)M.name=n.value;if(e)M.email=e.value;return drawModal();}
  if(a==='joingo'){const n=document.getElementById('jn').value.trim(),e=document.getElementById('je').value.trim();
    if(!n||e.indexOf('@')<1){M.name=n;M.email=e;drawModal();return toast('Add your name and email.');}
    if(!M.wv){M.name=n;M.email=e;drawModal();return toast(`Agree to the ${g.mode==='Online'?'coaching agreement':'waiver'} to sign up.`);}
    const it=M.intent;closeModal();return afterJoin(it);}
  if(a==='qall'){M.all=!M.all;return drawModal();}
  if(a==='qsel'){M.all=false;const i=M.sel.indexOf(v);i>=0?M.sel.splice(i,1):M.sel.push(v);return drawModal();}
  if(a==='qprodok'){const n=document.getElementById('qn').value.trim()||'Plan',p=document.getElementById('qp').value.trim()||'$0',per=document.getElementById('qper').value,d=document.getElementById('qd').value.trim();
    const cov=M.all||!M.sel.length?'all':M.sel.slice();const np={id:uid('p'),n,p:/^\$?0$/.test(p)?'Free':(p[0]==='$'||/free/i.test(p)?p:'$'+p),per,d,a:cov,show:true};g.products.push(np);
    closeModal();toast(`${n} added. Star a plan as Start here in Settings › Your page if you want one for new people.`);return render();}
  if(a==='qclsok'){const n=document.getElementById('cn').value.trim()||'Class',ar=document.getElementById('ca').value,tm=document.getElementById('ct').value.trim()||'7:00 AM',cap=Math.max(1,parseInt(document.getElementById('cc').value)||12),co=document.getElementById('cco').value.trim();
    let area=ar; if(!area){if(!g.areas.length)g.areas=[{id:uid('a'),src:'general',n:'General',d:'',ph:null}];area=g.areas[0].id;}
    g.classes.push({id:uid('c'),area,t:tm,n,coach:co,left:cap,cap});closeModal();toast(`${n} added.`);return render();}
});
document.addEventListener('keydown',ev=>{const el=ev.target;if((ev.key==='Enter'||ev.key===' ')&&el.getAttribute&&el.getAttribute('role')==='button'&&el.dataset.a){ev.preventDefault();el.click();}});
/* typing in knobs: update and refresh the preview without losing focus */
let typT=null;
document.addEventListener('input',ev=>{
  const el=ev.target, g=G();
  if(el.dataset.su){S.su[el.dataset.su]=el.value;const pos=el.selectionStart,key=el.dataset.su;clearTimeout(typT);typT=setTimeout(()=>{render();const x=document.querySelector(`[data-su="${key}"]`);if(x){x.focus();try{x.setSelectionRange(pos,pos);}catch(e){}}},250);return;}
  if(el.dataset.kin){const key=el.dataset.kin;
    if(key==='color'){g.color=el.value;g.colorFrom='pick';clearTimeout(typT);typT=setTimeout(render,150);return;}
    g[key]=el.value;
    if(key==='desc'){const c=document.getElementById('desccnt');if(c){c.textContent=el.value.length+' of '+ABOUT_MAX;c.className='cnt'+(el.value.length>=ABOUT_MAX?' over':'');}}
    if(key==='tag'){const c=document.getElementById('tagcnt');if(c){c.textContent=el.value.length+' of '+HEAD_MAX;c.className='cnt'+(el.value.length>=HEAD_MAX?' over':'');}}
    softPreview();return;}
  if(el.dataset.ban){g.banner=g.banner||{text:'',end:''};g.banner[el.dataset.ban]=el.value;softPreview();if(el.dataset.ban==='end')render();return;}
  if(el.dataset.ain){const a=g.areas[+el.dataset.i];a[el.dataset.ain]=el.value;softPreview();return;}
  if(el.dataset.rn!=null){S.setupPick[+el.dataset.rn].n=el.value;return;}
});
function softPreview(){const sc=document.getElementById('pvscale');if(sc){sc.innerHTML=render_page(G(),true);}save();}
/* uploads: downsized in the browser and kept here only */
document.addEventListener('change',ev=>{
  const el=ev.target; if(!el.dataset.file||!el.files||!el.files[0])return; const f=el.files[0], g=G(), kind=el.dataset.file;
  if(!/^image\/(png|jpeg|webp)$/.test(f.type))return modal({k:'msg',title:'That file type doesn\u2019t work',msg:'Use a PNG, JPEG or WebP picture. SVG logos aren\u2019t accepted.'});
  if(kind==='logo'&&f.size>512*1024)return modal({k:'msg',title:'That logo is too big',msg:`It\u2019s ${Math.round(f.size/1024)} KB. Logos can be up to 512 KB.`});
  const rd=new FileReader(); rd.onload=()=>{const im=new Image();im.onload=()=>{
    const max=kind==='logo'?320:1600, sc=Math.min(1,max/Math.max(im.width,im.height));
    const cv=document.createElement('canvas');cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);const cx=cv.getContext('2d');cx.drawImage(im,0,0,cv.width,cv.height);
    if(kind==='logo'){
      const found=colorFromPixels(cx.getImageData(0,0,cv.width,cv.height).data);
      g.logo=cv.toDataURL('image/png');g.logoColor=found;g.showName=true;
      if(found){g.color=found;g.colorFrom='logo';toast('We took your main color from your logo.');}
      else toast('Your logo has no clear color. Pick one below.');
    } else {
      const url=cv.toDataURL('image/jpeg',.8);
      if(g.photos.length>=3)g.photos.pop(); g.photos.unshift(url);
      if(im.width<1200)toast(`This photo is ${im.width} px wide, so it may look soft on a laptop. 1600 px or wider is best.`);
    }
    render();};im.src=rd.result;}; rd.readAsDataURL(f);
});
function pageUrl(g){return location.origin+location.pathname+'#/page/'+g.key;}

/* links: #/page/pilates, #/styles/box, #/settings/box, #/signup; add /bare to hide the test strip */
function fromHash(){
  const m=location.hash.match(/^#\/(\w+)(?:\/([\w-]+))?/); if(!m)return;
  const v=m[1], key=m[2];
  if(VIEWS.some(x=>x[0]===v))S.view=v;
  if(key&&S.gyms[key])S.gym=key;
}
addEventListener('hashchange',()=>{fromHash();render();});
fromHash();
if(S.view==='setup'&&!S.newKey)S.view='page';
render();
</script>
