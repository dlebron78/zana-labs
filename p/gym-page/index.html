<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Gym page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Prototype: a gym's own page (storefront, PHO-286), how a new gym gets there from sign-up, and the owner's Settings › Your page.
   Everything is pretend: no server, no payments, no messages. Changes are saved in this browser only. */
:root{--ink:#111;--t2:#4A4A48;--t3:#5C5C59;--line:#E8E8E5;--rowline:#F0F0ED;--page:#F5F5F3;--card:#fff;--fill:#F0F0ED;--fillh:#E4E4E0;--grey:#F3F3F0;--red:#A8261B;--redbg:#FDE8E6;--green:#17663A;--greenbg:#E4F5E8;--amber:#8A5A00;--amberbg:#FFF6E0;
  --sans:"Geist",-apple-system,system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:clip}
body{background:var(--page);color:var(--ink);font:15px/1.45 var(--sans)}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=time],textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:0 14px;height:44px;font-size:16px;background:#fff;color:var(--ink)}
textarea{padding:10px 14px;height:auto;min-height:88px;resize:vertical;line-height:1.45}
input:focus,textarea:focus,select:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:transparent}

/* ---------- test strip ---------- */
.test{background:#111;color:#ddd;font-size:12px;display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;padding:8px 16px;position:relative;z-index:70}
.test b{color:#fff;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:11px}
.seg{display:inline-flex;gap:2px;background:#2a2a2a;padding:2px;border-radius:8px;flex-wrap:wrap}
.seg button{border:0;background:none;color:#ccc;height:28px;padding:0 10px;border-radius:6px;font-size:12px}
.seg button[aria-pressed="true"]{background:#fff;color:#111}
.test .reset{margin-left:auto;border:0;background:none;color:#fff;text-decoration:underline;text-underline-offset:3px;font-size:12px;font-weight:600}
.case{background:#1d1d1c;color:#e9e9e6;font-size:13px;padding:8px 16px;line-height:1.45}.case b{color:#fff}
.bare .test,.bare .case{display:none}

/* ---------- owner app frame ---------- */
.frame{display:grid;grid-template-columns:96px minmax(0,1fr);min-height:calc(100vh - 80px)}
.band{background:#0E0E0E;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0}
.band .tl{width:40px;height:40px;border-radius:10px;background:#fff;color:#0E0E0E;font-weight:700;font-size:14px;display:grid;place-items:center;margin-bottom:14px;overflow:hidden}
.band .tl img{width:100%;height:100%;object-fit:contain}
.band .bi{width:76px;height:56px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#A3A3A0;font-size:12px;font-weight:500}
.band .bi.on{background:rgba(255,255,255,.13);color:#fff;font-weight:600}
.appmain{padding:28px 40px 80px;min-width:0}
.mob{display:none;align-items:center;gap:12px;height:56px;background:#0E0E0E;color:#fff;padding:0 16px}
.mob b{flex:1;font-size:17px}
.lab{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t3)}
h1{margin:4px 0 16px;font-size:36px;font-weight:700;letter-spacing:-.03em}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.tabs span{flex:none;padding:10px 0;font-size:15px;color:var(--t3)}.tabs span.on{color:var(--ink);font-weight:600;border-bottom:2px solid var(--ink)}
.tabs .new,.new{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#1F6F78;margin-left:6px}
.btn{height:36px;padding:0 14px;border-radius:10px;border:0;background:var(--fill);font-size:15px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);text-decoration:none}
.btn:hover{background:var(--fillh)}.btn.main{background:var(--ink);color:#fff}.btn.sm{height:30px;font-size:13px;padding:0 10px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.linkb{border:0;background:none;padding:0;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;color:var(--ink)}
.mut{color:var(--t3)}.note{font-size:13px;color:var(--t3);line-height:1.45;margin:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;border-radius:12px;padding:12px 16px;font-size:14px;z-index:120;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}

/* settings: two columns, knobs and a live preview */
.ywrap{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:28px;align-items:start}
.pvcol{position:sticky;top:16px;display:grid;gap:10px;min-width:0}
.pvhd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.seg2{display:inline-flex;background:var(--fill);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg2 button{border:0;background:none;height:34px;padding:0 12px;border-radius:8px;font-size:14px;font-weight:500}
.seg2 button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.pvbox{border:1px solid var(--line);border-radius:18px;background:#ddd;overflow:hidden;position:relative}
.pvscale{transform-origin:top left;pointer-events:none}
.pvbox.phonebox{width:390px;max-width:100%;margin:0 auto;border:8px solid #111;border-radius:34px}
.pvbox .pvin{height:72vh;overflow:auto}
.linkrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.linkrow .u{flex:1;min-width:180px;font:500 15px var(--mono)}
.status{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:3px 7px}
.status.live{background:var(--greenbg);color:var(--green)}.status.thin{background:var(--amberbg);color:var(--amber)}
.grp{margin-top:22px}.grp>.lab{margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:14px}
.kn{display:grid;gap:6px}.kn>label,.kn>.kl{font-size:14px;font-weight:600}
.kn .hint{font-size:13px;color:var(--t3)}
.cnt{font-size:12px;color:var(--t3);text-align:right;font-variant-numeric:tabular-nums}.cnt.over{color:var(--red);font-weight:600}
.tg{display:flex;justify-content:space-between;align-items:center;gap:14px}
.tg b{display:block;font-size:15px;font-weight:600}.tg span{font-size:13px;color:var(--t3)}
.tog{width:48px;height:28px;border-radius:14px;background:#CFCFCA;border:0;position:relative;flex:none}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:var(--ink)}.tog.on::after{left:23px}
.dots{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dot2{width:32px;height:32px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.dot2.on{box-shadow:0 0 0 2px var(--ink)}
.dot2.none{background:#fff;position:relative}.dot2.none::after{content:'';position:absolute;left:4px;right:4px;top:50%;height:2px;background:#C24;transform:rotate(-45deg)}
.custom{display:flex;gap:8px;align-items:center}.custom input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:10px;padding:2px;background:#fff}
.say{font-size:13px;border-radius:10px;padding:8px 12px;background:var(--grey);color:var(--t2)}
.say.warn{background:var(--amberbg);color:var(--amber)}.say.bad{background:var(--redbg);color:var(--red)}
.thumb{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:var(--fill);cursor:crosshair;border:1px solid var(--line)}
.thumb .fp{position:absolute;width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #111,0 2px 8px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none}
.thumb .cap{position:absolute;left:8px;bottom:8px;font:500 11px var(--mono);background:rgba(0,0,0,.55);color:#fff;border-radius:5px;padding:2px 6px}
.samples{display:flex;gap:6px;flex-wrap:wrap}
.samp{width:52px;height:36px;border-radius:8px;border:2px solid transparent;padding:0}
.samp.on{border-color:var(--ink)}
.filebtn{position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.logobox{display:flex;gap:14px;align-items:center}
.logobox .lg{width:56px;height:56px;border-radius:12px;background:var(--fill);display:grid;place-items:center;font-weight:700;font-size:18px;color:var(--t2);overflow:hidden;flex:none}
.logobox .lg img{width:100%;height:100%;object-fit:contain}
.arow{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px}
.arow .ah{display:flex;gap:8px;align-items:center}
.arow .ah input{height:40px;font-weight:600}
.mv{display:flex;flex-direction:column;gap:2px}.mv button{width:30px;height:19px;border:0;border-radius:6px;background:var(--fill);font-size:11px;line-height:1;padding:0}
.mv button:disabled{opacity:.3}
.ast{font-size:13px;color:var(--t3)}.ast b{color:var(--green)}.ast.hid b{color:var(--amber)}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--rowline)}
.prow:first-child{border-top:0;padding-top:0}
.prow .pn b{font-size:15px;font-weight:600}.prow .pn small{display:block;font-size:13px;color:var(--t3)}
.star{border:1px solid var(--line);background:#fff;border-radius:8px;height:30px;padding:0 10px;font-size:13px;font-weight:600;color:var(--t3);white-space:nowrap}
.star.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fixed{display:grid;gap:8px;font-size:14px;color:var(--t2)}.fixed div{display:grid;grid-template-columns:20px 1fr;gap:6px}
.og{border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:420px;background:#fff}
.og .oi{aspect-ratio:1.91/1;background:var(--fill)}
.og .ot{padding:10px 12px;font-size:13px;color:var(--t3)}.og .ot b{display:block;color:var(--ink);font-size:15px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;border:0;background:none;padding:0;text-align:left}
.cb{width:22px;height:22px;border-radius:6px;border:2px solid #BDBDB8;display:grid;place-items:center;font-size:13px;color:#fff;flex:none;margin-top:0}
.chk.on .cb,.cb.on{background:var(--ink);border-color:var(--ink)}

/* ---------- sign-up sheets ---------- */
.stage{display:flex;justify-content:center;padding:32px 16px 80px}
.sheet{width:520px;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:20px;min-height:640px;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:14px 20px;min-height:60px}
.brand{font-weight:700;font-size:18px;letter-spacing:-.02em;flex:1}
.body{flex:1;padding:8px 20px 20px;display:flex;flex-direction:column;gap:16px}
.body h2{margin:0;font-size:28px;letter-spacing:-.02em;line-height:1.15}.body .sub{margin:-8px 0 0;color:var(--t2);font-size:15px}
.foot{padding:16px 20px 20px;display:flex;flex-direction:column;gap:10px}
.foot .btn{height:48px;border-radius:12px;font-size:16px;width:100%}
.fld label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}.fld .hint{font-size:13px;color:var(--t3);margin-top:6px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ftile{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:56px}
.ftile b{font-size:15px;font-weight:600}.ftile span{font-size:12px;color:var(--t3)}
.ftile.on{background:#111;border-color:#111;color:#fff}.ftile.on span{color:#bbb}
.chipsf{display:flex;flex-wrap:wrap;gap:8px}
.chipf{height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:15px;font-weight:500}
.chipf.on{background:#111;border-color:#111;color:#fff}
.setfor{background:var(--grey);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--t2)}.setfor b{color:var(--ink)}
.mailv{padding:24px;display:flex;flex-direction:column;gap:14px;font-size:15px;line-height:1.55}
.mailh{font-size:13px;color:var(--t3);border-bottom:1px solid var(--line);padding-bottom:12px}.mailh b{color:var(--ink)}
.dotsprog{display:flex;gap:6px}.dotsprog i{width:28px;height:4px;border-radius:2px;background:var(--fill)}.dotsprog i.on{background:var(--ink)}
.namerows{display:grid;gap:8px}
.namerow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:center;font-size:13px;color:var(--t3)}
/* Today */
.today{padding:8px 20px 24px;display:flex;flex-direction:column;gap:16px}
.today h2{margin:0;font-size:28px}
.trial{display:flex;justify-content:space-between;align-items:center;background:var(--grey);border-radius:12px;padding:10px 14px;font-size:14px}
.gs{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.gs .hd{padding:14px 16px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--rowline)}.gs .hd b{font-size:17px}.gs .hd span{font-size:13px;color:var(--t3)}
.pbar{height:4px;background:var(--fill)}.pbar i{display:block;height:100%;background:var(--green)}
.gr{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--rowline);min-height:60px}
.gr:first-of-type{border-top:0}
.gdot{width:22px;height:22px;border-radius:50%;border:2px solid #BDBDB8;flex:none;display:grid;place-items:center;font-size:12px;color:#fff}
.gr.done .gdot{background:var(--green);border-color:var(--green)}.gr.done .t{color:var(--t3);text-decoration:line-through}
.gr .t{flex:1;font-size:15px;font-weight:500}.gr .t small{display:block;font-size:13px;color:var(--t3);font-weight:400;text-decoration:none;margin-top:2px}
.gr.hl{background:#F6FAF9}

/* modal sheet */
.scrim{position:fixed;inset:0;background:rgba(17,17,17,.4);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;color:#111;width:min(480px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:22px;display:grid;gap:14px;box-shadow:0 16px 40px rgba(17,17,17,.35)}
.modal h3{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em}
.modal p{margin:0;color:var(--t2);font-size:15px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal .acts .btn{height:44px;border-radius:12px;font-size:15px}
.modal .big{width:100%;height:48px!important;font-size:16px!important}
.modal .ok{display:flex;gap:12px;align-items:flex-start;background:var(--greenbg);border-radius:12px;padding:12px 14px;color:#0E4A29;font-size:14px}

/* phone width (switch, and real phones) */
.phone .wrap{background:#ddd;padding:16px 0}
.phone .frame{grid-template-columns:1fr;max-width:390px;margin:0 auto;background:var(--page);min-height:800px}
.phone .band{display:none}.phone .mob{display:flex}
.phone .appmain{padding:20px 16px 80px}
.phone h1{font-size:28px}
.phone .ywrap{grid-template-columns:1fr}.phone .pvcol{display:none}
.phone .stage{padding:16px 0;background:#ddd}.phone .sheet{width:390px;border-radius:28px;min-height:780px}
.phone .pubwrap{max-width:390px;margin:0 auto;border-left:1px solid #ccc;border-right:1px solid #ccc}
.pvmob{display:none}.phone .pvmob{display:flex}
@media (max-width:760px){
  .frame{grid-template-columns:1fr}.band{display:none}.mob{display:flex}
  .appmain{padding:20px 16px 80px}h1{font-size:28px}
  .ywrap{grid-template-columns:1fr}.pvcol{display:none}.pvmob{display:flex}
  .stage{padding:0}.sheet{border-radius:0;border:0;min-height:100vh}
  .phone .wrap{padding:0;background:var(--page)}.phone .pubwrap{border:0}
  .namerow{grid-template-columns:1fr}
}
@media (max-width:1100px){.ywrap{grid-template-columns:minmax(0,1fr) minmax(0,400px)}}

/* ===================== The gym's page =====================
   Its colors come from the gym's own page look (Black or Light), not the visitor's phone. */
.g{container-type:inline-size;font-family:var(--sans);--gb:#fff;--gs:#f5f5f4;--gi:#0b0b0b;--gm:#62625f;--gl:#e3e3e0;--gt:#ededeb;--hb:#fff;--hi:#0b0b0b;background:var(--gb);color:var(--gi);font-size:15px;line-height:1.5;min-height:100%}
.g.black{--gb:#0d0d0d;--gs:#171717;--gi:#f4f4f2;--gm:#a6a6a2;--gl:#2a2a28;--gt:#232322;--hb:#000;--hi:#fff}
.g *{box-sizing:border-box}
.g .in{max-width:1040px;margin:0 auto;padding-inline:18px}
.g header{background:var(--hb);color:var(--hi);border-bottom:1px solid var(--gl);position:sticky;top:0;z-index:5}
.g header.line{border-bottom:3px solid var(--brand)}
.g header .in{display:flex;align-items:center;gap:10px;height:56px}
.g .mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font:800 12px var(--sans);background:var(--hi);color:var(--hb);flex:none;overflow:hidden}
.g .mark img{width:100%;height:100%;object-fit:contain}
.g .mark.img{background:transparent}
.g .mark.tile-w{background:#fff;padding:3px}.g .mark.tile-k{background:#000;padding:3px}
.g .gname{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.g header nav{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600}
.g header nav .links{display:none;gap:16px;opacity:.85}
.g header nav a{color:inherit;text-decoration:none;cursor:pointer}
.g .lang{display:inline-flex;border:1px solid currentColor;border-radius:8px;overflow:hidden;opacity:.85}
.g .lang button{border:0;background:none;color:inherit;font:600 12px var(--mono);padding:4px 7px}
.g .lang button.on{background:var(--hi);color:var(--hb)}
.g .signin{border:1px solid currentColor;border-radius:8px;padding:5px 10px;background:none;color:inherit;font:600 13px var(--sans)}
.g .me{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:inherit;font:600 13px var(--sans);padding:0}
.g .me i{width:28px;height:28px;border-radius:50%;background:var(--hi);color:var(--hb);display:grid;place-items:center;font-style:normal;font-size:12px}
.g .banner{background:var(--gi);color:var(--gb);font-size:14px;font-weight:600}
.g .banner .in{display:flex;gap:10px;align-items:center;min-height:42px;padding-block:8px}
.g .banner small{font-weight:500;opacity:.7;margin-left:auto;white-space:nowrap}
.g .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:700 14px var(--sans);border-radius:10px;padding:11px 16px;border:0;white-space:nowrap;height:auto;cursor:pointer;text-decoration:none}
.g .btn.primary{background:var(--gi);color:var(--gb)}
.g .btn.tonal{background:var(--gt);color:var(--gi)}
.g .btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.g .btn.ghost{background:transparent;color:var(--gm);border:1px solid var(--gl);cursor:default}
.g .btn.done{background:transparent;color:var(--gi);border:1px solid var(--gi)}
.g .btn.onphoto{background:#fff;color:#0b0b0b}
.g .btn.onphoto2{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.5)}
.g .phl{position:absolute;right:10px;top:10px;font:500 11px var(--mono);color:#fff;background:rgba(0,0,0,.45);padding:2px 6px;border-radius:5px}
.g .hero{padding-block:22px 26px;display:grid;gap:18px}
.g .cover{border-radius:16px;aspect-ratio:16/10;max-width:100%;position:relative;overflow:hidden;background:var(--gs)}
.g .htext{display:flex;flex-direction:column;gap:10px;min-width:0}
.g .where{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--gm);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.g .where .dt{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}

/* readability: WCAG contrast */
function lum(h){const c=[1,3,5].map(i=>{const v=parseInt(h.slice(i,i+2),16)/255;return v<=0.03928?v/12.92:((v+0.055)/1.055)**2.4});return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function ratioL(a,b){const x=[a,b].sort((p,q)=>q-p);return (x[0]+.05)/(x[1]+.05);}
function barInk(brand){const w=ratioL(lum(brand),1),k=ratioL(lum(brand),lum('#0b0b0b'));const best=w>=k?['#ffffff',w]:['#0b0b0b',k];return best[1]>=4.5?best:null;}

function offerSuggestions(g){
  const sug=FOC.filter(f=>f[0]!=='other').map(f=>({k:f[0],n:f[1],s:f[2]}));
  if(g.other)sug.push({k:'other',n:g.other,s:'Your own'});

}
function initPick(g){
  /* prefilled from sign-up focus picks, plus Open gym and 1:1 from How you work */
  if(g.areas.length) return g.areas.map(a=>({k:a.src||a.id,n:a.n,id:a.id}));
  const pre=g.focus.filter(f=>f!=='other').map(k=>{const f=FOC.find(x=>x[0]===k);return {k,n:f[1]};});
  if(g.focus.includes('other')&&g.other)pre.push({k:'other',n:g.other});

function findClass(g,id){return g.classes.find(c=>c.id===id);}
function findProd(g,id){return g.products.find(p=>p.id===id);}
function doBook(g,cid){
  (S.booked[g.key]=S.booked[g.key]||{})[S.day+'|'+cid]=1;
  const c=findClass(g,cid); const d=DAYS[S.day];
  modal({k:'done',msg:`Booked: ${esc(c.n)}, ${d[0]} ${d[1]} at ${esc(c.t)}.`,more:g.rules?esc(g.rules):''});
}
function canBook(g,c){
  /* a member's plan covers it; a new person can book only with a free starter that covers the area */
  if(S.member&&g.me)return true;
  const sp=startProd(g); return sp&&isFree(sp)&&covers(sp,c.area)&&(S.requested[g.key]||{})[sp.id];
}
function afterJoin(intent){
  const g=G(); S.joined[g.key]=1; S.member=true;
  if(!g.me)g.me={owns:[],left:'No plan yet',next:null,fresh:true};
  if(!intent){modal({k:'done',msg:`You\u2019re in. Welcome to ${esc(g.name)}.`});render();return;}
  if(intent.t==='buy')return buyFlow(g,intent.id,true);
  if(intent.t==='book'){
    const c=findClass(g,intent.id), sp=startProd(g);
    if(sp&&isFree(sp)&&covers(sp,c.area)){
      (S.requested[g.key]=S.requested[g.key]||{})[sp.id]=1; g.me.owns.push(sp.id); g.me.left=sp.n; g.me.next=`${c.n}, ${DAYS[S.day][0]} ${c.t}`;
      render(); return doBook(g,c.id);
    }
    render();
    modal({k:'done',msg:`You\u2019re signed up. To book ${esc(c.n)} you need a class pack or plan.`,more:sp?`New here? ${esc(sp.n)}, ${esc(priceTxt(sp))}.`:'',cta:sp?[`Get ${esc(sp.n)}`,'buy',sp.id]:null});
  }
}
function buyFlow(g,pid,justJoined){
  const p=findProd(g,pid);
  (S.requested[g.key]=S.requested[g.key]||{})[pid]=1;
  if(isFree(p)){ if(g.me&&!g.me.owns.includes(pid)){g.me.owns.push(pid);g.me.left=p.n;} render();
    return modal({k:'done',msg:`${justJoined?'You\u2019re signed up. ':''}${esc(p.n)} is yours.`,more:g.classes.length?'Pick a class on the schedule and tap Book.':`${esc(g.name)} will contact you to set it up.`});}
  render();
  modal({k:'done',msg:`${justJoined?'You\u2019re signed up. ':''}${esc(g.name)} has your request for ${esc(p.n)} (${esc(p.p)}${esc(p.per||'')}).`,more:`Paying online isn\u2019t on yet. They\u2019ll help you pay at the desk or by WhatsApp, and it shows here as soon as it\u2019s paid.`});
}
function k(g,key,v){
  if(key==='look')g.look=v;
  if(key==='brand')g.brand=v||null;
  if(key==='logo'){g.logo=null;g.logoLum=null;}
  if(key==='hero')g.hero=v;
  if(key==='heroPh'){g.heroPh=+v;g.focal=[50,50];g.heroSmall=null;}
  if(key==='showAddress')g.showAddress=!g.showAddress;
  if(key==='showHours')g.showHours=!g.showHours;
  if(key==='sched')g.sched=v;
  if(key==='first')g.first=v;
}

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]'); if(!el)return;
  const a=el.dataset.a, v=el.dataset.v; const g=G();

    location.hash=''; return render();}
  if(a==='gym'){S.gym=v;S.filt='all';return render();}
  if(a==='mem'){S.member=v==='1';return render();}

  /* sign-up */

  if(a==='suf'){const f=S.su.focus,i=f.indexOf(v);i>=0?f.splice(i,1):f.push(v);return render();}
  if(a==='sus'){const f=S.su.svc,i=f.indexOf(v);i>=0?f.splice(i,1):f.push(v);return render();}
  if(a==='sust'){S.su.staff=v==='1';return render();}

  if(a==='gs'){const ng=S.gyms[S.newKey];S.gym=S.newKey;
    if(v==='page'){if(ng.pageSet){S.view='settings';}else{S.view='setup';S.setup=0;S.setupPick=null;}return render();}
    if(v==='prod')return modal({k:'qprod',all:true,sel:[]});

    if(v==='share'){ng.shared=true;navigator.clipboard&&navigator.clipboard.writeText(pageUrl(ng)).catch(()=>{});toast('Link copied: zana.fit/'+slug(ng.name));return render();}
    return toast('Not part of this prototype.');}
  /* setup */
  if(a==='opick'){const pk=S.setupPick,i=pk.findIndex(p=>p.k===v);
    if(i>=0){const ex=pk[i].id&&g.areas.find(x=>x.id===pk[i].id);if(ex&&(g.classes.some(c=>c.area===ex.id)||g.products.some(p=>!isAll(p.a)&&p.a.includes(ex.id)))){return modal({k:'msg',title:`${esc(ex.n)} has classes or prices`,msg:'Untick it after moving them, or stop offering it in Settings › Tracks. Removing it here would hide them.'});}pk.splice(i,1);}

  /* knobs */
  if(a==='k'){k(g,el.dataset.k,v);return render();}
  if(a==='focal'){if(typeof g.heroPh!=='string')return toast('Tap point works on an uploaded photo. Samples stay centered.');const r=el.getBoundingClientRect();g.focal=[Math.round((ev.clientX-r.left)/r.width*100),Math.round((ev.clientY-r.top)/r.height*100)];return render();}

  if(a==='qprodok'){const n=document.getElementById('qn').value.trim()||'Plan',p=document.getElementById('qp').value.trim()||'$0',per=document.getElementById('qper').value,d=document.getElementById('qd').value.trim();
    const cov=M.all||!M.sel.length?'all':M.sel.slice();const np={id:uid('p'),n,p:/^\$?0$/.test(p)?'Free':(p[0]==='$'||/free/i.test(p)?p:'$'+p),per,d,a:cov,show:true};g.products.push(np);
    closeModal();toast(`${n} added. Star a plan as Start here in Settings › Your page if you want one for new people.`);return render();}
  if(a==='qclsok'){const n=document.getElementById('cn').value.trim()||'Class',ar=document.getElementById('ca').value,tm=document.getElementById('ct').value.trim()||'7:00 AM',cap=Math.max(1,parseInt(document.getElementById('cc').value)||12),co=document.getElementById('cco').value.trim();
    let area=ar; if(!area){if(!g.areas.length)g.areas=[{id:uid('a'),src:'general',n:'General',d:'',ph:null}];area=g.areas[0].id;}
    g.classes.push({id:uid('c'),area,t:tm,n,coach:co,left:cap,cap});closeModal();toast(`${n} added.`);return render();}
});
/* typing in knobs: update and refresh the preview without losing focus */
let typT=null;
document.addEventListener('input',ev=>{
  const el=ev.target, g=G();
  if(el.dataset.su){S.su[el.dataset.su]=el.value;const pos=el.selectionStart,key=el.dataset.su;clearTimeout(typT);typT=setTimeout(()=>{render();const x=document.querySelector(`[data-su="${key}"]`);if(x){x.focus();try{x.setSelectionRange(pos,pos);}catch(e){}}},250);return;}
  if(el.dataset.kin){const key=el.dataset.kin;
    if(key==='brand'){g.brand=el.value;clearTimeout(typT);typT=setTimeout(render,120);return;}
    g[key]=el.value; if(key==='desc'){const c=document.getElementById('desccnt');if(c){c.textContent=el.value.length+' of 400';c.className='cnt'+(el.value.length>=400?' over':'');}}
    softPreview();return;}
  if(el.dataset.ban){g.banner=g.banner||{text:'',end:''};g.banner[el.dataset.ban]=el.value;softPreview();if(el.dataset.ban==='end')render();return;}
  if(el.dataset.ain){const a=g.areas[+el.dataset.i];a[el.dataset.ain]=el.value;softPreview();return;}
  if(el.dataset.rn!=null){S.setupPick[+el.dataset.rn].n=el.value;return;}
});
function softPreview(){const sc=document.getElementById('pvscale');if(sc){sc.innerHTML=pageHtml(G(),true);}save();}
/* uploads: downsized in the browser and kept here only */
document.addEventListener('change',ev=>{
  const el=ev.target; if(!el.dataset.file||!el.files||!el.files[0])return; const f=el.files[0], g=G(), kind=el.dataset.file;
  if(!/^image\/(png|jpeg|webp)$/.test(f.type))return modal({k:'msg',title:'That file type doesn\u2019t work',msg:'Use a PNG, JPEG or WebP picture. SVG logos aren\u2019t accepted.'});
  if(kind==='logo'&&f.size>512*1024)return modal({k:'msg',title:'That logo is too big',msg:`It\u2019s ${Math.round(f.size/1024)} KB. Logos can be up to 512 KB.`});
  const rd=new FileReader(); rd.onload=()=>{const img=new Image();img.onload=()=>{
    const max=kind==='logo'?256:1600, sc=Math.min(1,max/Math.max(img.width,img.height));
    const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);const cx=cv.getContext('2d');cx.drawImage(img,0,0,cv.width,cv.height);
    if(kind==='logo'){
      const d=cx.getImageData(0,0,cv.width,cv.height).data;let r=0,gg=0,b=0,n=0;for(let i=0;i<d.length;i+=16){if(d[i+3]>128){r+=d[i];gg+=d[i+1];b+=d[i+2];n++;}}
      g.logoLum=n?lum('#'+[r,gg,b].map(x=>Math.round(x/n).toString(16).padStart(2,'0')).join('')):null; g.logo=cv.toDataURL('image/png');
    } else {
      const url=cv.toDataURL('image/jpeg',.8);
      if(kind==='hero'){g.heroPh=url;g.focal=[50,50];g.heroSmall=img.width<1200?img.width:null;if(g.hero==='none')g.hero='full';}
      if(kind==='area'){const a=g.areas[+el.dataset.i];a.ph=url;a.focal=[50,50];}
    }
    render();};img.src=rd.result;}; rd.readAsDataURL(f);
});
function pageUrl(g){return location.origin+location.pathname+'#/page/'+g.key;}

/* links: #/page/pilates, #/settings/box, #/signup, add /bare to hide the test strip */
function fromHash(){
  const m=location.hash.match(/^#\/(\w+)(?:\/([\w-]+))?/); if(!m)return;
  const v=m[1], key=m[2];
  if(VIEWS.some(x=>x[0]===v))S.view=v;
  if(key&&S.gyms[key])S.gym=key;
}
addEventListener('hashchange',()=>{fromHash();render();});
fromHash();
render();
