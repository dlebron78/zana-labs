 {id:3,title:'Kids class consent',mode:'required',at:'product',prods:['p3'],ver:1,verDate:'Feb 3, 2026',again:12,signed:10,old:0,never:2,body:'I am the parent or guardian of the child named above...',vers:[[1,'Feb 3, 2026','First version','']]},
 {id:4,title:'Personal training agreement',mode:'required',at:'product',prods:['p4','p5'],ver:2,verDate:'Aug 14, 2026',again:12,signed:6,old:2,never:0,body:'Sessions cancelled with less than 24 hours notice are charged in full...',vers:[[2,'Aug 14, 2026','Everyone signs again',''],[1,'Feb 3, 2026','First version','']]}
]};
var PEOPLE=[
 ['Ana Rivera','never','Joined Nov 4 · can’t book until she signs'],
 ['Luis Ortiz','never','Joined Nov 5 · can’t book until he signs'],
 ['María Colón','old','Signed version 2 · Mar 9, 2026'],
 ['José Vega','old','Paper waiver · recorded Jan 12, 2026'],
 ['Carmen Díaz','old','Signed version 2 · Apr 2, 2026'],
 ['Pedro Santos','old','Paper waiver · recorded Jan 12, 2026'],
 ['Sofia Méndez','old','Signed version 1 by Ana Méndez (guardian) · Jan 20, 2026'],
 ['Rafael Cruz','ok','Signed version 3 · Nov 3, 2026'],
 ['Elena Torres','ok','Signed version 3 · Nov 3, 2026'],
 ['Diego Morales','ok','Signed version 3 · Nov 4, 2026']
];
var STL={ok:['Signed','ok'],old:['Out of date','old'],never:['Never signed','no']};
function ini(n){ return n.split(' ').map(function(w){return w[0];}).join('').slice(0,2); }
function prodName(id){ return PRODUCTS.filter(function(p){return p[0]===id;})[0][1]; }
function owedText(d){ if(d.at==='join') return 'When they join'; return d.prods.length===1?prodName(d.prods[0]):'On '+d.prods.length+' products'; }
function owedCount(d){ if(d.at==='join') return CLIENTS; var n=0; d.prods.forEach(function(id){ n+=PRODUCTS.filter(function(p){return p[0]===id;})[0][2]; }); return n; }
function modeTag(m){ return '<span class="mode '+(m==='required'?'req':'')+'">'+(m==='required'?'Required':'Optional')+'</span>'; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
var CASES={
 list:'<b>Settings › Documents.</b> The gym’s own legal texts. The numbers are what the owner chases: <b>Out of date</b> (signed an older version, or a paper waiver; never blocked) and <b>Never signed</b> (a Required one: can’t book until they sign).',
 empty:'<b>A new gym, from Get started.</b> No templates on purpose (Zana never promises legal cover). Paste your own.',
 wizard:'<b>New document.</b> 1 title and text · 2 Required or Optional · 3 when it’s owed · 4 who signs now (Required only), with the real count · 5 check: sign again every N months is the one optional setting.',
 page:'<b>A document’s page.</b> Facts on top, then the people who owe it (chips filter), the text, and its versions. Send link and Record paper signature live on each person.',
 edit:'<b>Edit text makes version 4.</b> The old words are kept forever. Choose who signs again; an out-of-date signature never blocks, so nobody is turned away either way.'
};
function setStart(v){ S.start=v; S.step=0; S.d=null; S.open=null; S.edit=null; S.sheet=null;
  if(v==='empty'){ S.saved=S.docs; S.docs=[]; } else if(S.saved){ S.docs=S.saved; S.saved=null; }
  if(v==='wizard'){ newDoc(); } if(v==='page'){ S.open=1; } if(v==='edit'){ S.open=1; openEdit(); } render(); }
function newDoc(){ S.step=1; S.d={title:'',body:'',mode:null,at:null,prods:[],who:'new',again:null}; }
function openEdit(){ var d=S.docs.filter(function(x){return x.id===S.open;})[0]; S.edit={body:d.body,who:'new'}; }
function header(t,btn){ return '<div class="titlerow"><h1>Settings</h1>'+(btn||'')+'</div><div class="tabs"><span>Business</span><span>Look</span><span>Payments</span><span class="on">Documents</span><span>Tracks</span><span>Tax</span></div>'; }
function list(){
  if(!S.docs.length) return header('Documents')+'<div class="empty"><h2>No documents yet</h2><p>Your waiver, a photo consent, a kids form. Write your own or paste the text you use today. Zana adds nothing to it.</p><button class="btn main" data-a="new" style="height:40px;margin-top:6px">New document</button></div>';
  var h=header('Documents','<button class="btn main" data-a="new">New document</button>');
  h+='<div class="card"><table class="pt"><thead><tr><th>Document</th><th>Owed</th><th class="r">Version</th><th class="r">Signed</th><th class="r">Out of date</th><th class="r">Never signed</th></tr></thead><tbody>';
  S.docs.forEach(function(d){ var opt=d.mode==='optional';
    h+='<tr data-a="open" data-id="'+d.id+'"><td><div class="pn"><span>'+esc(d.title)+'</span> '+modeTag(d.mode)+'</div></td><td class="tr">'+owedText(d)+'</td><td class="r num">'+d.ver+'</td>'+
    '<td class="r num">'+d.signed+(opt?' <span class="mut">· '+d.no+' no</span>':'')+'</td><td class="r num">'+(d.old?'<span class="st old">'+d.old+'</span>':'<span class="mut">0</span>')+'</td><td class="r num">'+(d.never?(opt?'<span class="mut">'+d.never+'</span>':'<span class="st no">'+d.never+'</span>'):'<span class="mut">0</span>')+'</td></tr>'; });
  h+='</tbody></table><div class="mrows">';
  S.docs.forEach(function(d){ var bits=[]; if(d.never&&d.mode==='required') bits.push('<span class="st no">'+d.never+' never signed</span>'); if(d.old) bits.push('<span class="st old">'+d.old+' out of date</span>'); if(!bits.length) bits.push('<span class="mut">'+d.signed+' signed</span>');
    h+='<div class="prow" data-a="open" data-id="'+d.id+'"><div class="tx"><div class="nm">'+esc(d.title)+' '+modeTag(d.mode)+'</div><div class="why">'+owedText(d)+' · '+bits.join(' · ')+'</div></div><span class="chev">›</span></div>'; });
  h+='</div></div><p class="mut" style="font-size:13px;margin-top:12px">Optional documents block nothing; unanswered ones show in grey.</p>';
  return h;
}
function page(){
  var d=S.docs.filter(function(x){return x.id===S.open;})[0]; var opt=d.mode==='optional';
  var h='<div class="lab"><a href="#" data-a="back" style="color:inherit">Settings › Documents</a></div><div class="titlerow"><h1>'+esc(d.title)+'</h1><button class="btn main" data-a="edit">Edit text</button></div>';
  h+='<div class="facts">'+
   '<div><div class="k">Mode</div><div class="v">'+(opt?'Optional':'Required')+'</div><div class="s">'+(opt?'A yes or no, blocks nothing':'Accepted before they book')+'</div><button class="btn">Change</button></div>'+
   '<div><div class="k">Owed</div><div class="v">'+owedText(d)+'</div><div class="s">'+owedCount(d)+' people owe it</div><button class="btn">Change</button></div>'+
   '<div><div class="k">Version</div><div class="v">'+d.ver+'</div><div class="s">'+d.verDate+'</div></div>'+
   '<div><div class="k">Sign again</div><div class="v">'+(d.again?'Every '+d.again+' months':'Never')+'</div><div class="s">'+(d.again?'From each person’s last signature':'Off')+'</div><button class="btn">Change</button></div></div>';
  var counts={old:d.old,never:d.never,ok:d.signed};
  var rows=PEOPLE.filter(function(p){return p[1]===S.chip;});
  h+='<div class="sect"><div class="lab2"><span>Who owes it</span>'+(S.chip!=='ok'&&counts[S.chip]?'<button class="btn" data-a="emailall" style="height:34px;font-size:14px;text-transform:none;letter-spacing:0">Email all '+counts[S.chip]+'</button>':'')+'</div>'+
   '<div class="chips" style="margin-bottom:12px"><button class="chip '+(S.chip==='never'?'on':'')+'" data-a="chip" data-v="never">Never signed <span>'+d.never+'</span></button><button class="chip '+(S.chip==='old'?'on':'')+'" data-a="chip" data-v="old">Out of date <span>'+d.old+'</span></button><button class="chip '+(S.chip==='ok'?'on':'')+'" data-a="chip" data-v="ok">Signed <span>'+d.signed+'</span></button><input type="text" class="search" placeholder="Search people" style="margin-left:auto"></div><div class="card">';
  rows.forEach(function(p){ var s=STL[p[1]];
    h+='<div class="prow" data-a="person" data-n="'+p[0]+'"><span class="ini">'+ini(p[0])+'</span><div class="tx"><div class="nm">'+p[0]+'</div><div class="when">'+p[2]+'</div><span class="st mob '+s[1]+'">'+s[0]+'</span></div><span class="st desk '+s[1]+'">'+s[0]+'</span>'+(p[1]!=='ok'?'<button class="btn" data-a="send" data-n="'+p[0]+'">Send link</button>':'')+'<span class="chev">›</span></div>'; });
  h+='</div>'+(counts[S.chip]>rows.length?'<p class="mut" style="font-size:13px;text-align:center">Showing '+rows.length+' of '+counts[S.chip]+'</p>':'')+'</div>';
  h+='<div class="sect"><div class="lab2"><span>The text · version '+d.ver+'</span><button class="btn" style="height:34px;font-size:14px;text-transform:none;letter-spacing:0">Show all</button></div><div class="text">'+esc(d.body)+'</div></div>';
  h+='<div class="sect"><div class="lab2"><span>Versions</span></div><div class="card">';
  d.vers.forEach(function(v,i){ h+='<div class="ver"><span class="n num">'+v[0]+'</span><div class="tx"><div>'+v[1]+'</div><div class="when">'+v[2]+'</div></div>'+(i===0?'<span class="st ok">Current</span>':'')+'<button class="btn" style="height:34px;font-size:14px">View text</button></div>'; });
  h+='</div><p class="mut" style="font-size:13px;margin-top:10px">Old versions are never changed. Each signature stays tied to the exact words it accepted.</p></div>';
  return h;
}
function choice(a,v,on,t,d,sm){ return '<button class="choice '+(on?'on':'')+'" data-a="'+a+'" data-v="'+v+'"><span class="radio"></span><span style="flex:1"><b>'+t+'</b><span>'+d+'</span>'+(sm?'<small>'+sm+'</small>':'')+'</span></button>'; }
function steps(){ return S.d.mode==='optional'?[1,2,3,5]:[1,2,3,4,5]; }
function wizard(){
  var d=S.d, st=S.step, h='<div class="ph">'+(st>1?'<button class="ib" data-a="prev" aria-label="Back">‹</button>':'')+'<h3>New document</h3><button class="ib" data-a="close" aria-label="Close">✕</button></div><div class="pb">', ok=false, cta='Next';
  if(st===1){ h+='<p class="q">Title and text</p><div class="fld"><label>Title</label><input type="text" data-f="title" value="'+esc(d.title)+'" placeholder="Liability waiver"></div>'+
    '<div class="fld"><label>Text</label><textarea data-f="body" placeholder="Paste or write the text people will accept.">'+esc(d.body)+'</textarea><div class="hint">Write your own or paste from your lawyer. Zana adds nothing to it. A bilingual gym writes both languages here.</div></div>';
    if(!d.body) h+='<button class="btn" data-a="paste" style="align-self:flex-start">Paste sample (prototype only)</button>';
    ok=d.title.trim()&&d.body.trim(); }
  if(st===2){ h+='<p class="q">Do they have to accept it?</p>'+choice('mode','required',d.mode==='required','Required','They accept it before they can book or buy.','A liability waiver, a kids consent')+choice('mode','optional',d.mode==='optional','Optional','They answer yes or no. Nothing is blocked.','A photo consent'); ok=!!d.mode; }
  if(st===3){ h+='<p class="q">When do they owe it?</p>'+choice('at','join',d.at==='join','When they join','Every client, from the day they join.',CLIENTS+' people today')+choice('at','product',d.at==='product','When they buy certain products','Each person the product is for. A parent signs for a child.');
    if(d.at==='product'){ h+='<div class="checks">'; PRODUCTS.forEach(function(p){ var on=d.prods.indexOf(p[0])>=0; h+='<button class="ck '+(on?'on':'')+'" data-a="prod" data-v="'+p[0]+'"><span class="box">'+(on?'✓':'')+'</span>'+p[1]+'<small>'+p[2]+' hold it</small></button>'; }); h+='</div>'; }
    ok=d.at==='join'||(d.at==='product'&&d.prods.length>0); }
  if(st===4){ var n=owedCount(d); h+='<p class="q">What about the '+n+' people who '+(d.at==='join'?'are already here':'already hold '+(d.prods.length===1?'it':'these'))+'?</p>'+
    choice('who','new',d.who==='new','New members only','They keep booking. They show as Out of date until they sign.','Recommended. Nobody is turned away at 6am on Monday.')+
    choice('who','all',d.who==='all','Everyone signs','They can’t book until they sign. We email each of them a link.');
    h+=d.who==='all'?'<div class="consq warn"><b>'+n+' people can’t book until they sign.</b> Bookings they already made are kept. The desk can record a paper signature.</div>':'<div class="consq">Anyone who joins after you save signs before their first booking.</div>'; ok=true; }
  if(st===5){ var t=d.title||'document'; cta='Create '+t;
    h+='<div class="hero"><div class="kl">'+(d.mode==='required'?'Required':'Optional')+'</div><div class="t">'+esc(t)+'</div><div class="sumtext" style="margin-top:8px">'+esc(d.body)+'</div></div>'+
    '<div class="sum"><div><span class="k">Owed</span><span class="v">'+(d.at==='join'?'When they join':d.prods.map(prodName).join(', '))+'</span></div>'+(d.mode==='required'?'<div><span class="k">Who signs</span><span class="v">'+(d.who==='new'?'New members only. '+owedCount(d)+' already here show Out of date.':'Everyone. '+owedCount(d)+' people are emailed and can’t book until they sign.')+'</span></div>':'')+'</div>'+
    '<div class="lab2">Optional</div><div class="sw2" style="border-top:0;padding-top:0"><div><b>Sign again every '+(d.again||12)+' months</b><span>Counted from each person’s last signature. Off by default.</span></div><button class="tog '+(d.again?'on':'')+'" data-a="again" aria-label="Sign again"></button></div>';
    if(d.again) h+='<div class="cnt"><button data-a="agn" data-v="-1">−</button><span>'+d.again+'</span><button data-a="agn" data-v="1">+</button></div>';
    ok=true; }
  h+='</div><div class="pf"><button class="btn main" data-a="next" '+(ok?'':'disabled')+'>'+esc(cta)+'</button></div>';
  return h;
}
function editPanel(){
  var d=S.docs.filter(function(x){return x.id===S.open;})[0], e=S.edit, ch=e.body!==d.body;
  var h='<div class="ph"><h3>Edit text</h3><button class="ib" data-a="close" aria-label="Close">✕</button></div><div class="pb">';
  h+='<div class="fld"><label>Text · becomes version '+(d.ver+1)+'</label><textarea data-f="ebody" style="min-height:220px">'+esc(e.body)+'</textarea><div class="hint">Version '+d.ver+' is kept unchanged, with every signature on it.</div></div>';
  h+='<p class="q">Who signs version '+(d.ver+1)+'?</p>'+choice('ewho','new',e.who==='new','New signers only','The '+d.signed+' who signed version '+d.ver+' stay Signed.','For a typo or a small fix.')+choice('ewho','all',e.who==='all','Everyone signs again','The '+d.signed+' who signed show Out of date and get an email with the link.','For a change people should read. Nobody is turned away: an out-of-date signature never blocks a booking.');
  h+='</div><div class="pf"><button class="btn main" data-a="esave" '+(ch?'':'disabled')+'>Save version '+(d.ver+1)+'</button>'+(ch?'':'<div class="why">Change the text to save a new version. A title change is not a new version.</div>')+'</div>';
  return h;
}
function personPanel(){
  var p=PEOPLE.filter(function(x){return x[0]===S.sheet;})[0], s=STL[p[1]], d=S.docs.filter(function(x){return x.id===S.open;})[0];
  var h='<div class="ph"><h3>'+p[0]+'</h3><button class="ib" data-a="close" aria-label="Close">✕</button></div><div class="pb">';
  h+='<div class="hero"><div class="kl">'+esc(d.title)+'</div><div class="st '+s[1]+'" style="font-size:15px;margin-top:4px">'+s[0]+'</div><div class="p" style="font-size:14px">'+p[2]+'</div></div>';
  if(p[1]!=='ok') h+='<p class="q">Get it signed</p><div class="srows"><button class="srow" data-a="send" data-n="'+p[0]+'"><span class="k" style="width:auto;flex:1">Send link</span><span class="v" style="flex:none">By email</span><span class="chev">›</span></button><button class="srow" data-a="sign"><span class="k" style="width:auto;flex:1">Sign on this device</span><span class="v" style="flex:none">Hand it over</span><span class="chev">›</span></button><button class="srow" data-a="paper"><span class="k" style="width:auto;flex:1">Record paper signature</span><span class="v" style="flex:none">They signed on paper</span><span class="chev">›</span></button></div>';
  h+='<p class="q">History</p><div class="sum"><div><span class="k">Nov 2</span><span class="v">Version 3 made. Everyone signs again.</span></div><div><span class="k">Mar 9</span><span class="v">Signed version 2 on her phone.</span></div><div><span class="k">Jan 12</span><span class="v">Paper waiver recorded by Rosa (desk).</span></div></div>';
  return h+'</div>';
}
function render(){
  var panelOpen=S.step||S.edit||S.sheet;
  document.body.className=(S.wid==='phone'?'phone ':'')+(panelOpen?'open':'');
  var g1=[['list','List'],['empty','Empty'],['wizard','New document'],['page','Document page'],['edit','Edit text']];
  document.getElementById('g1').innerHTML=g1.map(function(x){return '<button data-a="start" data-v="'+x[0]+'" aria-pressed="'+(S.start===x[0])+'">'+x[1]+'</button>';}).join('');
  document.getElementById('g2').innerHTML=[['desk','Laptop'],['phone','Phone']].map(function(x){return '<button data-a="wid" data-v="'+x[0]+'" aria-pressed="'+(S.wid===x[0])+'">'+x[1]+'</button>';}).join('');
  document.getElementById('case').innerHTML=CASES[S.step?'wizard':S.edit?'edit':S.open?'page':(S.docs.length?'list':'empty')];
  document.getElementById('main').innerHTML=S.open?page():list();
  var tb=document.querySelector('.tabs'), on=tb&&tb.querySelector('.on'); if(on) tb.scrollLeft=Math.max(0,on.offsetLeft-tb.offsetLeft-16);
  document.getElementById('panel').innerHTML=S.step?wizard():S.edit?editPanel():S.sheet?personPanel():'';
  var old=document.querySelector('.undo'); if(old) old.remove();
  if(S.toast){ var t=document.createElement('div'); t.className='undo'; t.innerHTML='<span>'+S.toast+'</span><button data-a="untoast">Undo</button>'; document.body.appendChild(t); }
}
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-a]'); if(!el) return; var a=el.dataset.a, v=el.dataset.v; ev.preventDefault(); ev.stopPropagation();
  if(a!=='untoast') S.toast=null;
  if(a==='start') return setStart(v);
  if(a==='wid') S.wid=v;
  if(a==='new') newDoc();
  if(a==='open'){ S.open=+el.dataset.id; S.chip='old'; }
  if(a==='back') S.open=null;
  if(a==='close'){ S.step=0; S.edit=null; S.sheet=null; }
  if(a==='paste'){ S.d.title=S.d.title||'Liability waiver'; S.d.body=WAIVER; }
  if(a==='mode'){ S.d.mode=v; }
  if(a==='at'){ S.d.at=v; }
  if(a==='prod'){ var i=S.d.prods.indexOf(v); if(i>=0) S.d.prods.splice(i,1); else S.d.prods.push(v); }
  if(a==='who') S.d.who=v;
  if(a==='again') S.d.again=S.d.again?null:12;
  if(a==='agn') S.d.again=Math.max(1,Math.min(60,S.d.again+(+v)));
  if(a==='prev'){ var s=steps(); S.step=s[s.indexOf(S.step)-1]; }
  if(a==='next'){ var s2=steps(), i2=s2.indexOf(S.step); if(i2<s2.length-1) S.step=s2[i2+1]; else { var d=S.d, n=owedCount(d); S.docs.push({id:Date.now(),title:d.title,mode:d.mode,at:d.at,prods:d.prods,ver:1,verDate:'Nov 6, 2026',again:d.again,signed:0,no:0,old:d.mode==='required'&&d.who==='new'?n:0,never:d.mode==='optional'||d.who==='all'?n:0,body:d.body,vers:[[1,'Nov 6, 2026','First version','']]}); S.step=0; S.d=null; S.start='list'; S.toast='Created '+esc(d.title)+'.'; } }
  if(a==='edit') openEdit();
  if(a==='ewho') S.edit.who=v;
  if(a==='esave'){ var dd=S.docs.filter(function(x){return x.id===S.open;})[0]; dd.vers.unshift([dd.ver+1,'Nov 6, 2026',S.edit.who==='all'?'Everyone signs again':'New signers only','']); dd.ver++; dd.verDate='Nov 6, 2026'; dd.body=S.edit.body; if(S.edit.who==='all'){ dd.old+=dd.signed; dd.signed=0; } S.toast='Saved version '+dd.ver+'.'+(S.edit.who==='all'?' '+dd.old+' people emailed.':''); S.edit=null; }
  if(a==='chip') S.chip=v;
  if(a==='person') S.sheet=el.dataset.n;
  if(a==='send'){ S.toast='Link sent to '+el.dataset.n+'.'; S.sheet=null; }
  if(a==='emailall'){ S.toast='Link emailed to everyone in this list.'; }
  if(a==='paper'){ S.toast='Paper signature recorded for '+S.sheet+'.'; S.sheet=null; }
  if(a==='sign'){ S.toast='Signing opens on this device (the Collect waiver card).'; S.sheet=null; }
  if(a==='untoast') S.toast=null;
  render();
});
document.addEventListener('input',function(ev){ var f=ev.target.dataset.f; if(!f) return;
  if(f==='ebody'){ S.edit.body=ev.target.value; var b=document.querySelector('[data-a=esave]'), d=S.docs.filter(function(x){return x.id===S.open;})[0]; if(b){ b.disabled=S.edit.body===d.body; } return; }
  S.d[f]=ev.target.value; var nb=document.querySelector('[data-a=next]'); if(nb) nb.disabled=!(S.d.title.trim()&&S.d.body.trim()); });
render();
</script>
