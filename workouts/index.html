<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var LOGS=[
 {k:'sets',w:'each set',t:'weight',h:'weight × reps, set by set'},
 {k:'time',w:'time',t:'time',h:'one finish time'},
 {k:'rounds',w:'rounds',t:'rounds',h:'rounds + reps'},
 {k:'weight',w:'weight',t:'weight',h:'one number'},
 {k:'done',w:'done',t:null,h:'a tick'},
 {k:'none',w:'nothing',t:null,h:'members just read it'}];
var KEYS=['log','target','scaled','time'];
var EX={
 CrossFit:'Warm-up\n3 rounds, easy pace:\n200 m run, 10 air squats, 10 ring rows\nlog: done\ntime: 10\n\nBack squat\n5-5-5-5-5 @ 70-80%\nRest 2 min between sets\nlog: each set\ntarget: 80%\ntime: 20\n\nFran\n21-15-9 for time\nThrusters 95/65\nPull-ups\nlog: time\ntarget: 6:00\nscaled: 65/45, banded pull-ups\ntime: 12',
 Bodybuilding:'Bench press\n4 x 6-8, leave 1-2 reps in the tank\nRest 2:30\nlog: each set\ntarget: 185 lb\ntime: 18\n\nIncline dumbbell press\n3 x 10-12, 2-second pause at the bottom\nlog: each set\nscaled: Machine chest press 3 x 12\ntime: 12\n\nCable fly + triceps pushdown\nSuperset, 3 x 15 each\nlog: done\ntime: 10',
 Yoga:'Arrival\nSeated, slow nasal breathing, 4 counts in, 6 out\ntime: 5\n\nSun salutations\nSurya Namaskar A x 5, then B x 3\nOne breath, one movement\nlog: done\nscaled: Knees down in chaturanga, step back instead of jumping\ntime: 15\n\nCrow pose\nThree attempts, hold as long as you stay steady\nlog: time\ntarget: 0:30\nscaled: Toes on a block, lift one foot at a time\ntime: 8\n\nSavasana\nLie back. Nothing to do.\ntime: 7',
 Blank:''};
var TITLES={CrossFit:'CrossFit · all classes',Bodybuilding:'Push day · chest and triceps',Yoga:'Vinyasa flow · 60 min',Blank:'New day'};
var S={status:'draft',tab:'write',more:false,pick:null,confirm:false};
var ta=$('text'),bar=$('bar');
var narrow=function(){return window.matchMedia('(max-width:759px)').matches;};
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}

/* ---------- reading the text ---------- */
function logOf(v){v=(v||'').toLowerCase().trim();
 if(!v)return null;
 if(/set/.test(v))return 'sets';if(/round|amrap/.test(v))return 'rounds';if(/time|clock/.test(v))return 'time';
 if(/weight|load|heav/.test(v))return 'weight';if(/done|tick|check|yes/.test(v))return 'done';if(/noth|none|^no$/.test(v))return 'none';return '?';}
function L(k){for(var i=0;i<LOGS.length;i++)if(LOGS[i].k===k)return LOGS[i];return LOGS[5];}
function blocks(t){var out=[],lines=t.split('\n'),cur=null;
 lines.forEach(function(l,n){if(!l.trim()){cur=null;return;}if(!cur){cur={start:n,end:n,lines:[]};out.push(cur);}cur.lines.push(l);cur.end=n;});return out;}
function parse(t){return blocks(t).map(function(b){
  var p={name:b.lines[0].trim(),desc:[],log:null,logRaw:'',target:'',scaled:[],time:'',warn:[],start:b.start,end:b.end};var inS=false;
  b.lines.slice(1).forEach(function(l){var m=l.match(/^\s*(log|target|scaled|time)\s*:\s*(.*)$/i);
   if(!m){(inS?p.scaled:p.desc).push(l);return;}
   var k=m[1].toLowerCase(),v=m[2].trim();inS=(k==='scaled');
   if(k==='log'){p.logRaw=v;p.log=logOf(v);}else if(k==='target')p.target=v;else if(k==='scaled'){if(v)p.scaled.push(v);}else p.time=v;});
  p.desc=p.desc.join('\n').trim();p.scaled=p.scaled.join('\n').trim();
  if(p.log==='?'){p.warn.push('“log: '+p.logRaw+'” isn’t one of the choices. Tap the button below to pick one.');p.log=null;}
  var kind=p.log?L(p.log).t:null;
  if(p.target){
   if(!p.log)p.warn.push('There’s a target but no log: line, so members have nothing to compare it with.');
   else if(!kind)p.warn.push('Members log '+L(p.log).w+', so a target can’t be checked. Remove it or change the log.');
   else if(kind==='time'&&!/^\d{1,2}:\d{2}$/.test(p.target))p.warn.push('Write the target as minutes:seconds, e.g. 6:00.');
   else if(kind==='rounds'&&!/^\d+/.test(p.target))p.warn.push('Write the target as a number of rounds, e.g. 5.');
   else if(kind==='weight'&&!/^\d+(\.\d+)?\s*(lb|lbs|kg|%)$/i.test(p.target))p.warn.push('Write the target as a weight with its unit: 185 lb, 80 kg or 80%.');}
  if(p.time&&!/^\d{1,3}$/.test(p.time.replace(/\s*min.*$/i,'')))p.warn.push('Write time as minutes, e.g. time: 12');
  return p;});}
function fmtTarget(p){var k=p.log?L(p.log).t:null;if(!p.target||!k)return '';
 if(k==='time')return 'Target: under '+p.target;
 if(k==='rounds')return 'Target: at least '+parseInt(p.target,10)+' rounds';
 var m=p.target.match(/^([\d.]+)\s*(lb|lbs|kg|%)$/i);if(!m)return '';
 return m[2]==='%'?'Target: '+m[1]+'% of your max':'Target: '+m[1]+' '+m[2].toLowerCase().replace('lbs','lb');}
function mins(p){var n=parseInt(p.time,10);return n>0?n:0;}


/* ---------- movements (a small sample of the exercise library) ---------- */
var MOVES=[
 ['Back squat',['back squat','back squats']],['Front squat',['front squat','front squats']],['Goblet squat',['goblet squat','goblet squats']],['Air squat',['air squat','air squats']],
 ['Deadlift',['deadlift','deadlifts']],['Bench press',['bench press']],['Incline dumbbell press',['incline dumbbell press','incline db press']],['Chest press',['chest press']],
 ['Overhead press',['overhead press','strict press']],['Push press',['push press']],['Thruster',['thruster','thrusters']],['Clean',['power clean','squat clean','clean']],['Snatch',['snatch']],
 ['Pull-up',['pull-up','pull-ups','pullup','pullups','pull up','pull ups']],['Ring row',['ring row','ring rows']],['Push-up',['push-up','push-ups','pushup','pushups']],
 ['Burpee',['burpee','burpees','burpee box jump']],['Kettlebell swing',['kettlebell swing','kettlebell swings','kb swings','swings','russian swing','russian swings']],
 ['Box jump',['box jump','box jumps']],['Wall ball',['wall ball','wall balls']],['Double-under',['double-under','double-unders','double under','double unders']],
 ['Toes-to-bar',['toes-to-bar','toes to bar','t2b']],['Lunge',['lunge','lunges']],['Inchworm',['inchworm','inchworms']],['Run',['run','running']],['Row',['row','rowing']],
 ['Cable fly',['cable fly','cable flies']],['Triceps pushdown',['triceps pushdown','tricep pushdown']],['Lateral raise',['lateral raise','lateral raises']],
 ['Hanging knee raise',['hanging knee raise','hanging knee raises']],['Plank',['plank']],
 ['Sun salutation A',['surya namaskar a','sun salutation a']],['Sun salutation B',['surya namaskar b','sun salutation b']],['Chaturanga',['chaturanga']],
 ['Warrior II',['warrior ii','warrior 2']],['Reverse warrior',['reverse warrior']],['Extended side angle',['extended side angle']],['Half moon',['half moon']],
 ['Crow pose',['crow pose','bakasana','crow']],['Savasana',['savasana']]];
var ALIASES=[];MOVES.forEach(function(m){m[1].forEach(function(a){ALIASES.push([a,m[0]]);});});
ALIASES.sort(function(x,y){return y[0].length-x[0].length;});
function movesIn(text){var t=' '+text.toLowerCase().replace(/[^a-z0-9\- ]+/g,' ')+' ',found=[];
 ALIASES.forEach(function(a){var re=new RegExp('(^|[^a-z0-9-])'+a[0].replace(/[-]/g,'\\-')+'(?=[^a-z0-9-]|$)');var m=t.match(re);
  if(m){t=t.replace(re,function(x,pre){return pre+' '.repeat(a[0].length);});if(found.indexOf(a[1])<0)found.push(a[1]);}});
 return found;}
/* ---------- members' cards ---------- */
function card(p,i){var t=fmtTarget(p),lg=p.log?L(p.log):null;
 return '<article class="card"><div class="ch"><span class="ix">'+String.fromCharCode(65+i%26)+'</span><b>'+esc(p.name)+'</b>'+(mins(p)?'<span class="mins">'+mins(p)+' min</span>':'')+'</div>'+
  (p.desc?'<p class="desc">'+esc(p.desc)+'</p>':'')+
  (function(){var mv=movesIn(p.name+'\n'+p.desc);return mv.length?'<div class="mv"><span class="mvl">Movements</span><span class="mvs">'+mv.map(esc).join(' · ')+'</span></div>':'';})()+
  (p.scaled?'<div class="scl"><span>Scaled</span>'+esc(p.scaled)+'</div>':'')+
  '<div class="cf"><label class="logsel"><span>Members log</span><select data-logi="'+i+'" aria-label="How members log '+esc(p.name)+'">'+(lg?'':'<option value="" selected>not set</option>')+LOGS.map(function(o){return '<option value="'+o.k+'"'+(p.log===o.k?' selected':'')+'>'+o.w+'</option>';}).join('')+'</select></label>'+(t?'<span class="tgt"><span aria-hidden="true">◎</span> '+esc(t)+'</span>':'')+'</div>'+
  p.warn.map(function(w){return '<div class="warn">'+esc(w)+'</div>';}).join('')+'</article>';}
function renderCheck(){var ps=parse(ta.value);
 $('check').innerHTML=ps.length?ps.map(card).join(''):'<div class="empty">Start writing on the left. Each part you write shows up here as members will see it.</div>';
 $('tc').textContent='Members see ('+ps.length+')';
 var m=ps.reduce(function(a,p){return a+mins(p);},0),w=ps.filter(function(p){return p.warn.length;}).length;
 $('sum').textContent=ps.length+' part'+(ps.length===1?'':'s')+(m?' · '+m+' min':'')+(w?' · '+w+' to fix':'');$('sum2').textContent=$('sum').textContent;
 return ps;}

/* ---------- the help bar ---------- */
function caretInfo(){var v=ta.value,pos=ta.selectionStart,ls=v.lastIndexOf('\n',pos-1)+1,le=v.indexOf('\n',pos);if(le<0)le=v.length;
 return {pos:pos,ls:ls,le:le,pre:v.slice(ls,pos),line:v.slice(ls,le)};}
function partAt(pos){var row=ta.value.slice(0,pos).split('\n').length-1,ps=parse(ta.value);
 for(var i=0;i<ps.length;i++)if(row>=ps[i].start&&row<=ps[i].end+1)return ps[i];return null;}
function chip(cls,data,label){var c=cls==='sug'?'sug key':cls==='part'?'':cls==='ghost'?'':'key';return '<button class="btn sm '+c+'" '+data+'>'+label+'</button>';}
function renderBar(){var c=caretInfo(),pre=document.activeElement===ta?c.pre:'@',h='',m;
 if((m=pre.match(/^\s*log:\s*([a-z ]*)$/i))){var q=m[1].trim().toLowerCase();
  var gp=partAt(c.pos),gg=!q&&gp?guessLog(gp):null,done=LOGS.some(function(o){return o.w===q;});if(!done)LOGS.filter(function(o){return !q||o.w.indexOf(q)===0;}).forEach(function(o){h+=chip(gg&&o.k!==gg?'':'sug','data-log="'+o.w+'"',o.w);});
  if(!h&&!done)h='<span class="bhint">Pick one: each set, time, rounds, weight, done, nothing</span>';}
 else if((m=pre.match(/^\s*target:\s*([\d.:]*)\s*$/i))){var p=partAt(c.pos),k=p&&p.log?L(p.log).t:null,val=m[1];
  if(!p||!p.log)h='<span class="bhint">Add a log: line first, so the target has a unit</span>';
  else if(!k)h='<span class="bhint">Members log '+L(p.log).w+', so there’s nothing to aim for</span>';
  else if(k==='time')h='<span class="bhint">Finish time to beat, e.g. 6:00</span>';
  else if(k==='rounds')h='<span class="bhint">Rounds to reach, e.g. 5</span>';
  else if(val&&/^\d/.test(val))h=['lb','kg','%'].map(function(u){return chip('sug','data-unit="'+u+'"',u==='%'?'% of max':u);}).join('');
  else h='<span class="bhint">A weight, then lb, kg or %</span>';}
 else if((m=pre.match(/^\s*time:\s*(\d*)\s*$/i))){h=m[1]?'':['5','10','15','20'].map(function(n){return chip('sug','data-min="'+n+'"',n+' min');}).join('');}
 else if((m=pre.match(/^\s*([a-z]{1,6})$/i))&&c.pre.length===c.line.length&&c.ls!==blockStart(c.pos)){var q2=m[1].toLowerCase();
  KEYS.filter(function(k){return k.indexOf(q2)===0&&k!==q2+':';}).forEach(function(k){h+=chip('sug','data-key="'+k+'"',k+':');});}
 S.hasSug=/btn sm sug/.test(h);
 if(!h){h=chip('part','data-act="part"','+ Part');
  if(!S.more)h+=chip('','data-key="log"','log:')+chip('','data-key="target"','target:')+chip('ghost','data-act="more"','more…');
  else h+=chip('','data-key="scaled"','scaled:')+chip('','data-key="time"','time:')+chip('ghost','data-act="less"','‹ back');}
 bar.innerHTML=h;}
function blockStart(pos){var v=ta.value,i=pos;while(true){var p=v.lastIndexOf('\n',i-1);if(p<0)return 0;var prevStart=v.lastIndexOf('\n',p-1)+1;if(!v.slice(prevStart,p).trim())return p+1;i=prevStart;if(i<=0)return 0;}}

/* ---------- editing helpers ---------- */
function setText(v,a,b){ta.value=v;ta.focus();try{ta.setSelectionRange(a,b==null?a:b);}catch(e){}changed();}
function replaceLine(c,newLine,caretAtEnd){var v=ta.value;setText(v.slice(0,c.ls)+newLine+v.slice(c.le),c.ls+newLine.length);}
function ensureKey(key){var v=ta.value,pos=ta.selectionStart,lines=v.split('\n'),row=v.slice(0,pos).split('\n').length-1;
 if(!v.trim()){setText(key+': ',key.length+2);return;}
 var s=row,e=row;if(!lines[row].trim()){s=e=row-1;while(s>=0&&!lines[s].trim())s--;e=s;}
 if(s<0){setText(v+(v.endsWith('\n')?'':'\n')+key+': ',(v+(v.endsWith('\n')?'':'\n')+key+': ').length);return;}
 while(s>0&&lines[s-1].trim())s--;while(e<lines.length-1&&lines[e+1].trim())e++;
 var re=new RegExp('^\\s*'+key+'\\s*:','i');
 for(var i=s;i<=e;i++)if(re.test(lines[i])){var off=lines.slice(0,i).join('\n').length+(i?1:0),c0=off+lines[i].indexOf(':')+1;
   lines[i]=key+': '+lines[i].slice(lines[i].indexOf(':')+1).trim();var st=off+key.length+2;setText(lines.join('\n'),st,off+lines[i].length);return;}
 lines.splice(e+1,0,key+': ');var at=lines.slice(0,e+1).join('\n').length+1+key.length+2;setText(lines.join('\n'),at);}
function newPart(){var v=ta.value.replace(/\s+$/,'');var nv=v+(v?'\n\n':'');setText(nv,nv.length);}
function setLogFor(i,k){var ps=parse(ta.value),p=ps[i];if(!p)return;var lines=ta.value.split('\n'),w=L(k).w;
 for(var r=p.start;r<=p.end;r++)if(/^\s*log\s*:/i.test(lines[r])){lines[r]='log: '+w;ta.value=lines.join('\n');S.pick=null;changed();labs.track('log_set',{via:'members_see_menu',log:k});return;}
 lines.splice(p.end+1,0,'log: '+w);ta.value=lines.join('\n');S.pick=null;changed();labs.track('log_set',{via:'members_see_menu',log:k});}

/* ---------- events ---------- */
function grow(){if(document.body.classList.contains('focus')){ta.style.height='';return;}ta.style.height='auto';ta.style.height=(ta.scrollHeight+4)+'px';}
function changed(){grow();renderCheck();renderBar();if(S.loading)return;if(S.status==='ready'){S.status='draft';labs.track('day_edited');footer();}saveDay();}
var saveT=null;ta.addEventListener('input',function(){hideConfirm();changed();clearTimeout(saveT);saveT=setTimeout(function(){S.saved=savedAt();footer();},700);});
['keyup','click','focus'].forEach(function(ev){ta.addEventListener(ev,function(){renderBar();placeBar();});});
ta.addEventListener('focus',function(){document.body.classList.add('typing');placeBar();});
$('fdone').addEventListener('click',function(){document.body.classList.remove('typing');ta.blur();placeBar();renderBar();});
ta.addEventListener('blur',function(){setTimeout(function(){if(document.activeElement!==ta&&!bar.contains(document.activeElement)){document.body.classList.remove('typing');placeBar();renderBar();}},150);});
['mousedown','pointerdown','touchstart'].forEach(function(ev){bar.addEventListener(ev,function(e){if(e.cancelable)e.preventDefault();},{passive:false});$('fab').addEventListener(ev,function(e){if(e.cancelable)e.preventDefault();},{passive:false});});
bar.addEventListener('touchend',function(e){var b=e.target.closest('button');if(!b)return;e.preventDefault();b.click();});
function pillTap(){var n=S.next;S.open=true;
 if(!S.hasSug&&n){if(n.key){S.guess=n.guess||null;ensureKey(n.key);}else if(n.act==='part'){newPart();}}
 renderBar();placeBar();ta.focus();}
$('fab').addEventListener('click',pillTap);
$('fab').addEventListener('touchend',function(e){e.preventDefault();pillTap();});
ta.addEventListener('click',function(){if(S.open){S.open=false;placeBar();}});
bar.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var d=b.dataset,c=caretInfo();
 if(d.act==='part'){S.more=false;newPart();}
 else if(d.act==='more'){S.more=true;renderBar();ta.focus();}
 else if(d.act==='less'){S.more=false;renderBar();ta.focus();}
 else if(d.key){var typed=c.pre.match(/^\s*[a-z]{1,6}$/i)&&c.pre.length===c.line.length&&c.line.trim()&&!/:/.test(c.line);
  if(typed)replaceLine(c,d.key+': ');else ensureKey(d.key);}
 else if(d.log){replaceLine(c,'log: '+d.log);labs.track('log_set',{via:'helper',log:d.log});}

function guessLog(p){var t=(p.name+'\n'+p.desc).toLowerCase();

function nextStep(){var c=caretInfo(),p=partAt(c.pos);
 if(!p||!c.line.trim()&&c.ls===blockStart(c.pos)&&!p)return {label:'+ Part',act:'part'};
 if(!p.log&&!/^\s*log\s*:/im.test(ta.value.split('\n').slice(p.start,p.end+1).join('\n'))){var g=guessLog(p);return {label:g?'log: '+L(g).w+'?':'log:',key:'log',guess:g};}
 var k=p.log?L(p.log).t:null;
 if(k&&!p.target)return {label:'target:',key:'target'};
 if(!p.time)return {label:'time:',key:'time'};
 return {label:'+ Part',act:'part'};}

  if(b.length>1)return b[0].textContent+' · '+b[1].textContent+(b.length>2?' · …':'');}

 w.innerHTML='<div class="phd"><div class="t"><div class="cap">Training · CrossFit · all classes</div><h1>This week</h1><div class="meta">Tap a day to write or edit it</div></div></div><div class="week">'+
